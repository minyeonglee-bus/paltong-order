<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>빨통 인쇄 스테이션</title>
<meta name="theme-color" content="#d33d2a">
<link rel="apple-touch-icon" href="admin-icon-192.png">
<link rel="icon" type="image/png" href="admin-icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body{ background:#f6efe6; }
  .wrap{ max-width:560px; margin:0 auto; padding:16px 16px calc(24px + env(safe-area-inset-bottom)); }
  .ps-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin:4px 0 14px; }
  .ps-head h1{ font-size:20px; margin:0; }
  .big{ border-radius:18px; padding:18px; color:#fff; background:#2f8f4e; margin-bottom:12px; }
  .big.warn{ background:#d33d2a; } .big.idle{ background:#6b6b6b; }
  .big b{ font-size:22px; display:block; margin-bottom:4px; }
  .big small{ opacity:.9; font-size:13px; line-height:1.5; display:block; }
  .jobs{ list-style:none; margin:0; padding:0; }
  .jobs li{ display:flex; justify-content:space-between; gap:8px; align-items:center; padding:9px 0; border-bottom:1px solid #eee; font-size:14px; }
  .jobs li:last-child{ border-bottom:0; }
  .jobs .t{ color:#888; font-size:12px; white-space:nowrap; }
  .jobs .who{ flex:1; min-width:0; }
  .jobs .who small{ display:block; color:#888; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .qbtn{ border:0; border-radius:12px; background:#d33d2a; color:#fff; font-weight:800; font-size:16px; padding:12px 16px; white-space:nowrap; }
  .qbtn.sm{ background:#eee; color:#333; font-size:13px; padding:7px 10px; font-weight:700; }
  #queue li{ padding:12px 0; }
  .ok{ color:#2f8f4e; font-weight:700; } .bad{ color:#d33d2a; font-weight:700; }
  .ps-steps{ display:block; font-size:14px; line-height:1.7; padding-left:20px; margin:6px 0 0; }
  .ps-steps li{ display:list-item; margin-bottom:6px; }
  .row{ display:flex; gap:8px; flex-wrap:wrap; }
  .row > *{ flex:1; }
  #tapQ{ font-size:20px; padding:22px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="ps-head"><h1>📡 <span data-t="빨통 인쇄 스테이션|PAL TONG Print Station"></span></h1>
    <span><button class="pill" id="langBtn">🌐 EN</button> <button class="pill" id="outBtn" hidden data-t="로그아웃|Log out"></button></span></div>

  <!-- 로그인 -->
  <div class="card" id="loginView" hidden>
    <h4 data-t="관리자 로그인|Admin sign-in"></h4>
    <p class="hint" style="margin-top:0" data-t="관리자 화면과 같은 아이디·비밀번호로 로그인하세요. 이 폰은 계속 로그인된 채로 있어요.|Use the same ID and password as the admin page. This phone stays signed in."></p>
    <div class="field"><label data-t="아이디|ID"></label><input id="lEmail" placeholder="Admin" autocapitalize="none"></div>
    <div class="field"><label data-t="비밀번호|Password"></label><input id="lPw" type="password"></div>
    <button class="primary-btn" id="lBtn" data-t="로그인|Sign in"></button>
  </div>

  <div id="appView" hidden>
    <div class="big idle" id="state"><b>…</b><small></small></div>

    <div class="card" id="queueCard" hidden>
      <h4><span data-t="📋 인쇄 대기|📋 Waiting to print"></span> <span class="en" id="qCount"></span></h4>
      <ul class="jobs" id="queue"></ul>
      <p class="hint" style="margin:6px 0 0" data-t="아이패드에서 🖨 누른 주문이 여기 쌓여요. <b>🖨 인쇄</b>를 누르면 RawBT로 바로 나가요.|Orders sent from the iPad 🖨 appear here. Tap <b>🖨 Print</b> to send them to RawBT."></p>
    </div>

    <div class="card">
      <h4 data-t="프린터로 보내는 방법|How to send to the printer"></h4>
      <div class="opt-choices" id="modes">
        <button class="opt-choice" data-m="tap" data-t="📋 목록에서 눌러서 인쇄 (RawBT 앱) — 추천|📋 Tap to print from the list (RawBT app) — recommended"></button>
        <button class="opt-choice" data-m="ws" data-t="⚡ 자동 인쇄 (Server for RawBT)|⚡ Auto print (Server for RawBT)"></button>
      </div>
      <div class="opt-group" style="margin-top:10px"><div class="opt-title" data-t="인쇄할 장|Slips to print"></div>
        <div class="opt-choices" id="psets"></div></div>
      <div class="row" style="margin-top:10px">
        <button class="primary-btn green" id="testBtn" data-t="테스트 인쇄|Test print"></button>
        <button class="primary-btn" id="retryBtn" style="background:#555" data-t="밀린 인쇄 다시|Retry waiting"></button>
      </div>
      <p class="hint" id="msg" style="margin:8px 0 0"></p>
    </div>

    <button class="primary-btn" id="noteBtn" style="margin-bottom:12px;background:#333" data-t="✏️ 자유 인쇄 (메모 · 마감 종이)|✏️ Free print (memo · closing slip)"></button>

    <div class="card">
      <h4 data-t="최근 인쇄|Recent prints"></h4>
      <ul class="jobs" id="jobs"></ul>
    </div>

    <details class="card" id="guide">
      <summary><b data-t="처음 설정 방법 (한 번만)|First-time setup (once)"></b></summary>
      <ol class="ps-steps">
        <li data-t="와이파이 프린터를 가게 와이파이에 연결하고, 프린터 <b>IP 주소</b>를 확인해요 (FEED 버튼을 누른 채 전원을 켜면 나오는 설정 종이의 IPADDR)|Connect the printer to the shop Wi-Fi and check its <b>IP address</b> (hold FEED while powering on → IPADDR on the slip)"></li>
        <li data-t="이 안드로이드폰도 <b>같은 와이파이</b>에 연결해요|Connect this Android phone to the <b>same Wi-Fi</b>"></li>
        <li data-t="Play 스토어에서 <b>RawBT</b> 앱을 설치하고 → 연결 방식 <b>WiFi or Ethernet</b> → 프린터 IP, 포트 <b>9100</b> → RawBT 안에서 테스트 인쇄|Install <b>RawBT</b> from Play Store → <b>WiFi or Ethernet</b> → printer IP, port <b>9100</b> → test print inside RawBT"></li>
        <li data-t="이 화면에서 <b>📋 목록에서 눌러서 인쇄</b>를 고르고 '테스트 인쇄' → 처음 한 번 'RawBT로 열기 · 항상'을 눌러요|Choose <b>📋 Tap to print</b> here and press 'Test print' → the first time, choose 'Open with RawBT · Always'"></li>
        <li data-t="(자동 인쇄를 쓰려면) <b>Server for RawBT</b> 앱도 설치해 켜두고 <b>⚡ 자동 인쇄</b>를 골라요|(For auto print) also install and run <b>Server for RawBT</b>, then choose <b>⚡ Auto print</b>"></li>
        <li data-t="이 폰은 <b>충전기에 꽂고 이 화면을 켜둔 채</b> 두세요. 아이패드 관리자 🖨 프린터 설정에서 <b>📡 와이파이 프린터 (인쇄 스테이션)</b>을 고르면 끝|Keep this phone <b>on the charger with this screen open</b>. On the iPad admin 🖨 Printer settings choose <b>📡 Wi-Fi printer (print station)</b>"></li>
      </ol>
    </details>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="menu.js"></script>
<script src="common.js"></script>
<script src="printer.js"></script>
<script>
const { api, ls, toast, esc } = PT;
const $ = id => document.getElementById(id);
let lang = ls.get("paltong_station_lang", "ko");
const T = (ko, en) => lang === "en" ? en : ko;
let mode = ls.get("paltong_station_mode", "tap");          // tap = 목록에서 눌러서 인쇄, ws = 자동
let stSet = ls.get("paltong_station_set", "ksc");          // follow = 아이패드 설정대로, 그 외 = 이 스테이션 설정
let recent = [], busy = false, tapQueue = [], lastOk = null, lastErr = "", wake = null;

/* ---------- 한/영 ---------- */
function applyLang(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => { const [ko, en] = el.dataset.t.split("|"); el.innerHTML = lang === "en" ? en : ko; });
  $("langBtn").textContent = lang === "en" ? "🌐 한국어" : "🌐 EN";
  document.title = T("빨통 인쇄 스테이션", "PAL TONG Print Station");
}
$("langBtn").onclick = () => { lang = lang === "en" ? "ko" : "en"; ls.set("paltong_station_lang", lang); applyLang(); if(!$("appView").hidden){ paintModes(); paintState(); paintJobs(); } };

/* ---------- 로그인 ---------- */
async function boot(){
  applyLang();
  if(await api.hasSession()) return start();
  $("loginView").hidden = false;
}
$("lBtn").onclick = async () => {
  $("lBtn").disabled = true;
  const id = $("lEmail").value.trim(), email = id.includes("@") ? id : `${id.toLowerCase()}@paltong.app`;
  try{ await api.signIn(email, $("lPw").value); $("loginView").hidden = true; start(); }
  catch(e){ toast(T("로그인 실패: ", "Sign-in failed: ") + (e.message || e), 4000); }
  $("lBtn").disabled = false;
};
$("lPw").addEventListener("keydown", e => { if(e.key === "Enter") $("lBtn").click(); });
$("outBtn").onclick = async () => { await api.signOut(); location.reload(); };

/* ---------- 인쇄할 장 (이 스테이션 설정이 아이패드 설정보다 우선) ---------- */
function kindsFor(set, o){
  if(set === "c") return ["customer"];
  if(set === "k") return ["kitchen"];
  if(set === "ksc") return ["kitchen", "staff", "customer"];
  const k = ["kitchen", "customer"];
  if(set === "kcr" && !PT.isDine(o) && o.order_type !== "pickup") k.push("rider");
  return k;
}
function copiesFor(job){
  if(job.payload && job.payload._note) return typeof job.copies === "number" ? job.copies : 1;   // ✏️ 자유 인쇄 = 적은 장수 그대로
  if(stSet !== "follow" && job.payload) return kindsFor(stSet, job.payload);
  const c = job.copies; return Array.isArray(c) || typeof c === "number" ? c : kindsFor(ls.get("paltong_print_set", "kc"), job.payload || {});
}

/* ---------- 화면 ---------- */
function paintModes(){
  document.querySelectorAll("[data-m]").forEach(b => b.classList.toggle("sel", b.dataset.m === mode));
  const sets = [["follow", "아이패드 설정대로", "Same as iPad"]].concat(Object.keys(PT.PRINT_SETS).map(k => [k, PT.PRINT_SETS[k], (PT.PRINT_SETS_EN || {})[k] || PT.PRINT_SETS[k]]));
  $("psets").innerHTML = sets.map(([k, ko, en]) => `<button class="opt-choice ${k === stSet ? "sel" : ""}" data-ps="${k}">${esc(T(ko, en))}</button>`).join("");
  $("psets").querySelectorAll("[data-ps]").forEach(b => b.onclick = () => { stSet = b.dataset.ps; ls.set("paltong_station_set", stSet); paintModes(); });
}
document.querySelectorAll("[data-m]").forEach(b => b.onclick = () => { mode = b.dataset.m; ls.set("paltong_station_mode", mode); paintModes(); paintState(); ping(); pump(); });
function ago(t){ const s = Math.max(0, Math.round((Date.now() - new Date(t)) / 1000)); return s < 60 ? T(`${s}초 전`, `${s}s ago`) : s < 3600 ? T(`${Math.round(s / 60)}분 전`, `${Math.round(s / 60)} min ago`) : T(`${Math.round(s / 3600)}시간 전`, `${Math.round(s / 3600)} h ago`); }
function paintState(){
  const el = $("state");
  if(mode === "tap" && tapQueue.length){
    el.className = "big warn"; el.innerHTML = `<b>${T(`🖨 인쇄 ${tapQueue.length}건 대기`, `🖨 ${tapQueue.length} waiting to print`)}</b><small>${T("아래 목록에서 🖨 인쇄를 눌러주세요", "Tap 🖨 Print in the list below")}</small>`;
  } else if(lastErr){
    el.className = "big warn"; el.innerHTML = `<b>${T("⚠ 인쇄가 안 돼요", "⚠ Printing failed")}</b><small>${esc(lastErr)}<br>${T("프린터 전원·와이파이, RawBT 앱을 확인 → '밀린 인쇄 다시'", "Check printer power / Wi-Fi and RawBT → 'Retry waiting'")}</small>`;
  } else {
    el.className = "big"; el.innerHTML = `<b>${T("🟢 인쇄 대기 중", "🟢 Ready")}</b><small>${mode === "ws" ? T("아이패드에서 🖨 인쇄를 누르면 바로 나와요", "Prints right away when the iPad presses 🖨") : T("아이패드에서 🖨 누르면 아래 목록에 떠요 → 🖨 인쇄", "iPad 🖨 → appears in the list below → 🖨 Print")}${lastOk ? `<br>${T("마지막 인쇄", "Last print")}: ${ago(lastOk)}` : ""}${wake ? "" : `<br>${T("⚠ 화면 꺼짐 방지가 꺼져 있어요 — 화면을 한 번 눌러주세요", "⚠ Screen may sleep — tap the screen once")}`}</small>`;
  }
  paintQueue();
}
const itemsText = p => ((p && p.items) || []).filter(l => !l.svc || l.couponFree).map(l => `${lang === "en" ? (l.en || l.name) : (l.name || l.en)} ×${l.qty}`).join(", ");
const nSlips = j => { const c = copiesFor(j); return Array.isArray(c) ? c.length : c; };
function paintQueue(){
  $("queueCard").hidden = mode !== "tap";
  if(mode !== "tap") return;
  $("qCount").textContent = tapQueue.length ? T(`${tapQueue.length}건`, `${tapQueue.length}`) : "";
  $("queue").innerHTML = tapQueue.length ? tapQueue.map(j => `<li><span class="who"><b>${esc(j.label || T("주문", "Order"))}</b><small>${esc(itemsText(j.payload))} · ${T(`${nSlips(j)}장`, `${nSlips(j)} slips`)} · ${ago(j.created_at)}</small></span>
      <button class="qbtn" data-print="${esc(j.id)}">${T("🖨 인쇄", "🖨 Print")}</button></li>`).join("") : `<li class="hint">${T("대기 중인 인쇄가 없어요", "Nothing waiting")}</li>`;
  $("queue").querySelectorAll("[data-print]").forEach(b => b.onclick = () => printById(b.dataset.print, tapQueue));
}
async function paintJobs(){
  try{
    const list = await api.printJobsRecent();
    recent = list;
    $("jobs").innerHTML = list.length ? list.map(j => `<li><span class="who">${esc(j.label || T("주문", "Order"))}<small>${esc(itemsText(j.payload))}</small></span>
      <span class="t">${j.printed_at ? `<span class="ok">${T("✔ 인쇄됨", "✔ Printed")}</span>` : j.error ? `<span class="bad">${T(`✖ 실패 ${j.tries}회`, `✖ Failed ×${j.tries}`)}</span>` : T("대기", "Waiting")} · ${ago(j.created_at)}</span>
      ${j.payload ? `<button class="qbtn sm" data-reprint="${esc(j.id)}">${T("다시", "Again")}</button>` : ""}</li>`).join("") : `<li class="hint">${T("아직 없어요", "None yet")}</li>`;
    $("jobs").querySelectorAll("[data-reprint]").forEach(b => b.onclick = () => mode === "tap" ? printById(b.dataset.reprint, recent) : reprintWs(b.dataset.reprint));
  }catch(e){ $("jobs").innerHTML = `<li class="bad">${esc(PT.errMsg(e))}</li>`; }
}

/* ---------- 인쇄 ---------- */
async function bytesFor(job){
  await (document.fonts && document.fonts.ready);
  return PTPrinter.buildJob([job.payload], copiesFor(job));
}
/* 👆 눌러서 인쇄: 버튼을 누른 순간 RawBT 앱으로 넘김 (누르지 않고 자동으로 여는 건 Chrome이 막음) */
async function printById(id, list){
  const j = list.find(x => x.id === id); if(!j) return;
  try{
    const b = await bytesFor(j);
    if(!j.printed_at) await api.printJobDone(j.id).catch(() => {});
    tapQueue = tapQueue.filter(x => x.id !== id);
    lastOk = new Date().toISOString();
    PTPrinter.rawbtSend(b);
  }catch(e){ toast(PT.errMsg(e), 4000); }
  paintState(); setTimeout(paintJobs, 800);
}
async function reprintWs(id){
  const j = recent.find(x => x.id === id); if(!j) return;
  try{ await PTPrinter.rawbtWsSend(await bytesFor(j)); toast(T("다시 인쇄했어요", "Printed again"), 2500); }
  catch(e){ toast(e.message || String(e), 4500); }
}
let seen = null;
function alertNew(jobs){
  const ids = jobs.map(j => j.id);
  if(seen && ids.some(id => !seen.has(id))){
    try{ navigator.vibrate && navigator.vibrate([200, 100, 200]); }catch(e){}
    try{ const A = window.AudioContext || window.webkitAudioContext, ctx = alertNew.ctx || (alertNew.ctx = new A());
      [0, 0.25].forEach(t => { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = 880; g.gain.value = 0.25; o.connect(g); g.connect(ctx.destination); o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.15); }); }catch(e){}
  }
  seen = new Set(ids);
}
async function pump(force){
  if(busy) return; busy = true;
  try{
    const jobs = await api.printJobsPending();
    alertNew(jobs);
    if(mode === "tap"){ tapQueue = jobs; return; }
    for(const j of jobs){
      if(!force && j.tries >= 3) continue;                       // 3번 실패한 건 '밀린 인쇄 다시'를 눌러야 다시 시도
      try{
        await PTPrinter.rawbtWsSend(await bytesFor(j));
        await api.printJobDone(j.id);
        lastOk = new Date().toISOString(); lastErr = "";
      }catch(e){
        lastErr = e.message || String(e);
        await api.printJobDone(j.id, lastErr, j.tries).catch(() => {});
        break;                                                    // 프린터 문제면 다음 건도 안 될 테니 멈춤
      }
    }
  }catch(e){ lastErr = PT.errMsg(e); }
  finally{ busy = false; paintState(); paintJobs(); }
}
$("noteBtn").onclick = () => PTPrinter.openNoteEditor({ en: lang === "en",
  loadOrders: day => api.listOrdersByDay(day),
  onPrint: async (note, copies) => {
    const job = { payload: { _note: note }, copies };
    const b = await bytesFor(job);
    if(mode === "tap") PTPrinter.rawbtSend(b); else await PTPrinter.rawbtWsSend(b);
  } });
$("retryBtn").onclick = () => { lastErr = ""; pump(true); };
$("testBtn").onclick = async () => {
  const sample = { order_no: 0, created_at: new Date().toISOString(), status:"confirmed", payment:"cash",
    items:[{ id:"test", name:"테스트 인쇄", en:"Test print", opts:[], unitPrice:100, qty:1 }], subtotal:100, delivery_fee:0, total:100,
    cust_name:"인쇄 스테이션 Test", cust_phone:"0917 000 0000", cust_addr:"PAL TONG", memo:"📡 인쇄 스테이션 테스트 / Print station test" };
  $("msg").textContent = T("보내는 중…", "Sending…");
  try{
    const b = await bytesFor({ payload: sample, copies: 1 });
    if(mode === "tap"){ PTPrinter.rawbtSend(b); $("msg").textContent = T("RawBT로 보냈어요. 영수증이 나왔는지 확인하세요.", "Sent to RawBT. Check the printer."); }
    else { await PTPrinter.rawbtWsSend(b); lastErr = ""; $("msg").textContent = T("✔ RawBT가 인쇄 완료라고 알려왔어요.", "✔ RawBT reported the print is done."); }
  }catch(e){ $("msg").textContent = "✖ " + (e.message || e) + T(" — 📋 목록에서 눌러서 인쇄 방식을 써보세요.", " — try 📋 Tap to print."); }
  paintState();
};

/* ---------- 살아 있음 알림 · 화면 켜두기 ---------- */
async function ping(){ try{ await api.printStationPing(mode === "ws" ? T("자동", "auto") : T("눌러서 인쇄", "tap to print")); }catch(e){ lastErr = PT.errMsg(e); paintState(); } }
async function keepAwake(){
  try{ if("wakeLock" in navigator && !wake){ wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release", () => { wake = null; paintState(); }); } }catch(e){}
  paintState();
}
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible"){ keepAwake(); ping(); pump(); } });
document.addEventListener("click", keepAwake);

function start(){
  $("appView").hidden = false; $("outBtn").hidden = false;
  $("guide").open = !ls.get("paltong_station_setup_done", false);
  paintModes(); keepAwake(); ping(); pump(); paintJobs();
  api.printJobsCleanup && api.printJobsCleanup().catch(() => {});
  try{ api.onPrintJobs(() => pump()); }catch(e){}
  setInterval(ping, 30000);
  setInterval(() => pump(), 8000);                 // 실시간 알림을 놓쳐도 8초마다 확인
  setInterval(paintState, 30000);
}
$("guide").addEventListener("toggle", () => { if(!$("guide").open) ls.set("paltong_station_setup_done", true); });
boot();
</script>
