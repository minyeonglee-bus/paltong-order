      <div class="field"><label>${L("지금 비밀번호", "Current password")}</label><input data-f="old" type="password" inputmode="numeric" autocomplete="off"></div>
      <div class="field"><label>${L("새 비밀번호 (4자리 이상)", "New password (4+)")}</label><input data-f="new" type="password" inputmode="numeric" autocomplete="off"></div>
      <div class="field"><label>${L("새 비밀번호 한 번 더", "New password again")}</label><input data-f="new2" type="password" inputmode="numeric" autocomplete="off"></div>`,
    async ov => { const f = readFields(ov); if(f.new !== f.new2){ toast(L("새 비밀번호가 서로 달라요", "New passwords don't match")); return false; }
      try{ await api.changePricePin(f.old, f.new); toast(L("가격 비밀번호를 바꿨습니다", "Price password changed")); }catch(e){ toast(PT.errMsg(e), 4000); return false; } }, L("바꾸기", "Change"));
}

/* ---- 🏷 일괄 할인: 전체(또는 고른 카테고리) 메뉴에 % 할인가를 한 번에 넣기 / 빼기 ----
   할인가 = 정가 × (100 − %) ÷ 100 을 고른 단위로 내림 (예: 10% · 10페소 단위 → ₱1,500 은 ₱1,350, ₱799 는 ₱710)
   저장은 메뉴판 저장과 같아서 가격 비밀번호를 한 번 물어봅니다 */
function bulkSalePrice(price, pct, step){
  const raw = price * (100 - pct) / 100;
  const v = Math.floor(raw / step) * step;
  return v > 0 && v < price ? v : 0;
}
function openBulkSale(){
  const cats = MENU.filter(c => c.items.length);
  const ov = modal(L("🏷 일괄 할인", "🏷 Bulk sale"), `
    <div class="field"><label>${L("할인율 %", "Discount %")}</label>
      <input data-f="pct" type="number" min="1" max="90" inputmode="numeric" value="10" style="font-size:18px;font-weight:800"></div>
    <div class="field"><label>${L("할인가 끝자리", "Round sale price down to")}</label>
      <select data-f="step" class="note-in" style="margin:0"><option value="1">${L("1페소 단위", "₱1")}</option><option value="5">${L("5페소 단위", "₱5")}</option><option value="10" selected>${L("10페소 단위", "₱10")}</option></select></div>
    <div class="field"><label>${L("적용할 카테고리", "Categories")}</label>
      <div style="display:flex;gap:6px;margin-bottom:6px"><button class="chip" type="button" data-ball>${L("모두 선택", "All")}</button><button class="chip" type="button" data-bnone>${L("모두 해제", "None")}</button></div>
      <div style="display:flex;flex-direction:column;gap:6px;max-height:220px;overflow:auto">
        ${cats.map(c => `<label class="cp-row"><input type="checkbox" data-bcat="${esc(c.cat)}" checked><span data-raw>${esc(c.cat)} <span class="en">${esc(c.catEn)}</span></span><span class="hint">${c.items.length}</span></label>`).join("")}
      </div></div>
    <label class="cp-row" style="margin-bottom:6px"><input type="checkbox" data-f="dine"><span>🍽 ${L("다이닝(T) 주문에도 할인가 적용 — 체크 안 하면 다이닝은 정가", "Dine-in (T) orders also get the sale price — unchecked = full price for dining")}</span></label>
    <label class="cp-row" style="margin-bottom:10px"><input type="checkbox" data-f="keep"><span>${L("이미 할인 중인 메뉴는 그대로 두기", "Keep items that already have a sale price")}</span></label>
    <div class="calc-box" data-bprev style="margin-bottom:10px"></div>
    <button class="ghost-btn" type="button" data-bclear style="width:100%;margin-bottom:8px">🧹 ${L("고른 카테고리 할인 모두 빼기 (정가로)", "Remove all sale prices in chosen categories")}</button>`,
    async ov => {
      const r = calc(); if(!r) return false;
      if(!r.list.length){ toast(L("바뀌는 메뉴가 없어요", "Nothing to change")); return false; }
      if(!confirm(L(`${r.list.length}개 메뉴에 ${r.pct}% 할인가를 넣을까요?`, `Apply ${r.pct}% to ${r.list.length} items?`))) return false;
      const ids = new Map(r.list.map(x => [x.it.id, x.sale])), dine = !!readFields(ov).dine;
      const ok = await editMenu(cfg => { cfg.forEach(c => c.items.forEach(it => { if(ids.has(it.id)){ it.sale = ids.get(it.id); if(dine) it.saleDine = true; else delete it.saleDine; } })); },
        L(`🏷 ${r.list.length}개 메뉴 ${r.pct}% 할인 적용`, `🏷 ${r.pct}% sale on ${r.list.length} items`),
        L(`일괄 할인 ${r.pct}% · ${r.list.length}개 메뉴`, `Bulk sale ${r.pct}% · ${r.list.length} items`));
      return ok ? undefined : false;
    }, L("할인 적용", "Apply sale"));
  const chosen = () => new Set([...ov.querySelectorAll("[data-bcat]:checked")].map(i => i.dataset.bcat));
  const items = () => { const cs = chosen(); return MENU.filter(c => cs.has(c.cat)).flatMap(c => c.items); };
  function calc(){
    const f = readFields(ov), pct = Math.round(+f.pct), step = +f.step || 1;
    if(!(pct >= 1 && pct <= 90)){ toast(L("할인율은 1~90% 사이로 넣어주세요", "Enter 1–90%")); return null; }
    const list = items().filter(it => !(f.keep && it.onSale)).map(it => ({ it, sale: bulkSalePrice(it.listPrice, pct, step) })).filter(x => x.sale > 0 && x.sale !== (x.it.onSale ? x.it.price : 0));
    return { pct, step, list };
  }
  function preview(){
    const f = readFields(ov), pct = Math.round(+f.pct), box = ov.querySelector("[data-bprev]");
    if(!(pct >= 1 && pct <= 90)){ box.innerHTML = `<span class="hint">${L("할인율을 넣으면 미리보기가 나와요", "Enter a % to preview")}</span>`; return; }
    const r = calc(); if(!r) return;
    box.innerHTML = `<b>${L(`${r.list.length}개 메뉴가 바뀌어요`, `${r.list.length} items will change`)}</b>` +
      r.list.slice(0, 6).map(x => `<div class="sum-row"><span data-raw>${esc(x.it.name)}</span><span><s class="hint">${peso(x.it.listPrice)}</s> → <b style="color:var(--red-deep)">${peso(x.sale)}</b></span></div>`).join("") +
      (r.list.length > 6 ? `<div class="hint">${L(`… 외 ${r.list.length - 6}개`, `… and ${r.list.length - 6} more`)}</div>` : "");
  }
  ov.querySelectorAll("input,select").forEach(i => { i.addEventListener("input", preview); i.addEventListener("change", preview); });
  ov.querySelector("[data-ball]").onclick = () => { ov.querySelectorAll("[data-bcat]").forEach(i => i.checked = true); preview(); };
  ov.querySelector("[data-bnone]").onclick = () => { ov.querySelectorAll("[data-bcat]").forEach(i => i.checked = false); preview(); };
  ov.querySelector("[data-bclear]").onclick = async () => {
    const list = items().filter(it => it.onSale);
    if(!list.length) return toast(L("고른 카테고리에 할인 중인 메뉴가 없어요", "No sale items in chosen categories"));
    if(!confirm(L(`${list.length}개 메뉴의 할인가를 빼고 정가로 돌릴까요?`, `Remove the sale price from ${list.length} items?`))) return;
    const ids = new Set(list.map(it => it.id));
    const ok = await editMenu(cfg => { cfg.forEach(c => c.items.forEach(it => { if(ids.has(it.id)){ delete it.sale; delete it.saleDine; } })); },
      L(`🧹 ${list.length}개 메뉴 할인을 뺐어요`, `🧹 Removed sale from ${list.length} items`), L(`할인 빼기 · ${list.length}개 메뉴`, `Remove sale · ${list.length} items`));
    if(ok) ov.remove();
  };
  preview();
}

/* ---- ✏️ 메뉴 편집 창 (이름 · 가격 · 할인 · 카테고리 · 표시 · 옵션 전부) ---- */
function openItemEditor(id){
  const src = id ? (PT.exportMenu().flatMap(c => c.items.map(it => ({ ...it, cat: c.cat }))).find(x => x.id === id)) : null;
  const ed = src ? JSON.parse(JSON.stringify(src)) : { id: "m_" + Date.now().toString(36), name: "", en: "", price: "", cat: (PT.CATS[0] || {}).cat, options: [] };
  ed.options = (ed.options || []).map(g => ({ title: g.title || "", titleEn: g.titleEn || "", kind: g.type === "count" ? "count" : (g.max || 1) > 1 ? "multi" : "one", max: g.max || 2,
    // 필수 여부: 값이 없던 예전 옵션은 '하나만 고르기'=필수, 여러 개/수량=선택
    required: g.required != null ? !!g.required : !(g.type === "count" || (g.max || 1) > 1),
    choices: (g.choices || []).map(c => ({ label: c.label || "", en: c.en || "", delta: c.delta || 0, maxQty: c.maxQty || 2 })) }));
  const ov = modal(id ? `✏️ ${L("메뉴 수정", "Edit item")}` : `➕ ${L("새 메뉴", "New item")}`, `<div id="edBody"></div>`, async () => {
    sync();
    const name = ed.name.trim(), price = Math.round(+ed.price), sale = ed.sale === "" || ed.sale == null ? 0 : Math.round(+ed.sale);
    if(!name) { toast(L("메뉴 이름을 넣어주세요", "Enter a name")); return false; }
    if(!(price > 0)) { toast(L("정가를 숫자로 넣어주세요", "Enter a price")); return false; }
    if(isNaN(sale) || sale < 0 || (sale && sale >= price)) { toast(L("할인가는 정가보다 낮게 (비우면 할인 없음)", "Sale must be below the price (empty = none)")); return false; }
    for(const g of ed.options){
      if(!g.title.trim()) { toast(L("옵션 그룹 이름을 넣어주세요 (예: 맵기)", "Name each option group")); return false; }
      if(!g.choices.length || g.choices.some(c => !c.label.trim())) { toast(L(`'${g.title}' 선택지 이름을 넣어주세요`, `Fill in the choices of '${g.title}'`)); return false; }
      if(g.choices.some(c => isNaN(+c.delta) || +c.delta < 0)) { toast(L("옵션 추가금은 0 이상 숫자", "Add-on prices must be 0 or more")); return false; }
    }
    const item = { id: ed.id, name, en: (ed.en || "").trim(), price };
    if(sale) item.sale = sale;
    ["isNew", "isHot", "isLimited", "hidden", "saleDine"].forEach(k => { if(ed[k]) item[k] = true; });
    if(ed.requires && ed.requires.length) item.requires = ed.requires;
    if(ed.options.length) item.options = ed.options.map(g => {
      const o = { title: g.title.trim(), titleEn: g.titleEn.trim() || g.title.trim() };
      if(g.kind === "count") o.type = "count"; if(g.kind === "multi") o.max = Math.max(2, Math.round(+g.max || 2));
      o.required = g.required === true || g.required === "1";
      o.choices = g.choices.map(c => { const x = { label: c.label.trim(), en: c.en.trim() || c.label.trim(), delta: Math.round(+c.delta || 0) }; if(g.kind === "count") x.maxQty = Math.max(1, Math.round(+c.maxQty || 1)); return x; });
      return o; });
    const okd = await editMenu(cfg => {
      const f = menuFind(cfg, ed.id), to = cfg.find(c => c.cat === ed.cat) || cfg[0];
      if(f){ if(f.cat === to) f.cat.items[f.i] = item; else { f.cat.items.splice(f.i, 1); to.items.push(item); } }
      else to.items.push(item);
    }, id ? L(`${name} 저장했습니다`, `${name} saved`) : L(`${name} 메뉴를 추가했습니다`, `${name} added`), `${name} — ${peso(sale || price)}`);
    return okd ? undefined : false;
  }, L("저장", "Save"));
  ov.querySelector(".sheet").style.maxWidth = "640px";
  const B = ov.querySelector("#edBody");
  const kindSel = g => `<select data-g="kind">${[["one", L("하나만 고르기", "Pick one")], ["multi", L("여러 개 고르기", "Pick several")], ["count", L("수량 (−/+)", "Quantity (−/+)")]].map(([v, l]) => `<option value="${v}" ${g.kind === v ? "selected" : ""}>${l}</option>`).join("")}</select>`;
  const reqSel = g => { const on = g.required === true || g.required === "1";
    return `<select data-g="required" style="${on ? "border-color:var(--red-deep);color:var(--red-deep);font-weight:700" : ""}">${[["1", L("필수 옵션", "Required")], ["0", L("필수 아님 (선택)", "Optional")]].map(([v, l]) => `<option value="${v}" ${(v === "1") === on ? "selected" : ""}>${l}</option>`).join("")}</select>`; };
  function paint(){
    B.innerHTML = `
      <div class="fee-row" style="gap:8px;margin:0 0 8px"><div class="field" style="flex:1;margin:0"><label>${L("메뉴 이름 (한국어)", "Name (Korean)")}</label><input data-e="name" value="${esc(ed.name)}"></div>
        <div class="field" style="flex:1;margin:0"><label>${L("영어 이름", "Name (English)")}</label><input data-e="en" value="${esc(ed.en || "")}"></div></div>
      <div class="fee-row" style="gap:8px;margin:0 0 8px">
        <div class="field" style="flex:1;margin:0"><label>${L("정가 ₱", "Price ₱")} 🔒</label><input data-e="price" type="number" min="1" inputmode="numeric" value="${esc(ed.price)}"></div>
        <div class="field" style="flex:1;margin:0"><label>${L("할인가 ₱ (비우면 없음)", "Sale ₱ (empty = none)")} 🔒</label><input data-e="sale" type="number" min="0" inputmode="numeric" value="${esc(ed.sale || "")}"></div>
        <div class="field" style="flex:1.3;margin:0"><label>${L("카테고리", "Category")}</label><select data-e="cat" class="note-in" style="margin:0">${PT.CATS.map(c => `<option value="${esc(c.cat)}" ${c.cat === ed.cat ? "selected" : ""}>${esc(c.cat)}</option>`).join("")}</select></div></div>
      <div class="chips" style="margin:0 0 10px">${[["isNew", "🆕 " + L("신메뉴", "NEW")], ["isHot", "🔥 " + L("인기", "BEST")], ["isLimited", "★ " + L("한정 표시", "Limited tag")], ["hidden", "🙈 " + L("손님 화면에서 숨기기", "Hide from customers")], ["saleDine", "🍽 " + L("다이닝도 할인가", "Sale price for dining too")]]
        .map(([k, l]) => `<label class="chip ${ed[k] ? "sel" : ""}" style="cursor:pointer"><input type="checkbox" data-e="${k}" ${ed[k] ? "checked" : ""} style="margin-right:4px">${l}</label>`).join("")}</div>
      <h4 style="margin:6px 0">${L("옵션", "Options")} <span class="hint">${L("— 추가금 바꾸면 🔒 비밀번호", "— changing add-on prices needs 🔒 password")}</span></h4>
      ${ed.options.map((g, gi) => `<div class="calc-box" data-gi="${gi}" style="margin:0 0 8px">
        <div class="mm-ctl" style="margin:0 0 6px"><input data-g="title" value="${esc(g.title)}" placeholder="${L("그룹 이름 (예: 맵기)", "Group (e.g. Spice)")}" style="width:130px">
          <input data-g="titleEn" value="${esc(g.titleEn)}" placeholder="English" style="width:150px">${kindSel(g)}${reqSel(g)}
          ${g.kind === "multi" ? `<label class="hint">${L("최대", "max")}</label><input data-g="max" type="number" min="2" value="${esc(g.max)}" style="width:56px">` : ""}
          <button class="chip" data-gup="${gi}" ${gi === 0 ? "disabled" : ""}>▲</button><button class="chip" data-gdel="${gi}">🗑 ${L("그룹 삭제", "Delete group")}</button></div>
        ${g.choices.map((c, ci) => `<div class="mm-ctl" data-ci="${ci}" style="margin:0 0 4px;padding-left:10px">
          <input data-c="label" value="${esc(c.label)}" placeholder="${L("선택지 (예: 덜맵게)", "Choice (Korean)")}" style="width:130px">
          <input data-c="en" value="${esc(c.en)}" placeholder="English" style="width:170px">
          <label class="hint">+₱</label><input data-c="delta" type="number" min="0" value="${esc(c.delta)}" style="width:70px">
          ${g.kind === "count" ? `<label class="hint">${L("최대 개수", "max qty")}</label><input data-c="maxQty" type="number" min="1" value="${esc(c.maxQty)}" style="width:56px">` : ""}
          <button class="chip" data-cdel="${gi}:${ci}">✕</button></div>`).join("")}
        <button class="chip" data-cadd="${gi}" style="margin-left:10px">+ ${L("선택지 추가", "Add choice")}</button></div>`).join("")}
      <button class="chip" id="gAdd">+ ${L("옵션 그룹 추가", "Add option group")}</button>
      ${id ? `<div class="btn-row" style="margin-top:14px"><button class="ghost-btn sm" id="edDel" style="color:var(--red-deep)">🗑 ${L("이 메뉴 삭제", "Delete this item")} 🔒</button></div>` : ""}`;
    B.querySelectorAll('input[type="checkbox"][data-e]').forEach(x => x.onchange = () => { sync(); paint(); });
    B.querySelectorAll('[data-g="kind"], [data-g="required"]').forEach(x => x.onchange = () => { sync(); paint(); });
    B.querySelectorAll("[data-cadd]").forEach(x => x.onclick = () => { sync(); ed.options[+x.dataset.cadd].choices.push({ label:"", en:"", delta:0, maxQty:2 }); paint(); });
    B.querySelectorAll("[data-cdel]").forEach(x => x.onclick = () => { sync(); const [gi, ci] = x.dataset.cdel.split(":").map(Number); ed.options[gi].choices.splice(ci, 1); paint(); });
    B.querySelectorAll("[data-gdel]").forEach(x => x.onclick = () => { sync(); ed.options.splice(+x.dataset.gdel, 1); paint(); });
    B.querySelectorAll("[data-gup]").forEach(x => x.onclick = () => { sync(); const i = +x.dataset.gup; [ed.options[i - 1], ed.options[i]] = [ed.options[i], ed.options[i - 1]]; paint(); });
    B.querySelector("#gAdd").onclick = () => { sync(); ed.options.push({ title:"", titleEn:"", kind:"one", max:2, required:true, choices:[{ label:"", en:"", delta:0, maxQty:2 }] }); paint(); };
    const del = B.querySelector("#edDel"); if(del) del.onclick = async () => {
      if(!confirm(L(`'${ed.name}' 메뉴를 삭제할까요? (잠깐 빼두려면 '숨기기'를 쓰세요)`, `Delete '${ed.name}'? (Use 'Hide' to remove it temporarily)`))) return;
      const okd = await editMenu(cfg => { const f = menuFind(cfg, ed.id); if(f) f.cat.items.splice(f.i, 1); }, L(`${ed.name} 삭제했습니다`, `${ed.name} deleted`), L(`${ed.name} 삭제`, `Delete ${ed.name}`));
      if(okd) ov.remove();
    };
  }
  function sync(){
    B.querySelectorAll("[data-e]").forEach(x => { ed[x.dataset.e] = x.type === "checkbox" ? x.checked : x.value; });
    B.querySelectorAll("[data-gi]").forEach(gEl => { const g = ed.options[+gEl.dataset.gi];
      gEl.querySelectorAll(":scope > .mm-ctl:first-child [data-g]").forEach(x => { g[x.dataset.g] = x.dataset.g === "required" ? x.value === "1" : x.value; });
      gEl.querySelectorAll("[data-ci]").forEach(cEl => { const c = g.choices[+cEl.dataset.ci]; cEl.querySelectorAll("[data-c]").forEach(x => { c[x.dataset.c] = x.value; }); }); });
  }
  paint();
}

/* ---- 📂 카테고리 관리 (이름 · 영어 이름 · 순서 · 추가 · 빈 카테고리 삭제) ---- */
function openCatManager(){
  const cfg0 = PT.exportMenu();
  let rows = cfg0.map(c => ({ orig: c.cat, cat: c.cat, catEn: c.catEn, n: c.items.length }));
  const ov = modal(`📂 ${L("카테고리 관리", "Categories")}`, `<div id="cmBody"></div><p class="hint">${L("메뉴가 있는 카테고리는 삭제할 수 없어요 (메뉴를 먼저 옮기세요).", "Categories with items can't be deleted (move the items first).")}</p>`, async () => {
    sync();
    if(rows.some(r => !r.cat.trim())) { toast(L("카테고리 이름을 넣어주세요", "Enter category names")); return false; }
    if(new Set(rows.map(r => r.cat.trim())).size !== rows.length) { toast(L("같은 이름의 카테고리가 있어요", "Duplicate category names")); return false; }
    const okd = await editMenu(cfg => { const by = Object.fromEntries(cfg.map(c => [c.cat, c]));
      const next = rows.map(r => ({ cat: r.cat.trim(), catEn: r.catEn.trim() || r.cat.trim(), ...((by[r.orig] || {}).limited ? { limited: true } : {}), items: r.orig && by[r.orig] ? by[r.orig].items : [] }));
      cfg.length = 0; next.forEach(c => cfg.push(c)); }, L("카테고리를 저장했습니다", "Categories saved"));
    return okd ? undefined : false;
  }, L("저장", "Save"));
  const B = ov.querySelector("#cmBody");
  function paint(){
    B.innerHTML = rows.map((r, i) => `<div class="mm-ctl" data-ri="${i}" style="margin:0 0 6px">
      <input data-r="cat" value="${esc(r.cat)}" placeholder="${L("이름", "Name")}" style="width:150px"><input data-r="catEn" value="${esc(r.catEn)}" placeholder="English" style="width:130px">
      <span class="hint">${r.n}${L("개", "")}</span>
      <button class="chip" data-rup="${i}" ${i === 0 ? "disabled" : ""}>▲</button><button class="chip" data-rdown="${i}" ${i === rows.length - 1 ? "disabled" : ""}>▼</button>
      <button class="chip" data-rdel="${i}" ${r.n ? "disabled" : ""}>🗑</button></div>`).join("") + `<button class="chip" id="cmAdd">+ ${L("카테고리 추가", "Add category")}</button>`;
    B.querySelectorAll("[data-rup]").forEach(x => x.onclick = () => { sync(); const i = +x.dataset.rup; [rows[i - 1], rows[i]] = [rows[i], rows[i - 1]]; paint(); });

/* 💳 결제 방법 바꾸기 — 완료된 주문 · 이미 받은 주문도 가격 비밀번호를 넣으면 수정 (캐시북도 자동으로 맞춰짐) */
function editPayModal(o){
  const total = o.total ?? o.subtotal ?? 0, done = o.status === "done" || o.received_amount != null || o.paid_total != null;
  const cur = o.received_method === "split" ? "split" : (o.payment || "cash");
  const WAYS = [["cash", L("💵 현금", "💵 Cash")], ["gcash", "GCash"], ["maya", "Maya"], ["bank", L("🏦 계좌이체", "🏦 Bank")]];
  const sp = o.split_pay && typeof o.split_pay === "object" ? o.split_pay : {};
  const ov = modal(`💳 ${esc(PT.orderCode(o))} ${L("결제 방법 바꾸기", "Change payment method")}`, `
    <p class="hint" style="margin-top:0">${L("지금", "Now")}: <b>${esc(cur === "split" ? L("나눠 받음", "Split") : PAY_NAME(cur))}</b> · ${L("금액", "Amount")} <b>${peso(total)}</b>${done ? ` · <span style="color:#b45309">${L("완료·결제된 주문 — 비밀번호 필요", "Done/paid order — password needed")}</span>` : ""}</p>
    <div class="chips" id="epWays">${WAYS.map(([k, n]) => `<button type="button" class="chip ${cur === k ? "sel" : ""}" data-pw="${k}" style="padding:10px 14px;font-size:15px">${n}</button>`).join("")}
      <button type="button" class="chip ${cur === "split" ? "sel" : ""}" data-pw="split" style="padding:10px 14px;font-size:15px">🔀 ${L("나눠 받음", "Split")}</button></div>
    <div id="epSplit" class="calc-box" style="margin:10px 0 0" ${cur === "split" ? "" : "hidden"}>
      ${WAYS.map(([k, n]) => `<div class="field" style="margin:0 0 8px;display:flex;gap:8px;align-items:center"><label style="width:110px;margin:0">${n}</label><input type="number" inputmode="numeric" min="0" data-sp="${k}" value="${+sp[k] || ""}" placeholder="0" style="font-size:16px"></div>`).join("")}
      <div class="sum-row total" id="epSum"><span>${L("합계", "Total")}</span><b>—</b></div></div>
    <p class="hint" style="margin:10px 0 0">🔒 ${L("저장할 때 가격 비밀번호를 물어봐요. 매출·캐시북의 결제 방법도 같이 바뀌어요.", "You'll be asked for the price password. Sales and the Cash Book are updated too.")}</p>`,
    async ov => {
      const way = ov._way;
      let patch;
      if(way === "split"){
        const parts = {}; ov.querySelectorAll("[data-sp]").forEach(i => { const v = Math.max(0, Math.round(+i.value || 0)); if(v) parts[i.dataset.sp] = v; });
        const keys = Object.keys(parts), sum = keys.reduce((a, k) => a + parts[k], 0);
        if(keys.length < 2){ toast(L("두 가지 이상 결제 방법에 금액을 넣어주세요", "Enter amounts for at least two methods"), 3500); return false; }
        if(sum !== total && !confirm(L(`나눠 받은 합계 ${peso(sum)} 가 주문 금액 ${peso(total)} 와 달라요. 그래도 저장할까요?`, `Split total ${peso(sum)} differs from ${peso(total)}. Save anyway?`))) return false;
        const main = keys.sort((a, b) => parts[b] - parts[a])[0];
        patch = { payment: main, received_method: "split", split_pay: parts, ...(done ? { received_amount: sum } : {}) };
        if(keys.some(k => k !== "cash") && done) patch.paid_total = total;
      } else {
        if(way === cur){ toast(L("바뀐 게 없어요", "Nothing changed")); return false; }
        patch = { payment: way, split_pay: null, ...(done || o.received_method ? { received_method: way } : {}) };
        if(done && way !== "cash" && o.paid_total == null) patch.paid_total = total;
      }
      const pin = await askPricePin(L(`${PT.orderCode(o)} 결제 방법을 ${way === "split" ? "나눠 받음" : PAY_NAME(way)}(으)로 바꿉니다`, `Change ${PT.orderCode(o)} payment to ${way === "split" ? "Split" : PAY_NAME(way)}`));
      if(pin == null) return false;
      try{ if(!(await api.checkPricePin(pin))){ toast(PT.errMsg("price_pin_wrong"), 3500); return false; } }
      catch(e){ toast(PT.errMsg(e), 4000); return false; }
      try{ await api.updateOrder(o.id, patch); toast(L(`💳 ${PT.orderCode(o)} 결제 방법을 바꿨어요`, `💳 ${PT.orderCode(o)} payment updated`), 3000); await loadOrders(); }
      catch(e){ toast(L("저장 실패: ", "Save failed: ") + PT.errMsg(e), 5000); return false; }
    }, L("저장", "Save"));
  ov._way = cur;
  const paintSum = () => { const sum = [...ov.querySelectorAll("[data-sp]")].reduce((a, i) => a + Math.max(0, Math.round(+i.value || 0)), 0), d = sum - total;
    ov.querySelector("#epSum b").innerHTML = `${peso(sum)}${sum ? (d === 0 ? ` <span style="color:var(--green)">✔</span>` : ` <span style="color:var(--red)">${d > 0 ? "+" : "−"}${peso(Math.abs(d))}</span>`) : ""}`; };
  ov.querySelectorAll("[data-pw]").forEach(b => b.onclick = () => { ov._way = b.dataset.pw; ov.querySelectorAll("[data-pw]").forEach(x => x.classList.toggle("sel", x === b)); ov.querySelector("#epSplit").hidden = ov._way !== "split"; paintSum(); });
  ov.querySelectorAll("[data-sp]").forEach(i => i.oninput = paintSum); paintSum();
}
/* 가격을 바꿀 때마다 가격 비밀번호 확인 */
function askPricePin(what){
  return new Promise(resolve => {
    let done = false;
    const ov = modal(L("🔒 가격 비밀번호", "🔒 Price password"), `<p class="hint" style="margin-top:0" data-raw>${esc(what)}</p>
      <div class="field"><input data-f="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="${L("비밀번호", "Password")}" style="font-size:22px;letter-spacing:6px;text-align:center"></div>`,
      async o => { done = true; resolve(readFields(o).pin); }, L("확인", "OK"));
    const inp = ov.querySelector('[data-f="pin"]'); setTimeout(() => inp.focus(), 50);
    inp.addEventListener("keydown", e => { if(e.key === "Enter") ov.querySelector("[data-ok]").click(); });
    new MutationObserver((m, obs) => { if(!ov.isConnected){ obs.disconnect(); if(!done) resolve(null); } }).observe(document.body, { childList:true });
  });
}

const msgTr = {};
const isEnglishText = t => !PT.hasHangul(t) && /[A-Za-z]{2,}/.test(t || "");
/* 말풍선 아래 🌐 번역: 손님 글은 관리자 화면 언어로, 자동응답·가게 답장은 저장된 다른 언어 */
function trOf(m){
  if(m.sender === "cust"){
    if(EN()) return PT.hasHangul(m.body) ? (m.body_en || "…") : "";
    return isEnglishText(m.body) ? (m.body_ko || "…") : "";
  }
  const t = m.body_en || m.body_ko;
  return t && t !== m.body ? t : "";
}
let chPaneFor = null;
/* 대화창 틀(입력칸·버튼)은 대화를 바꿀 때만 만들고, 메시지는 목록만 새로 그림 */
function buildPane(tid){
  chPaneFor = tid;
  const pane = $("chPane");
  pane.innerHTML = `<div class="ch-head" id="chHead"></div>
    <div class="chat-log" id="chLog"></div>
    <div class="chat-faq">${((chSettings && chSettings.chat_quick) || []).map((q, i) => `<button class="chip" data-qr="${i}" data-raw>${esc(q)}</button>`).join("")}</div>

  const inp = pane.querySelector("#chIn");
  pane.querySelectorAll("[data-qr]").forEach(b => b.onclick = () => { inp.value = chSettings.chat_quick[+b.dataset.qr]; inp.focus(); });
  inp.addEventListener("keydown", e => { if(e.key === "Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); pane.querySelector("#chSend").click(); } });
  pane.querySelector("#chSend").onclick = async () => {
    const v = inp.value.trim(); if(!v) return; inp.value = "";
    const btn = pane.querySelector("#chSend"); btn.disabled = true;
    // 손님이 화면 언어로 볼 수 있게 번역본을 같이 저장 ('한글 / English' 형식이면 그대로)
    let en = null, ko = null;
    if(!PT.splitKoEn(v)[1]){
      try{ if(PT.hasHangul(v)) en = await trText(v); else if(isEnglishText(v)) ko = await api.translateTo(v, "ko"); }catch(e){ /* 번역 실패 → 원문만 */ }
    }
    try{ await api.adminChatSend2(tid, v, en, ko); await loadMsgs(true); }catch(e){ inp.value = v; toast(L("전송 실패: ", "Send failed: ") + (e.message || e), 4000); }
    btn.disabled = false;
  };
}
async function loadMsgs(scroll){
  const tid = chCur; if(!tid) return;
  if(!chSettings) try{ chSettings = await api.getSettings(); }catch(e){ chSettings = {}; }
  try{ chMsgs = await api.threadMessages(tid); }catch(e){ return; }
  if(tid !== chCur) return;
  if(chPaneFor !== tid || !$("chLog")){ buildPane(tid); scroll = true; }
  const t = threads.find(x => x.id === tid) || {};
  if(t.admin_unread){ t.admin_unread = 0; api.adminChatRead(tid).catch(() => {}); paintChatBtn(); renderThreadList(); }
  $("chHead").innerHTML = `<b>${t.cust_name ? `<span data-raw>${esc(t.cust_name)}</span>` : "손님"}</b> · <a href="tel:${esc(t.cust_phone || "")}">${esc(t.cust_phone || "")}</a>
      ${t.orders ? ` · <span class="status-pill" style="background:#2a6fd3">주문 #${esc(t.orders.order_no)} ${esc(L((STATUS[t.orders.status] || {}).ko || "", (STATUS[t.orders.status] || {}).en || ""))}</span>` : ` · <span class="status-pill" style="background:#7a5cd3">문의</span>`}
      ${t.status === "open" && !t.order_id ? `<button class="chip" id="chClose">대화 종료</button>` : t.status !== "open" ? `<span class="hint">(종료됨)</span>` : ""}`;
  const cl = $("chClose"); if(cl) cl.onclick = async () => { if(!confirm("이 문의 대화를 종료할까요? (손님은 새 문의를 시작할 수 있습니다)")) return; await api.closeThread(tid); loadThreads(); };
  const log = $("chLog"), atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 60;
  log.innerHTML = chMsgs.map(m => `<div class="msg ${m.sender === "admin" ? "me" : m.sender === "bot" ? "bot" : "them"}">
      ${m.sender === "bot" ? `<small class="who">🤖 자동응답</small>` : ""}
      <div class="bubble"><span data-raw>${esc(m.body).replace(/\n/g, "<br>")}</span>${(() => { const t = trOf(m);
        return t === "…" ? `<div class="tr">🌐 번역 중…</div>` : t ? `<div class="tr" data-raw>🌐 ${esc(t).replace(/\n/g, "<br>")}</div>` : ""; })()}</div>
      <small class="at">${fmtTime(m.created_at)}</small></div>`).join("") || `<p class="hint" style="text-align:center">아직 메시지가 없습니다</p>`;
  if(scroll || atBottom) log.scrollTop = log.scrollHeight;
  // 손님 메시지 자동 번역 — 관리자 '한국어' 화면: 영어 → 한국어 / 'English' 화면: 한국어 → 영어
  for(const m of chMsgs){
    if(m.sender !== "cust" || trOf(m) !== "…") continue;
    const key = m.id + (EN() ? "en" : "ko"); if(msgTr[key]) continue; msgTr[key] = true;
    (EN() ? trText(m.body).then(en => en && api.setMsgEn(m.id, en)) : api.translateTo(m.body, "ko").then(ko => ko && ko !== m.body && api.setMsgKo(m.id, ko)))
      .then(() => { if(chCur === tid) loadMsgs(); }).catch(() => {});
  }
}

/* ---------------- 웹 푸시 (사이트를 닫아도 알림) ---------------- */
const pushSupported = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
const isIOS = () => /iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const isStandalone = () => window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
let swReg = null;
async function swReady(){ if(!("serviceWorker" in navigator)) return null; if(!swReg) swReg = await navigator.serviceWorker.register("sw.js", { scope: "/" }); return swReg; }
const b64ToU8 = s => { const p = "=".repeat((4 - s.length % 4) % 4), b = atob((s + p).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from(b, c => c.charCodeAt(0)); };
async function currentSub(){ try{ const r = await swReady(); return r ? await r.pushManager.getSubscription() : null; }catch(e){ return null; } }
function pushErrText(e){
  const m = String(e && (e.message || e));
  if(m === "ios_home") return L("아이폰은 먼저 '홈 화면에 추가'한 뒤, 홈 화면 아이콘으로 열어서 눌러주세요", "On iPhone, add to Home Screen first and open from the icon");
  if(m === "unsupported") return L("이 브라우저는 푸시 알림을 지원하지 않아요 (안드로이드는 Chrome 추천)", "This browser doesn't support push (use Chrome on Android)");
  if(m === "denied") return L("알림 권한이 거부돼 있어요 → 브라우저 설정 → 사이트 설정 → 알림 → 허용으로 바꿔주세요", "Notifications are blocked — allow them in the browser's site settings");
  if(/admin_push|function/i.test(m)) return L("Supabase에서 sql/21-web-push.sql 을 먼저 실행하세요", "Run sql/21-web-push.sql in Supabase first");
  return m;
}
async function pushEnable(){
  if(!pushSupported()) throw new Error(isIOS() && !isStandalone() ? "ios_home" : "unsupported");
  const perm = await Notification.requestPermission();
  if(perm !== "granted") throw new Error("denied");
  const info = await api.pushInfo(); if(!info || !info.public_key) throw new Error("admin_push_info");
  const reg = await swReady(); await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if(!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToU8(info.public_key) });
  const j = sub.toJSON();
  const label = (/iPhone|iPad/.test(navigator.userAgent) ? "iPhone/iPad" : /Android/.test(navigator.userAgent) ? "Android" : "PC") + " · " + new Date().toLocaleDateString();
  await api.pushSubscribe(j.endpoint, j.keys.p256dh, j.keys.auth, label);
  ls.set("paltong_push_on", true); paintPushBanner();
}
async function pushDisable(){ const s = await currentSub(); if(s){ await api.pushUnsubscribe(s.endpoint).catch(() => {}); await s.unsubscribe().catch(() => {}); } ls.set("paltong_push_on", false); }
async function paintPushState(){

/* ---------------- 🛵 배달기사 (28단계) ----------------
   · 기사 등록/수정/비밀번호/사용 중지
   · 주문 카드에서 기사 배정 → 손님 '📍 배달 위치 확인' 버튼이 실시간 추적 지도(/track)로 연결
   · 기사 위치를 지도에서 실시간으로 확인 */
let riders = [], rdSig = "", rdFocus = null, rdMap = null, rdLayer = null, rdFitted = false, rdStore = null;
const RD_STALE = 120;   // 2분 넘게 위치가 안 오면 '연결 약함'
const riderById = id => riders.find(r => r.user_id === id);
const riderName = id => (riderById(id) || {}).name || L("기사", "Rider");
const locAge = r => r && r.loc_at ? Math.max(0, Math.round((Date.now() - new Date(r.loc_at)) / 1000)) : null;
const ageText = s => s == null ? L("위치 없음", "no location") : s < 60 ? L(`${s}초 전`, `${s}s ago`) : s < 3600 ? L(`${Math.floor(s/60)}분 전`, `${Math.floor(s/60)} min ago`) : L(`${Math.floor(s/3600)}시간 전`, `${Math.floor(s/3600)} h ago`);
const isOurTrack = o => !!o.tracking_url && o.tracking_url.includes("/track?id=" + o.id);
function kmBetween(a, b){ const R = 6371, r = x => x * Math.PI / 180, dLat = r(b.lat - a.lat), dLng = r(b.lng - a.lng);
  const h = Math.sin(dLat/2)**2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLng/2)**2; return 2 * R * Math.asin(Math.sqrt(h)); }

async function loadRiders(){
  try{ riders = await api.listRiders(); }catch(e){ if(!/데모|Supabase connection/.test(String(e.message))) console.warn("riders", e); return; }
  const sig = riders.map(r => [r.user_id, r.name, r.active, r.on_duty, Math.floor((locAge(r) ?? 9e9) / 60)].join(":")).join("|");
  if(sig !== rdSig){ rdSig = sig;
    if(!document.activeElement || !document.activeElement.dataset || (!document.activeElement.dataset.draft && !document.activeElement.dataset.rider)) renderOrders(); }
  if(!$("ridersView").hidden){ renderRiderList(); drawRdMap(); }
}

/* 주문 카드의 기사 배정 줄 */
function riderRowHTML(o){
  if(o.order_type === "pickup") return "";
  const r = o.rider_id ? riderById(o.rider_id) : null;
  if(["done","cancelled"].includes(o.status)) return r ? `<div class="hint" style="margin:6px 0 0">🛵 ${L("배달 기사", "Rider")}: <b data-raw>${esc(r.name)}</b></div>` : "";
  if(o.status === "new") return "";
  const active = riders.filter(x => x.active);
  if(!active.length && !r) return o.status === "confirmed" ? `<div class="rider-row"><span>🛵 ${L("기사를 등록하면 손님이 실시간 위치를 볼 수 있어요", "Add riders so customers can track them live")}</span> <button class="chip" data-rdmap="">${L("기사 등록", "Add rider")}</button></div>` : "";
  const opts = [...active].sort((a, b) => (b.on_duty - a.on_duty) || a.name.localeCompare(b.name))
    .map(x => `<option value="${x.user_id}" ${x.user_id === o.rider_id ? "selected" : ""}>${x.on_duty ? "🟢" : "⚪"} ${esc(x.name)} (${x.orders.length})</option>`).join("");
  let live = "";
  if(r){
    const s = locAge(r), dist = r.lat != null && o.lat != null ? kmBetween(r, o) : null;
    live = `<span class="hint" style="margin:0;flex-basis:100%">${r.on_duty ? `${s != null && s <= RD_STALE ? "🟢" : "🟡"} ${ageText(s)}` : L("⚪ 근무 시작 전", "⚪ Off duty")}${dist != null && r.on_duty ? ` · ${L("손님까지", "to customer")} ${(dist * 1.35).toFixed(1)}km` : ""}
      ${o.status === "delivering" && isOurTrack(o) ? ` · ${L("손님 화면에 실시간 위치 표시 중", "customer sees live location")}` : ""}
      <button class="chip" data-rdmap="${r.user_id}">🗺 ${L("지도", "Map")}</button> <button class="chip" data-rdpage="${r.user_id}">📋 ${L("기사 화면", "Rider page")} ↗</button>${isOurTrack(o) ? ` <button class="chip" data-share="${o.id}">🔗 ${L("링크 보내기", "Send link")}</button>` : ""}${isOurTrack(o) ? ` <a class="chip" href="${esc(o.tracking_url)}" target="_blank" rel="noopener" style="text-decoration:none;color:inherit">${L("손님 화면", "Customer view")}</a>` : ""}</span>`;
  }
  if(!r && isOurTrack(o)) live = `<span class="hint" style="margin:0;flex-basis:100%">${L("기사를 배정하면 손님 링크에 위치가 보여요", "Assign a rider to show their location")} <button class="chip" data-share="${o.id}">🔗 ${L("링크 보내기", "Send link")}</button></span>`;
  const pinChip = o.lat == null ? `<span class="hint" style="margin:0;flex-basis:100%;color:#b45309">⚠️ ${L("손님 위치(핀)가 없어 추적 지도에 집이 안 보여요", "No customer pin — the tracking map can't show the drop-off")} <button class="chip" data-pinedit="${o.id}">📍 ${L("위치 넣기", "Add location")}</button></span>`
    : ` <button class="chip" data-pinedit="${o.id}" style="margin-left:auto">📍 ${L("손님 위치", "Location")}</button>`;
  live += pinChip;
  return `<div class="rider-row"><span>🛵 <b>${L("기사", "Rider")}</b></span>
    <select data-rider="${o.id}"><option value="">${L("— 배정 안 함 —", "— Not assigned —")}</option>${opts}${r && !r.active ? `<option value="${r.user_id}" selected>${esc(r.name)} (${L("사용 중지", "inactive")})</option>` : ""}</select>${live}</div>`;
}

async function assignRider(o, rid, sel){
  if(rid && o.tracking_url && !isOurTrack(o) && !confirm(L("이 주문에 라라무브 등 다른 위치 링크가 있어요. 기사를 배정하면 손님 버튼이 우리 추적 지도로 바뀝니다. 계속할까요?", "This order has another tracking link (e.g. Lalamove). Assigning a rider switches the customer's button to our live map. Continue?"))){ sel.value = o.rider_id || ""; return; }
  sel.disabled = true;
  try{
    await api.assignRider(o.id, rid || null);
    toast(rid ? L(`#${o.order_no} → ${riderName(rid)} 기사 배정${o.status === "delivering" ? " · 손님 화면에 위치가 바로 보입니다" : " · 기사 앱에 주문이 떠요"}`, `#${o.order_no} → ${riderName(rid)}`) : L(`#${o.order_no} 기사 배정 취소`, `#${o.order_no} rider removed`), 3500);
    await loadOrders(); loadRiders();
  }catch(e){ toast(PT.errMsg(e), 4500); sel.disabled = false; sel.value = o.rider_id || ""; }
}

function renderRiderList(){
  const el = $("rdList"); if(!el) return;
  if(!riders.length){ el.innerHTML = `<div class="rd-card"><b>${L("아직 등록된 기사가 없어요", "No riders yet")}</b><p class="hint" style="margin:4px 0 0">${L("➕ 기사 추가를 눌러 이름·휴대폰번호·비밀번호를 정하면 기사님이 그 번호로 로그인합니다.", "Tap ➕ Add rider. The rider signs in with that phone number and password.")}</p></div>`; return; }
  el.innerHTML = riders.map(r => {
    const s = locAge(r), fresh = r.on_duty && s != null && s <= RD_STALE;
    const st = !r.active ? L("사용 중지", "Deactivated") : !r.on_duty ? L("쉬는 중", "Off duty") : fresh ? L("근무 중", "On duty") : L("근무 중 · 신호 약함", "On duty · weak signal");
    const errs = r.errands || [];
    return `<div class="rd-card ${r.active ? "" : "off"}" data-rdopen="${r.user_id}" title="${L("눌러서 새 창으로 기사 상세·심부름 보기", "Open rider detail & errands in a new tab")}">
      <div class="rd-top"><span class="rd-dot ${fresh ? "on" : r.on_duty ? "stale" : ""}"></span><b data-raw class="rd-name">${esc(r.name)} <span class="rd-open">↗</span></b><span class="hint" style="margin:0">${st}</span>
        ${r.phone ? `<a href="tel:${esc(r.phone)}" class="hint" style="margin:0 0 0 auto" data-raw>${esc(PT.phoneFmt(r.phone))}</a>` : ""}</div>
      <p class="rd-meta">${L("아이디", "ID")} <span data-raw>${esc(r.phone || "")}</span> · ${s == null ? L("위치 기록 없음", "No location yet") : `${L("마지막 위치", "Last location")} ${ageText(s)}`}${r.battery != null ? ` · 🔋 ${Math.round(r.battery * 100)}%` : ""}${r.accuracy != null && s != null ? ` · ±${Math.round(r.accuracy)}m` : ""}</p>
      ${r.orders.length ? `<div class="rd-orders">${r.orders.map(o => `<span class="status-pill" style="background:${(STATUS[o.status] || {}).color || "#888"}">#${esc(o.order_no)} ${L((STATUS[o.status] || {}).ko || o.status, (STATUS[o.status] || {}).en || o.status)}</span>`).join("")}</div>` : ""}
      ${errs.length ? `<div class="rd-orders">${errs.map(e => `<span class="status-pill" style="background:${e.status === "going" ? "#2a6fd3" : "#e5a731"}">🧾 <span data-raw>${esc(e.title.length > 18 ? e.title.slice(0, 18) + "…" : e.title)}</span>${e.status === "going" ? L(" · 진행 중", " · in progress") : ""}</span>`).join("")}</div>` : ""}
      <div class="chips" style="margin-top:8px"><button class="chip" data-rdopen-btn="${r.user_id}" style="background:var(--red);border-color:var(--red);color:#fff">📋 ${L("상세·심부름", "Detail · Errands")} ↗</button>${r.lat != null ? `<button class="chip" data-rdfocus="${r.user_id}">🗺 ${L("지도에서 보기", "Show on map")}</button>` : ""}
        <button class="chip" data-rdedit="${r.user_id}">✏️ ${L("수정", "Edit")}</button><button class="chip" data-rdpw="${r.user_id}">🔑 ${L("비밀번호", "Password")}</button>
        <button class="chip" data-rdact="${r.user_id}">${r.active ? L("사용 중지", "Deactivate") : L("다시 사용", "Reactivate")}</button></div></div>`;
  }).join("");
  /* 기사 카드를 누르면 새 창(탭)으로 기사 상세 · 심부름 화면 (38단계) — 같은 기사는 같은 탭을 다시 씀 */
  el.querySelectorAll("[data-rdopen]").forEach(card => card.onclick = ev => {
    if(ev.target.closest("button,a,input,select") && !ev.target.closest("[data-rdopen-btn]")) return;
    openRiderPage(card.dataset.rdopen);
  });
  el.querySelectorAll("[data-rdfocus]").forEach(b => b.onclick = () => { rdFocus = b.dataset.rdfocus; drawRdMap(); $("rdMap").scrollIntoView({ behavior:"smooth", block:"center" }); });
  el.querySelectorAll("[data-rdedit]").forEach(b => b.onclick = () => editRiderModal(riderById(b.dataset.rdedit)));
  el.querySelectorAll("[data-rdpw]").forEach(b => b.onclick = () => { const r = riderById(b.dataset.rdpw);
    modal(`🔑 ${esc(r.name)} — ${L("비밀번호 변경", "Change password")}`, `<div class="field"><label>${L("새 비밀번호 (6자 이상)", "New password (6+ characters)")}</label><input data-f="pw" type="text" autocomplete="off"></div>`,
      async ov => { const f = readFields(ov); if(f.pw.length < 6){ toast(L("6자 이상 입력하세요", "At least 6 characters")); return false; } await api.riderPassword(r.user_id, f.pw); toast(L("비밀번호를 바꿨습니다 — 기사님께 알려주세요", "Password changed")); }); });
  el.querySelectorAll("[data-rdact]").forEach(b => b.onclick = async () => { const r = riderById(b.dataset.rdact);
    if(r.active && !confirm(L(`${r.name} 기사를 사용 중지할까요? 로그인해도 주문을 볼 수 없게 됩니다.`, `Deactivate ${r.name}?`))) return;
    try{ await api.updateRider(r.user_id, { active: !r.active }); await loadRiders(); renderRiderList(); }catch(e){ toast(PT.errMsg(e), 4000); } });
}
function openRiderPage(uid){
  const w = window.open(`/rider-detail?id=${encodeURIComponent(uid)}`, "paltong_rider_" + uid);
  if(w) try{ w.focus(); }catch(e){}
  else location.href = `/rider-detail?id=${encodeURIComponent(uid)}`;   // 팝업이 막힌 경우 (설치형 관리자 앱 등)
}
const riderFields = (r = {}) => `
  <div class="field"><label>${L("이름 (손님에게 보임)", "Name (shown to customers)")}</label><input data-f="name" value="${esc(r.name || "")}" placeholder="Mark"></div>
  <div class="field"><label>${L("휴대폰번호 = 로그인 아이디 (손님이 전화할 수 있음)", "Phone = login ID (customers can call)")}</label><input data-f="phone" inputmode="numeric" value="${esc(r.phone || "")}" placeholder="09xx xxx xxxx" ${r.user_id ? "disabled" : ""}></div>`;
function addRiderModal(){
  modal(`➕ ${L("기사 추가", "Add rider")}`, riderFields() + `<div class="field"><label>${L("비밀번호 (6자 이상, 기사님께 알려주세요)", "Password (6+ characters)")}</label><input data-f="pw" type="text" autocomplete="off"></div>`,
    async ov => {
      const f = readFields(ov), ph = PT.riderPhone(f.phone);
      if(!f.name){ toast(L("이름을 입력하세요", "Enter a name")); return false; }
      if(!/^09\d{9}$/.test(ph)){ toast(L("휴대폰번호는 09로 시작하는 11자리로 입력하세요", "Use an 11-digit number starting with 09"), 3500); return false; }
      if(f.pw.length < 6){ toast(L("비밀번호는 6자 이상", "Password: 6+ characters")); return false; }
      await api.addRider(ph, f.name, f.pw);
      toast(L(`${f.name} 기사 등록 완료 — 아이디 ${ph} / 비밀번호를 알려주세요`, `${f.name} added — ID ${ph}`), 5000);
      await loadRiders(); renderRiderList();
    }, L("등록", "Add"));
}
function editRiderModal(r){
  modal(`✏️ ${esc(r.name)}`, riderFields(r) + `<p class="hint">${L("아이디(휴대폰번호)는 바꿀 수 없어요. 번호가 바뀌면 새 기사로 추가하고 이 기사는 사용 중지하세요.", "The login ID can't change. For a new number, add a new rider and deactivate this one.")}</p>`,
    async ov => { const f = readFields(ov); if(!f.name){ toast(L("이름을 입력하세요", "Enter a name")); return false; }
      await api.updateRider(r.user_id, { name: f.name }); await loadRiders(); renderRiderList(); renderOrders(); });
}

/* ---- 지도 (Leaflet · OpenStreetMap) ---- */
let leafletAdminP = null;
function loadLeafletAdmin(){
  if(window.L && window.L.map) return Promise.resolve(window.L);
  return leafletAdminP = leafletAdminP || new Promise((res, rej) => {
    const base = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/";
    const c = document.createElement("link"); c.rel = "stylesheet"; c.href = base + "leaflet.min.css"; document.head.append(c);
    const s = document.createElement("script"); s.src = base + "leaflet.min.js"; s.onload = () => res(window.L); s.onerror = () => { leafletAdminP = null; rej(new Error("map")); }; document.head.append(s);
  });
}
async function initRdMap(){
  const el = $("rdMap"); if(!el) return;
  try{ await loadLeafletAdmin(); }catch(e){ el.innerHTML = `<div class="empty-box">${L("지도를 불러오지 못했어요 — 인터넷 확인", "Couldn't load the map")}</div>`; return; }
  if(rdMap){ rdMap.remove(); rdMap = null; }
  const c = rdStore || CFG.STORE_LOCATION || { lat: 14.5695, lng: 120.989 };
  rdMap = window.L.map(el, { zoomControl:true }).setView([c.lat, c.lng], 14);
  window.L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom:19, attribution:"© OpenStreetMap" }).addTo(rdMap);
  rdLayer = window.L.layerGroup().addTo(rdMap);
  rdMap.on("dragstart", () => { rdFitted = true; });
  drawRdMap();
}

      Lf.marker([o.lat, o.lng], { icon: icon("home", "#" + o.order_no, 30) }).addTo(rdLayer).bindTooltip(`#${o.order_no} ${esc(o.cust_name)} → ${esc(r.name)}`);
      pts.push([o.lat, o.lng]);
      if(r.lat != null && r.on_duty) Lf.polyline([[r.lat, r.lng], [o.lat, o.lng]], { color:"#2a6fd3", weight:2, dashArray:"6 6", opacity:.7 }).addTo(rdLayer);
    });
    (r.errands || []).filter(e => e.lat != null).forEach(e => {   // 🧾 심부름 장소 (38단계)
      Lf.marker([e.lat, e.lng], { icon: icon("errand", "🧾", 30) }).addTo(rdLayer).bindTooltip(`🧾 ${esc(e.title)} → ${esc(r.name)}`);
      pts.push([e.lat, e.lng]);
      if(r.lat != null && r.on_duty && e.status === "going") Lf.polyline([[r.lat, r.lng], [e.lat, e.lng]], { color:"#e07b1a", weight:2, dashArray:"6 6", opacity:.8 }).addTo(rdLayer);
    });
    if(r.lat == null || !r.on_duty) return;
    const s = locAge(r), stale = s == null || s > RD_STALE;
    Lf.marker([r.lat, r.lng], { icon: Lf.divIcon({ className:"", html:`<div class="rd-rider ${stale ? "stale" : ""}"><img src="${RIDER_IMG}" alt="🛵"></div>`,
        iconSize:[52, 57], iconAnchor:[26, 54] }), zIndexOffset: 1000 }).addTo(rdLayer)
      .bindTooltip(`<b>${esc(r.name)}</b> · ${ageText(s)}`, { permanent:true, direction:"top", offset:[0, -56], opacity:.95 });
    if(r.accuracy > 30) Lf.circle([r.lat, r.lng], { radius: r.accuracy, color:"#d33d2a", weight:1, fillOpacity:.06 }).addTo(rdLayer);
    pts.push([r.lat, r.lng]);
  });
  const f = rdFocus && riderById(rdFocus);
  if(f && f.lat != null){ rdMap.setView([f.lat, f.lng], 16); rdFocus = null; rdFitted = true; }
  else if(!rdFitted && pts.length){ pts.length > 1 ? rdMap.fitBounds(pts, { padding:[40, 40], maxZoom:16 }) : rdMap.setView(pts[0], 15); rdFitted = true; }
}


/* ---------------- 🙋 주문 받은 직원 (45단계) ----------------
   가입 없이 '이름 + 본인 비밀번호'. 주문을 받을 때 이름을 고르고 비밀번호를 넣으면 그 주문에 기록.

let staffCache = null, staffOff = false;

/* ---- 붙여넣은 글에서 좌표·지도 링크·주소 찾기 ---- */
function parseLatLng(t){
  const s = String(t || "");
  const ok = (lat, lng) => Math.abs(lat) <= 90 && Math.abs(lng) <= 180 && (lat || lng) ? { lat, lng } : null;
  let m = s.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/);                                  // 구글 지도 장소 핀
  if(m) return ok(+m[1], +m[2]);
  m = s.match(/[?&](?:q|query|ll|sll|coordinate|destination|daddr|center)=(-?\d+\.\d+)(?:,|%2C)\s*(-?\d+\.\d+)/i);
  if(m) return ok(+m[1], +m[2]);
  m = s.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);                                            // 지도 화면 중심
  if(m) return ok(+m[1], +m[2]);
  // 도·분·초  14°34'12.3"N 120°59'01.2"E
  m = s.match(/(\d{1,2})°\s*(\d{1,2})['′]\s*([\d.]+)["″]?\s*([NS])[\s,]+(\d{1,3})°\s*(\d{1,2})['′]\s*([\d.]+)["″]?\s*([EW])/i);
  if(m){ const d = (a, b, c, h) => (+a + b / 60 + c / 3600) * (/[SW]/i.test(h) ? -1 : 1); return ok(d(m[1], m[2], m[3], m[4]), d(m[5], m[6], m[7], m[8])); }
  m = s.match(/(-?\d{1,2}\.\d{3,})\s*[,\s]\s*(-?\d{1,3}\.\d{3,})/);
  return m ? ok(+m[1], +m[2]) : null;
}
const MAP_LINK_RE = /https?:\/\/(?:maps\.app\.goo\.gl|goo\.gl\/maps|g\.co\/kgs|(?:www\.|maps\.)?google\.[a-z.]+\/maps|maps\.google\.[a-z.]+|share\.google|(?:www\.)?waze\.com|maps\.apple\.com|maps\.apple\/|map\.kakao\.com|kko\.to)[^\s<>"')]*/i;
let gGeoKey = null, gLoadP = null;
/* Google 지도 JS (설정의 Google Maps 키) — 손님 주문 화면과 같은 'Places API (New)' 사용 */
function loadGoogleAdmin(){
  if(!gGeoKey) return Promise.reject(new Error("no key"));
  if(window.google && google.maps && google.maps.importLibrary) return Promise.resolve();
  return gLoadP = gLoadP || new Promise((res, rej) => { const sc = document.createElement("script");
    sc.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(gGeoKey)}&v=weekly&loading=async&language=en&region=PH&callback=__gadm`;
    window.__gadm = res; sc.onerror = () => { gLoadP = null; rej(new Error("google load")); }; document.head.append(sc); });
}
async function googleFind(q, c){
  await loadGoogleAdmin();
  const P = await google.maps.importLibrary("places");
  try{
    const { places } = await P.Place.searchByText({ textQuery: q, fields: ["location", "displayName", "formattedAddress"], region: "ph", language: "en",
      locationBias: { center: c, radius: 30000 }, maxResultCount: 1 });
    const pl = places && places[0];
    if(pl && pl.location) return { lat: pl.location.lat(), lng: pl.location.lng(), label: [pl.displayName, pl.formattedAddress].filter(Boolean).join(", ") };
  }catch(e){ console.warn("google text search", e); }
  const { suggestions } = await P.AutocompleteSuggestion.fetchAutocompleteSuggestions({ input: q, includedRegionCodes: ["ph"], language: "en", locationBias: { center: c, radius: 30000 }, origin: c });
  const pred = suggestions && suggestions.map(s => s.placePrediction).find(Boolean);
  if(!pred) return null;
  const place = pred.toPlace(); await place.fetchFields({ fields: ["displayName", "formattedAddress", "location"] });
  return place.location ? { lat: place.location.lat(), lng: place.location.lng(), label: [place.displayName, place.formattedAddress].filter(Boolean).join(", ") } : null;
}
async function photonFind(q, c){
  const r = await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&lat=${c.lat}&lon=${c.lng}&limit=1&lang=en&bbox=116.9,4.5,126.7,21.2`);

async function geocodeAddr(text){

}

function plusCode(text, ref){
  const m = String(text).toUpperCase().match(/(?:^|[^A-Z0-9])([23456789CFGHJMPQRVWX]{2,8}\+[23456789CFGHJMPQRVWX]{2,3})(?![A-Z0-9])/);

  const A = "23456789CFGHJMPQRVWX", PR = [20, 1, .05, .0025, .000125], sep = m[1].indexOf("+");
  if(sep % 2) return null;

  const decode = d => { let lat = -90, lng = -180, n = Math.min(10, d.length - d.length % 2);
    for(let i = 0; i < n; i += 2){ lat += A.indexOf(d[i]) * PR[i / 2]; lng += A.indexOf(d[i + 1]) * PR[i / 2]; }
    const r = PR[n / 2 - 1]; return { lat: lat + r / 2, lng: lng + r / 2 }; };
  if(sep === 8) return decode(digits);
  if(!ref) return null;
  const pad = 8 - sep, res = Math.pow(20, 2 - pad / 2);
  let pre = "", la = ref.lat + 90, ln = ref.lng + 180;
  for(let i = 0; i < pad / 2; i++){ const a = Math.floor(la / PR[i]), b = Math.floor(ln / PR[i]); pre += A[a] + A[b]; la -= a * PR[i]; ln -= b * PR[i]; }
  const p = decode(pre + digits), h = res / 2;
  if(ref.lat + h < p.lat && p.lat - res >= -90) p.lat -= res; else if(ref.lat - h > p.lat && p.lat + res <= 90) p.lat += res;

  return p;
}

function menuMatch(name){

      if(k === n) return it;

/* 붙여넣은 내용으로 칸 채우기 + 위치 찾기 */
function bindPaste(ov, fill){
  const ta = ov.querySelector("[data-paste]"), info = ov.querySelector("[data-pasteout]"); if(!ta) return;
  let t = null;
  let seq = 0;
  const go = async () => {
    if(!ta.value.trim()) return;
    const my = ++seq, p = parseOrderPaste(ta.value);
    const got = fill(p), base = got.length ? "✅ " + L("채운 칸: ", "Filled: ") + got.join(", ") : L("알아볼 수 있는 내용이 없어요 — 직접 입력해주세요", "Nothing recognised — please type it in");
    const say = t => { if(my === seq) info.textContent = base + (t ? "  ·  " + t : ""); };
    say(L("📍 위치 찾는 중…", "📍 finding location…"));
    let pin = p.coord || null, how = "";
    if(!pin && p.link){ pin = await resolveMapLink(p.link); how = L("지도 링크", "map link"); }
    const a = p.addr || (ov.querySelector('[data-f="addr"]') || {}).value || ov._addr || "";
    if(!pin && a){ pin = await geocodeAddr(a); how = L("주소", "address"); }
    if(my !== seq) return;
    if(pin){ ov._setPin(pin, true); say(pin.approx ? `📍 ${how}${L("로 찾은 위치", " match")}: ${pin.label || ""} — ${L("지도에서 맞는지 확인", "please check on the map")}` : "📍 " + L("정확한 위치 핀 완료", "exact pin set")); }
    else say("⚠️ " + L("위치를 자동으로 못 찾았어요 — 구글지도 링크를 붙여넣거나 지도를 눌러 핀을 찍어주세요", "Couldn't find the location — paste a Google Maps link or tap the map"));
  };
  ta.addEventListener("paste", () => setTimeout(go, 30));
  ta.addEventListener("input", () => { clearTimeout(t); t = setTimeout(go, 600); });
}

/* DK 사장님 앱 알림 모양: "빨통 업소에 주문이 접수 되었습니다" / "배달주문 / 주문하신분 이민영 / 주문아이디 14266348"
   → 메뉴·금액은 알림에 없어서 이름 · 배달/픽업 · DK 주문아이디만 읽음 */
function dkParse(x){
  const t = [x.title, x.body].filter(Boolean).join("\n");
  const id = (t.match(/주문\s*아이디\s*[:#]?\s*(\d{4,})/) || t.match(/order\s*(?:id|no\.?)\s*[:#]?\s*(\d{4,})/i) || [])[1] || "";
  const name = ((t.match(/주문\s*하신\s*분\s*[:：]?\s*([^/\n]+)/) || t.match(/(?:customer|name)\s*[:：]\s*([^/\n]+)/i) || [])[1] || "").trim();
  const pickup = /(픽업|포장)\s*주문|pick\s*-?\s*up|take\s*-?\s*out/i.test(t);
  const isDk = !!(id || name) && /주문|order/i.test(t);
  return { id, name, pickup, isDk, kind: pickup ? L("픽업", "Pickup") : L("배달", "Delivery") };
}

          <input type="number" min="1" max="50" inputmode="numeric" value="${l.qty}" data-exq="${i}" title="${L("수량", "Qty")}" style="width:46px;padding:4px;border:1px solid var(--line);border-radius:8px;font-size:14px">
          × ₱<input type="number" min="0" inputmode="numeric" value="${l.unitPrice}" data-exu="${i}" title="${L("단가", "Unit price")}" style="width:72px;padding:4px;border:1px solid var(--line);border-radius:8px;font-size:14px">
          = <b data-exl="${i}" style="min-width:64px;text-align:right">${peso(l.unitPrice * l.qty)}</b>
          <button type="button" class="chip" data-exrm="${i}">✕</button></span></div>`).join("")}
      <div class="sum-row total"><span>🍽 ${L("메뉴 합계 = 음식값", "Items = food")}</span><b data-exsum>${peso(itemSum())}</b></div>
      <p class="hint" style="margin:4px 0 0">${L("✅ = 메뉴판에 있는 메뉴 · 수량·가격은 눌러서 고칠 수 있어요", "✅ = on the menu · tap qty / price to fix")}</p></div>` : "";
    box.querySelectorAll("[data-exrm]").forEach(b => b.onclick = () => { ov._items.splice(+b.dataset.exrm, 1); paintItems(); });
    const upd = (i, k, v) => { const l = ov._items[i]; if(!l) return; l[k] = k === "qty" ? Math.max(1, Math.min(50, Math.round(+v || 1))) : Math.max(0, Math.round(+v || 0));
      box.querySelector(`[data-exl="${i}"]`).textContent = peso(l.unitPrice * l.qty); box.querySelector("[data-exsum]").textContent = peso(itemSum()); amt.value = itemSum(); paintTotal(); };
    box.querySelectorAll("[data-exq]").forEach(x => x.oninput = () => upd(+x.dataset.exq, "qty", x.value));
    box.querySelectorAll("[data-exu]").forEach(x => x.oninput = () => upd(+x.dataset.exu, "unitPrice", x.value));
    if(ov._items.length){ amt.value = itemSum(); amt.readOnly = true; amt.style.opacity = .6; } else { amt.readOnly = false; amt.style.opacity = ""; }
    paintTotal();
  };
  ov.querySelector("#exAdd").onclick = () => addItemModal({ pickOnly: l => { ov._items.push(l); paintItems(); }, items: [] }, false);
  const pickCh = ch => { ov._ch = ch; ov.querySelectorAll("[data-ch]").forEach(x => x.classList.toggle("sel", x.dataset.ch === ch)); ov.querySelector("#exPtsBox").hidden = ch !== "DK"; paintTotal(); };
  ov.querySelectorAll("[data-ch]").forEach(b => b.onclick = () => pickCh(b.dataset.ch));
  /* 🛵 배달 / 🏃 픽업 — 픽업이면 주소·지도·배달비·기사 칸을 숨기고 배달비 0 */
  const pickOt = t => { ov._ot = t; ov.querySelectorAll("[data-ot]").forEach(x => x.classList.toggle("sel", x.dataset.ot === t));
    ov.querySelectorAll(".ex-dlv").forEach(x => x.hidden = t === "pickup");
    const co = ov.querySelector("[data-cashopt]"); if(co) co.textContent = t === "pickup" ? L("현금 (매장에서 받음)", "Cash (paid at store)") : L("현금 (기사가 받음)", "Cash (rider collects)");
    paintTotal(); };
  ov.querySelectorAll("[data-ot]").forEach(b => b.onclick = () => pickOt(b.dataset.ot));
  ["amount", "fee", "points"].forEach(k => F(k).addEventListener("input", paintTotal));
  ov.querySelector("#exPwd").onchange = async e => {
    if(!e.target.checked){ ov._pwd = null; paintTotal(); return; }
    const a = Math.round(+F("amount").value || 0), pt = ov._ch === "DK" ? Math.min(a, Math.max(0, Math.round(+F("points").value || 0))) : 0;
    const c = await pwdCalcModal(Math.max(0, a - pt), "", ov._pwd); if(!c){ e.target.checked = false; ov._pwd = null; } else ov._pwd = { n: c.n, k: c.k }; paintTotal(); };
  paintTotal();
  bindPaste(ov, p => {
    const got = [];
    if(ov._ocr){ p.memo = (p.memoLabeled || []).join(" / "); if(ocrFix(p)) got.push("🔧 " + L("DK 합계에 맞춰 숫자 보정", "numbers matched to DK total")); }
    const put = (k, v, lab) => { if(v == null || v === "") return; F(k).value = v; got.push(lab); };
    put("name", p.name, L("이름", "name")); put("phone", p.phone, L("연락처", "phone")); put("addr", p.addr, L("주소", "address"));
    // 메뉴: 붙여넣기로 넣었던 줄은 바꾸고, 직접 넣은 메뉴는 그대로
    ov._items = ov._items.filter(l => !l.pasted).concat(p.items || []);
    ov._pastedTotal = p.total != null ? p.total : null;
    if(p.items && p.items.length) got.push(L(`메뉴 ${p.items.length}개`, `${p.items.length} items`));
    if(ov._items.length) paintItems();
    else put("amount", p.amount, `${L("음식값", "food")} ${peso(p.amount || 0)}`);
    if(p.fee != null) put("fee", p.fee, `${L("배달비", "delivery")} ${peso(p.fee)}`);
    if(p.points){ pickCh("DK"); put("points", p.points, `⭐ ${L("포인트", "points")} ${peso(p.points)}`); }
    put("memo", p.memo, L("요청사항", "notes"));
    paintItems();
    if(p.mismatch || ov._pastedTotal != null && Math.round(+F("amount").value || 0) + Math.round(+F("fee").value || 0) - Math.round(+F("points").value || 0) !== ov._pastedTotal && Math.round(+F("amount").value || 0) + Math.round(+F("fee").value || 0) !== ov._pastedTotal) got.push("⚠️ " + L("합계가 안 맞아요 — 확인", "total mismatch — check"));
    if(p.payKey){ F("payment").value = p.payKey; got.push(L("결제", "payment")); }
    if(p.link || p.coord){ F("coord").value = p.link || `${p.coord.lat}, ${p.coord.lng}`; got.push(L("지도 위치", "map pin")); }
    const raw = ov.querySelector("[data-paste]").value.toLowerCase();
    if(/pick\s*-?\s*up|픽업|포장|take\s*-?\s*out|takeout/.test(raw)){ pickOt("pickup"); got.push("🏃 " + L("픽업", "pickup")); }
    if(/kakao|카톡|카카오/.test(raw)) pickCh("카카오톡"); else if(/messenger|facebook|페북|페이스북|sms|문자/.test(raw)) pickCh("메세지"); else if(/viber|바이버/.test(raw)) pickCh("바이버");
    if(ov._forceCh) pickCh(ov._forceCh);
    return got;
  });
  bindOcr(ov, (text, d) => { ov._ocr = true; if(d.id || /주문\s*하신\s*분|DK/i.test(text)) ov._forceCh = "DK"; });
  if(pre && pre.ocr){ ov._forceCh = "DK"; pickCh("DK"); ov._ocrPick(); }   // 📷 DK 캡처 버튼으로 열면 바로 사진 고르기
  else if(pre){ ov._forceCh = pre.ch || "DK"; pickCh(ov._forceCh);
    const ta = ov.querySelector("[data-paste]"); if(ta && pre.text){ ta.value = pre.text; ta.dispatchEvent(new Event("input")); } }
  await setupPinMap(ov, null);
  F("addr").addEventListener("change", async () => {   // 주소를 직접 쓰고 나와도 핀이 없으면 자동으로 찾기
    if(ov._pin || F("addr").value.trim().length < 4) return;
    const out = ov.querySelector("[data-pin]"); out.textContent = L("주소로 위치 찾는 중…", "Searching address…");
    const g = await geocodeAddr(F("addr").value); if(g && !ov._pin) ov._setPin(g, true); else if(!ov._pin) out.textContent = L("주소로 위치를 못 찾았어요 — 지도를 눌러 핀을 찍어주세요", "Address not found — tap the map");
  });
}
/* 이미 들어온 주문의 손님 위치(도착 핀) 추가·수정 → 손님 추적 지도에 🏠 표시 */
async function orderPinModal(o){
  const start = o.lat != null ? { lat: o.lat, lng: o.lng } : null;
  const ov = modal(`📍 #${esc(o.order_no)} ${L("손님 위치", "Customer location")}`, `
    <p class="hint" style="margin-top:0">${L("여기서 정한 위치가 손님 추적 지도에 🏠 로 보이고, 기사님 '곧 도착' 안내 기준이 돼요.", "This shows as 🏠 on the customer's tracking map and is used for the rider 'almost there' alert.")}</p>
    <div class="calc-box" data-raw style="font-size:13px">${esc(o.cust_addr || "")}</div>
    ${pasteBoxHTML()}${pinFieldHTML()}`,
    async ov => {
      if(!ov._pin){ toast(L("지도에 핀을 찍어주세요", "Drop a pin on the map")); return false; }
      await api.updateOrder(o.id, { lat: ov._pin.lat, lng: ov._pin.lng });
      toast(L(`#${o.order_no} 손님 위치 저장 — 추적 지도에 표시돼요`, `#${o.order_no} location saved`)); await loadOrders();
    }, L("위치 저장", "Save location"));
  ov._addr = o.cust_addr;
  bindPaste(ov, p => { const got = []; if(p.link || p.coord){ ov.querySelector('[data-f="coord"]').value = p.link || `${p.coord.lat}, ${p.coord.lng}`; got.push(L("지도 위치", "map pin")); } if(p.addr){ ov._addr = p.addr; got.push(L("주소", "address")); } return got; });
  await setupPinMap(ov, start);
  if(!start && o.cust_addr && !/pin location|매장 픽업/i.test(o.cust_addr)){ const g = await geocodeAddr(o.cust_addr); if(g && !ov._pin) ov._setPin(g, true); }
}
/* 추적 링크 보내기: 복사 / 휴대폰 공유 / 문자 */
function shareTrack(o, fresh){
  const url = o.tracking_url, msg = `빨통 배달 위치 확인 / Track your PAL TONG delivery\n${url}`;   // 손님에게는 주문번호 안 보냄
  const ph = String(o.cust_phone || "").replace(/[^\d+]/g, "");
  const ov = modal(`🔗 #${esc(o.order_no)} ${L("추적 링크", "Tracking link")}`, `
    ${fresh ? `<p class="hint" style="margin-top:0">✅ ${L("주문을 등록했어요. 아래 링크를 손님에게 보내주세요. 기사가 '픽업·출발'을 누르면 손님 지도에 위치가 보여요.", "Order created. Send this link to the customer — they'll see the rider once it's picked up.")}</p>` : ""}
    <div class="calc-box" data-raw style="word-break:break-all;font-size:13px">${esc(url)}</div>
    <div class="btn-row"><button class="ghost-btn sm" id="shCopy">📋 ${L("링크 복사", "Copy link")}</button>${navigator.share ? `<button class="ghost-btn sm" id="shShare">📤 ${L("공유 (카톡 등)", "Share")}</button>` : ""}</div>
    ${ph && ph !== "-" ? `<div class="btn-row"><a class="ghost-btn sm" style="text-align:center;text-decoration:none;color:inherit" href="sms:${esc(ph)}?body=${encodeURIComponent(msg)}">💬 ${L("문자로 보내기", "Send SMS")}</a></div>` : ""}`,
    async () => {}, L("닫기", "Close"));
  ov.querySelector("#shCopy").onclick = async () => { try{ await navigator.clipboard.writeText(msg); toast(L("복사했어요 — 카톡·메신저에 붙여넣으세요", "Copied — paste it in chat")); }catch(e){ prompt("", msg); } };
  const sh = ov.querySelector("#shShare"); if(sh) sh.onclick = () => navigator.share({ title: "PAL TONG", text: msg }).catch(() => {});
}
/* ---------------- 시작 ---------------- */
/* ---------------- 영업 중 / 영업 종료 (36단계 SQL) ---------------- */
let storeOpen = null;
function paintStoreBtn(){
  const b = $("storeBtn"); if(!b) return;
  if(storeOpen === null){ b.textContent = "…"; return; }
  b.innerHTML = storeOpen ? L("🟢 영업 중", "🟢 Open") : L("🔴 영업 종료", "🔴 Closed");
  b.style.background = storeOpen ? "#2f8f4e" : "#a92a1b"; b.style.color = "#fff"; b.style.borderColor = "transparent"; b.style.fontWeight = "800";
  let bn = $("closedNote");
  if(!bn){ bn = document.createElement("div"); bn.id = "closedNote"; bn.className = "demo-banner"; bn.style.cssText = "background:#fdecea;border-color:#e8a59c;color:#7a1f14;font-weight:700"; const tb = document.querySelector("#appView .topbar"); tb.parentNode.insertBefore(bn, tb.nextSibling); }
  bn.hidden = !!storeOpen;
  bn.innerHTML = L("🔴 지금 <b>영업 종료</b> 상태예요 — 손님 화면의 모든 메뉴가 닫혀 있고 새 주문을 받지 않아요. (외부 주문 등록은 가능)", "🔴 The store is <b>closed</b> — all menus are closed for customers and new orders are blocked.");
}
async function loadStoreStatus(){ try{ const st = await api.getSettings(); storeOpen = !st || st.store_open !== false; }catch(e){} paintStoreBtn(); }
async function toggleStore(){
  if(storeOpen === null) return;
  const next = !storeOpen;
  if(!confirm(next ? L("영업을 시작할까요?\n손님이 바로 주문할 수 있어요.", "Open the store? Customers can order right away.")
                   : L("영업을 종료할까요?\n손님 화면의 모든 메뉴가 닫히고 새 주문을 받지 않아요.\n(이미 들어온 주문은 그대로 처리할 수 있어요)", "Close the store? All menus will close and new orders are blocked."))) return;
  const b = $("storeBtn"); b.disabled = true;
  try{
    if(api.setStoreOpen) await api.setStoreOpen(next); else await api.saveSettings({ store_open: next });
    storeOpen = next; paintStoreBtn();
    toast(next ? L("🟢 영업 중 — 주문을 받습니다", "🟢 Open — taking orders") : L("🔴 영업 종료 — 모든 메뉴를 닫았어요", "🔴 Closed — all menus are closed"), 3000);
  }catch(e){
    const m = String(e.message || e);
    toast(/admin_set_store_open|store_open|schema cache|does not exist/i.test(m) ? L("Supabase에서 sql/36-store-open-close.sql 을 먼저 실행하세요", "Run sql/36-store-open-close.sql in Supabase first") : L("바꾸지 못했어요: ", "Failed: ") + m, 5000);
  }
  b.disabled = false;
}
function startApp(){
  if(RIDERS_WIN) return startRidersWindow();
  if(DINING_WIN) return startDiningWindow();
  $("storeBtn").onclick = toggleStore; loadStoreStatus();
  loadStaff().then(() => { renderOrders(); renderDining(); }).catch(() => {});   // 🙋 받은 직원 표시용
  try{ api.onSettings && api.onSettings(loadStoreStatus); }catch(e){}
  setInterval(loadStoreStatus, 60000);
  $("appView").hidden = false; paintSoundBtn(); keepAwake();
  swReady().then(paintPushBanner).catch(() => {});
  api.getMenuStatus({ includeHidden: true }).then(m => { soldOut = m; }).catch(() => {});   // 할인가·카테고리 반영 (가격 확인용) $("demoBanner").hidden = !PT.DEMO; paintPrinterBtn(false);
  loadOrders();
  loadRiders();
  try{ api.onRidersChange(() => { clearTimeout(window._rdt); window._rdt = setTimeout(loadRiders, 400); }); }catch(e){}
  setInterval(() => { if(!$("ridersView").hidden || riders.some(r => r.on_duty)) loadRiders(); }, 20000);
  api.getSettings().then(st => { PT.setTranslateKey(st && st.google_maps_key); gGeoKey = (st && st.google_maps_key) || null; }).catch(() => {});   // Google 번역 키
  api.onOrdersChange(() => { clearTimeout(window._lt); window._lt = setTimeout(loadOrders, 300); });
  setInterval(loadOrders, 15000);          // 실시간 연결이 끊겨도 15초마다 새로고침
  refreshReviewCount();
  loadThreads();
  try{ api.onChatChange(() => { clearTimeout(window._ct); window._ct = setTimeout(loadThreads, 300); }); }catch(e){}
  setInterval(loadThreads, 20000);
  loadCancelReqs(); try{ api.onCancelReq(() => { clearTimeout(window._crt); window._crt = setTimeout(loadCancelReqs, 300); }); }catch(e){} setInterval(loadCancelReqs, 30000);   // 🧾 취소 요청
  try{ api.onReviewsChange(() => { clearTimeout(window._rt); window._rt = setTimeout(() => { refreshReviewCount(); if(rvView) loadReviews(); }, 400); }); }catch(e){}
  setInterval(() => { refreshReviewCount(); if(rvView) loadReviews(); }, 60000);
  setInterval(() => { if(!document.activeElement || !document.activeElement.dataset || !document.activeElement.dataset.draft) renderOrders(); }, 60000); // '몇 분 전' 갱신
}
/* 🛵 기사 관리 창: 기사 화면만, 주문·채팅 알림 없음 */
function startRidersWindow(){
  ["storeBtn", "soundBtn", "printerBtn", "chatBtn", "reviewsBtn", "membersBtn", "staffBtn", "viewBtn", "settingsBtn", "ridersBtn", "diningBtn"].forEach(id => { const b = $(id); if(b) b.hidden = true; });
  $("subLine").textContent = L("🛵 기사 관리 · Riders", "🛵 Riders");
  document.title = L("🛵 기사 관리 · 빨통", "🛵 Riders · PAL TONG");
  $("appView").hidden = false; $("demoBanner").hidden = !PT.DEMO;
  const f = QS.get("focus"); if(f != null) rdFocus = f === "add" ? "" : f;
  loadOrders().catch(() => {});   // 주문 카드의 기사 정보용 (알림은 안 울림)
  showView("riders");
  try{ api.onRidersChange(() => { clearTimeout(window._rdt); window._rdt = setTimeout(loadRiders, 400); }); }catch(e){}
  setInterval(loadRiders, 15000);
  api.getSettings().then(st => { gGeoKey = (st && st.google_maps_key) || null; }).catch(() => {});
  window.SUB_WIN_READY = "riders";
}
/* 🍽 다이닝 창: 다이닝 주문만, 알림 소리 없음 (프린터는 씀) */
function startDiningWindow(){
  ["storeBtn", "soundBtn", "chatBtn", "reviewsBtn", "membersBtn", "staffBtn", "viewBtn", "settingsBtn", "ridersBtn", "diningBtn"].forEach(id => { const b = $(id); if(b) b.hidden = true; });
  $("subLine").textContent = L("🍽 다이닝 · Dine-in", "🍽 Dine-in");
  document.title = L("🍽 다이닝 · 빨통", "🍽 Dine-in · PAL TONG");
  $("appView").hidden = false; $("demoBanner").hidden = !PT.DEMO; paintPrinterBtn(false);
  api.getMenuStatus({ includeHidden: true }).then(m => { soldOut = m; }).catch(() => {});
  showView("dining");
  loadStaff().then(() => renderDining()).catch(() => {});
  loadOrders();
  api.onOrdersChange(() => { clearTimeout(window._lt); window._lt = setTimeout(loadOrders, 300); });
  setInterval(loadOrders, 15000);
  loadCancelReqs(); try{ api.onCancelReq(() => { clearTimeout(window._crt); window._crt = setTimeout(loadCancelReqs, 300); }); }catch(e){} setInterval(loadCancelReqs, 30000);
  setInterval(() => { if(!document.querySelector(".overlay")) renderDining(); }, 60000);   // '몇 분째' 갱신
  window.SUB_WIN_READY = "dining";
}
boot();
</script>
