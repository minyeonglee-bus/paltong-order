<style>
  body{max-width:1180px;}
  .topbar{top:0;}
  .admin-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
  .act-grp{display:flex;align-items:center;gap:5px;flex-wrap:wrap;padding:4px 6px;border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.025);}
  @media (max-width:640px){ #appView .topbar{flex-wrap:wrap;} #appView .topbar .brand{flex:1 1 calc(100% - 70px);} #appView .admin-actions{justify-content:flex-start;width:100%;} }
  .act-grp.plain{border-color:transparent;background:none;padding:4px 0;}
  .act-grp:not(:has(.sm-btn:not([hidden]))){display:none;}
  .grp-lbl{font-size:10.5px;font-weight:800;color:var(--ink-soft,#8a7a6e);padding:0 2px;letter-spacing:.02em;}
  .sm-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 11px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;}
  .sm-btn.on{background:var(--green);border-color:var(--green);color:#fff;}
  .sm-btn.red{background:var(--red);border-color:var(--red);color:#fff;}
  .filters{display:flex;gap:8px;overflow-x:auto;padding:12px 0;scrollbar-width:none;}
  .pill{flex-shrink:0;border:1px solid var(--line);background:var(--surface);padding:8px 13px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer;}
  .pill.sel{background:var(--ink);color:var(--bg);border-color:var(--ink);}
  .daybar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:0 0 8px;}
  .daybar input[type=date]{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 10px;border-radius:999px;font:inherit;font-size:13px;font-weight:700;}
  .dayhead{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px;margin:10px 0 0;padding:8px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);}
  .dayhead b{font-size:16px;} .dayhead .hint{margin:0;}
  .pill .n{display:inline-block;min-width:20px;padding:0 5px;border-radius:999px;background:var(--red);color:#fff;font-size:11px;margin-left:4px;text-align:center;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px;align-items:start;padding-bottom:60px;}
  @media (max-width:420px){ .grid{grid-template-columns:1fr;} }
  .ocard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;}
  .ocard.urgent{border:2px solid var(--red);box-shadow:0 0 0 4px rgba(211,61,42,.12);}
  .ohead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
  .ohead .no{font-family:'Black Han Sans',sans-serif;font-size:26px;color:var(--red);line-height:1;}
  .ohead .time{font-size:12px;color:var(--muted);margin-left:auto;}
  .cust{font-size:13px;line-height:1.55;background:var(--surface-2);border-radius:10px;padding:8px 10px;margin:8px 0;}
  .cust a{color:inherit;}
  .items .sum-row{font-size:13px;}
  .warn{background:#fff1c9;color:#6b4e00;border-radius:8px;padding:6px 9px;font-size:12px;margin:6px 0;}
  .fee-row{display:flex;gap:8px;align-items:center;margin:10px 0 6px;}
  .fee-row input{flex:1;min-width:0;border:2px solid var(--red);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:18px;font-weight:800;}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0;}
  .chip{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 9px;font-size:12px;font-weight:700;cursor:pointer;}
  .chip.sel{background:var(--ink);color:var(--bg);border-color:var(--ink);}
  .note-in{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 10px;font-size:13px;margin:6px 0;}
  .btn-row{display:flex;gap:8px;margin-top:10px;}
  .btn-row > *{flex:1;margin:0;}
  .primary-btn.sm{padding:12px;font-size:14px;}
  .ghost-btn.sm{padding:10px;font-size:13px;margin:0;}
  .rc-thumb{display:block;width:100%;max-height:260px;object-fit:contain;background:#000;border-radius:10px;margin-top:8px;cursor:zoom-in;}
  .viewer{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:300;display:flex;align-items:center;justify-content:center;cursor:zoom-out;}
  .viewer img{max-width:96vw;max-height:96vh;}
  .login{max-width:360px;margin:12vh auto 0;}
  .so-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;padding-bottom:60px;}
  .so-item{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;}
  .so-item.out{opacity:.65;}
  .so-toggle{border:1px solid var(--red);background:transparent;color:var(--red-deep);border-radius:10px;padding:8px 10px;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap;}
  .so-toggle.out{background:var(--red);color:#fff;}
  .so-item .chip{white-space:nowrap;}
  .calc-box{background:var(--surface-2);border-radius:10px;padding:8px 10px;margin-top:8px;}
  .calc-box .sum-row.total{margin-top:4px;}
  .map-pin{font-weight:800;color:var(--red-deep);}
  #membersView .so-grid{grid-template-columns:repeat(auto-fill,minmax(360px,1fr));}
  .rv-n{display:inline-block;min-width:18px;padding:0 5px;border-radius:999px;background:#fff;color:var(--red);font-size:11px;margin-left:2px;text-align:center;}
  .chat-wrap{display:grid;grid-template-columns:320px minmax(0,1fr);gap:12px;padding:14px 0 60px;align-items:start;}
  @media (max-width:760px){ .chat-wrap{grid-template-columns:minmax(0,1fr);} }
  .chat-list{min-width:0;display:flex;flex-direction:column;gap:6px;max-height:78vh;overflow-y:auto;}
  .th-row{display:flex;flex-direction:column;gap:3px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;color:var(--ink);font:inherit;}
  .th-row.sel{border:2px solid var(--red);} .th-row.closed{opacity:.55;}
  .th-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;} .th-top .time{margin-left:auto;font-size:11px;color:var(--muted);}
  .chat-pane{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;min-height:60vh;display:flex;flex-direction:column;}
  .ch-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding-bottom:8px;border-bottom:1px solid var(--line);font-size:14px;}
  .chat-pane .chat-log{max-height:56vh;}
  .msg .tr{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);font-size:13px;color:var(--ink-soft);}
  .msg.them .bubble{background:var(--surface-2);}
  #alarmBox{position:fixed;right:12px;bottom:12px;z-index:400;display:flex;flex-direction:column-reverse;gap:8px;width:min(460px,calc(100vw - 24px));}
  .alarm{display:flex;align-items:center;gap:10px;color:#fff;border-radius:14px;padding:14px 16px;font-size:16px;box-shadow:0 10px 30px rgba(0,0,0,.3);cursor:pointer;animation:alarmIn .25s ease-out, alarmPulse 1s ease-in-out 3;}
  .alarm b{white-space:nowrap;font-size:17px;} .alarm span{flex:1;} .alarm button{background:rgba(255,255,255,.25);border:0;color:#fff;border-radius:8px;padding:6px 10px;font-size:14px;cursor:pointer;}
  @keyframes alarmIn{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
  @keyframes alarmPulse{50%{filter:brightness(1.25);transform:scale(1.02)}}
  /* ---- 배달기사 (28단계) ---- */
  .rd-wrap{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:12px;padding:14px 0 60px;align-items:start;}
  @media (max-width:860px){ .rd-wrap{grid-template-columns:minmax(0,1fr);} }
  #rdMap{height:min(68vh,640px);border-radius:16px;border:1px solid var(--line);background:var(--surface-2);z-index:1;}
  .rd-list{display:flex;flex-direction:column;gap:8px;}
  .rd-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;}
  .rd-card.off{opacity:.6;}
  .rd-card[data-rdopen]{cursor:pointer;transition:border-color .15s, box-shadow .15s;}
  .rd-card[data-rdopen]:hover{border-color:var(--red);box-shadow:0 0 0 3px rgba(211,61,42,.12);}
  .rd-name{text-decoration:underline;text-decoration-color:rgba(211,61,42,.4);text-underline-offset:3px;}
  .rd-open{font-size:12px;color:var(--red);}
  .rd-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .rd-top b{font-size:16px;}
  .rd-dot{width:10px;height:10px;border-radius:50%;background:#b8a898;flex-shrink:0;}
  .rd-dot.on{background:var(--green);box-shadow:0 0 0 4px rgba(47,143,78,.18);}
  .rd-dot.stale{background:var(--mustard);}
  .rd-meta{font-size:12px;color:var(--muted);margin:4px 0 0;}
  .rd-orders{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
  .rd-pin{display:flex;align-items:center;justify-content:center;border-radius:50%;border:3px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.35);font-size:16px;line-height:1;width:38px;height:38px;background:var(--red);color:#fff;font-weight:800;}
  .rd-rider{position:relative;width:52px;height:57px;}
  .rd-rider img{position:relative;z-index:1;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35));}
  .rd-rider::before{content:"";position:absolute;left:50%;bottom:-2px;width:36px;height:11px;margin-left:-18px;border-radius:50%;background:rgba(211,61,42,.35);}
  .rd-rider.stale img{filter:grayscale(1) opacity(.65) drop-shadow(0 2px 3px rgba(0,0,0,.35));}
  .rd-rider.stale::before{background:rgba(229,167,49,.45);}
  .rd-pin.stale{background:#e5a731;} .rd-pin.home{background:#2a6fd3;width:30px;height:30px;font-size:11px;} .rd-pin.store{background:#fff;width:32px;height:32px;font-size:16px;} .rd-pin.errand{background:#e07b1a;width:30px;height:30px;font-size:13px;}
  .rider-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0 2px;padding:8px 10px;border-radius:10px;background:var(--surface-2);font-size:13px;}
  .rider-row select{flex:1;min-width:140px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 8px;font:inherit;font-weight:700;}
  .empty-box{grid-column:1/-1;text-align:center;color:var(--muted);padding:50px 0;}
</style>
</head>
<body>

<div id="loginView" class="login" hidden>
  <div class="card">
    <h3 style="font-size:22px;color:var(--red)">빨통 관리자 로그인</h3>
    <p class="hint">Admin sign-in</p>
    <div class="field"><label for="lEmail">아이디</label><input id="lEmail" type="text" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Admin"></div>
    <div class="field"><label for="lPw">비밀번호</label><input id="lPw" type="password" autocomplete="current-password"></div>
    <button class="primary-btn" id="lBtn">로그인</button>
    <button class="ghost-btn sm" id="lLang" data-raw style="margin-top:8px">🌐 English</button>
    <p class="hint" id="lDemo" hidden style="margin-bottom:0">데모 모드: 아무 값이나 입력해도 로그인됩니다.</p>
  </div>
</div>

<script>
const { CFG, MENU, ITEM_BY_ID, esc, peso, ls, STATUS, payInfo, isOnlinePay, api, toast, printReceipt } = PT;
const $ = id => document.getElementById(id);
const L = PTI18N.L, EN = () => PTI18N.lang === "en";
/* 🛵 기사 관리 창 (/admin?view=riders) — 관리자 '🛵 기사' 버튼을 누르면 새 창으로 열림.
   이 창은 기사 화면만 보여주고, 주문 알림 소리는 내지 않습니다 (원래 관리자 창에서만 울림) */
const QS = new URLSearchParams(location.search), RIDERS_WIN = QS.get("view") === "riders", DINING_WIN = QS.get("view") === "dining";
const SUB_WIN = RIDERS_WIN || DINING_WIN;   // 기사 창 · 다이닝 창 = 알림 소리 없음 (원래 관리자 창에서만 울림)
function openSubWindow(view, focus){
  const url = "/admin?view=" + view + (focus != null ? "&focus=" + encodeURIComponent(focus || "add") : "");
  let w = null;
  try{
    w = window.open("", "paltong_" + view);   // 이미 열린 창이 있으면 그 창을 씀 (다시 불러오지 않음)
    if(w){
      const open = w.location.href !== "about:blank" && w.SUB_WIN_READY === view;
      if(!open || focus != null) w.location.href = url;
    }
  }catch(e){ w = window.open(url, "paltong_" + view); }
  if(w){ try{ w.focus(); }catch(e){} return true; }
  return false;   // 팝업이 막혔으면 원래처럼 이 창에서 엶
}

let orders = [], viewDay = null, dayOrders = [], filter = "action", soldOut = {}, drafts = {}, receiptUrls = {}, printed = ls.get("paltong_printed", {});
const NEED_ACTION = ["new","receipt_submitted"];
/* 추가 메뉴 결제 영수증이 올라온 주문 */
const extraDue = o => o.payment !== "cash" && o.paid_total != null && o.total > o.paid_total ? o.total - o.paid_total : 0;
const extraPending = o => extraDue(o) > 0 && !!o.extra_receipt_at && ["receipt_submitted","confirmed","delivering"].includes(o.status);
const feeSrcLabel = o => o.fee_source === "zone" ? `${o.zone_name ? `<span data-raw>${esc(o.zone_name)}</span>` : L("지역", "zone")} ${L("자동", "auto")}${o.delivery_fee === 0 && o.zone_free_over ? L(` (₱${o.zone_free_over} 이상 무료)`, ` (free over ₱${o.zone_free_over})`) : ""}`
  : o.fee_source === "lalamove" ? L("라라무브 링크 · 자동 계산", "Lalamove link · auto") : o.fee_source === "manual" ? L("직원 수정", "edited by staff") : o.fee_source === "distance" ? `${L("라라무브식 자동", "Lalamove-style auto")}${o.distance_km != null ? " · " + o.distance_km + "km" : ""}` : "";
const needsAction = o => NEED_ACTION.includes(o.status) || extraPending(o);
const FILTERS = [
  { key:"action",  label:"처리 필요",   match:needsAction },
  { key:"accepted", label:"접수됨",     match:o => o.status === "accepted" },
  { key:"waiting", label:"조리·입금 대기", match:o => o.status === "awaiting_payment" },
  { key:"cooking", label:"조리·배달 중", match:o => ["confirmed","delivering"].includes(o.status) },
  { key:"closed",  label:"완료·취소",   match:o => ["done","cancelled"].includes(o.status) },
  { key:"all",     label:"전체",       match:() => true },
];

async function loadOrders(){
  const since = PT.bizStart(shiftDay(today(), -1)).toISOString();   // 어제 영업일 시작(오전 8시)부터
  try{
    const prev = new Map(orders.map(o => [o.id, o]));
    orders = await api.listOrders(since);
    const fresh = orders.filter(o => { const p = prev.get(o.id); if(PT.isDine(o)) return false;
      if(!p) return o.status !== "cancelled";
      return (NEED_ACTION.includes(o.status) && p.status !== o.status) || (o.items_added_at && o.items_added_at !== p.items_added_at)
        || (o.extra_receipt_at && o.extra_receipt_at !== p.extra_receipt_at); });
    if(prevLoaded && fresh.length) alertNew(fresh, prev);
    autoTranslate();
    prevLoaded = true;
    if(viewDay && !inCache(viewDay)) dayOrders = await api.listOrdersByDay(viewDay).catch(() => dayOrders);
    renderOrders();
    if(!$("diningView").hidden) renderDining();
  }catch(e){ console.error(e); toast("주문 불러오기 실패 — 인터넷 연결 확인", 3000); }
}
let prevLoaded = false;

/* ---------------- 알림 (소리 + 브라우저 알림) ---------------- */
/* 알림 소리는 기본 ON — 🔔 버튼으로 직접 끄기 전까지 계속 켜져 있음 (이 기기에 기억)
   브라우저 규칙상 소리는 화면을 한 번 눌러야 나올 수 있어서, 아직이면 '한 번 눌러주세요' 띠가 뜹니다 */
let audioCtx = null, soundOn = !SUB_WIN && ls.get("paltong_sound_on", true) !== false;
const audioRunning = () => !!audioCtx && audioCtx.state === "running";
function paintSoundBtn(){
  const b = $("soundBtn"); b.textContent = soundOn ? "🔔 알림 ON" : "🔕 알림 OFF";
  b.classList.toggle("on", soundOn); b.classList.toggle("red", !soundOn);
  let bar = $("soundUnlock");
  const need = soundOn && !audioRunning() && !$("appView").hidden;
  if(need && !bar){ bar = document.createElement("div"); bar.id = "soundUnlock";
    bar.textContent = "🔔 알림 소리를 켜려면 화면을 아무 곳이나 한 번 눌러주세요";
    bar.style.cssText = "position:fixed;left:0;right:0;top:0;z-index:500;background:#d33d2a;color:#fff;font-weight:800;text-align:center;padding:12px;font-size:15px;cursor:pointer";
    document.body.appendChild(bar); }
  if(bar) bar.hidden = !need;
}
function unlockAudio(){
  try{ audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); if(audioCtx.state !== "running") audioCtx.resume().then(paintSoundBtn).catch(() => {}); }catch(e){}
  try{ if("speechSynthesis" in window && !unlockAudio.spoke){ const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); unlockAudio.spoke = true; } }catch(e){}
  setTimeout(paintSoundBtn, 50);
}
["pointerdown", "keydown", "touchstart"].forEach(ev => document.addEventListener(ev, unlockAudio, { capture:true, passive:true }));
/* 알림 ON 인 동안 태블릿·휴대폰 화면이 꺼지지 않게 (화면이 꺼지면 브라우저가 멈춰서 알림이 안 울림) */
let wakeLock = null;
async function keepAwake(){
  try{
    if(!soundOn || document.hidden || !("wakeLock" in navigator) || $("appView").hidden){ if(wakeLock){ wakeLock.release().catch(() => {}); wakeLock = null; } return; }
    if(!wakeLock){ wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; }); }
  }catch(e){ /* 지원 안 하는 브라우저 */ }
}
document.addEventListener("visibilitychange", keepAwake);
document.addEventListener("pointerdown", keepAwake, { passive:true });
$("soundBtn").onclick = async () => {
  unlockAudio();
  soundOn = !soundOn; ls.set("paltong_sound_on", soundOn); paintSoundBtn(); keepAwake();
  if(soundOn){ playSound("order"); setTimeout(() => playSound("add"), 3200); setTimeout(() => playSound("msg"), 6400); toast(L("테스트: ORDER → ADDITIONAL → MESSAGE", "Test: ORDER → ADDITIONAL → MESSAGE"), 6000); try{ if("Notification" in window && Notification.permission === "default") await Notification.requestPermission(); }catch(e){} }
  else { try{ speechSynthesis.cancel(); }catch(e){} toast(L("알림 소리를 껐습니다", "Alert sound off"), 2500); }
};

const VOICE_TXT = { order: "Order! Order!", add: "Additional! Additional order!", msg: "Message! Message!" };
const voiceBuf = {};
async function voiceBuffer(kind){
  if(voiceBuf[kind]) return voiceBuf[kind];
  const b64 = VOICE_MP3[kind].split(",")[1], bin = atob(b64), arr = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  voiceBuf[kind] = await audioCtx.decodeAudioData(arr.buffer);
  return voiceBuf[kind];
}
function speakFallback(kind){   // 녹음 재생이 안 될 때만: 기기 음성
  try{ if(!("speechSynthesis" in window)) return; const u = new SpeechSynthesisUtterance(VOICE_TXT[kind]); u.lang = "en-US"; u.volume = 1; speechSynthesis.speak(u); }catch(e){}
}
async function speak(kind){
  kind = VOICE_MP3[kind] ? kind : "order";
  try{
    if(audioRunning()){
      const buf = await voiceBuffer(kind), src = audioCtx.createBufferSource(), g = audioCtx.createGain();
      g.gain.value = 1.6; src.buffer = buf; src.connect(g).connect(audioCtx.destination); src.start(); return;
    }
    const a = new Audio(VOICE_MP3[kind]); a.volume = 1; await a.play();
  }catch(e){ console.warn("voice", e); speakFallback(kind); }
}
function playSound(kind){
  if(!soundOn) return;
  if(!audioCtx) unlockAudio();
  const S = SOUNDS[kind] || SOUNDS.order;
  const tail = Math.max(...S.notes.map(n => n[1])) + S.dur;
  setTimeout(() => { if(soundOn) speak(kind); }, Math.round(tail * 1000) + 150);   // 알림음 다음 음성
  if(!audioCtx) return;
  const t = audioCtx.currentTime;
  S.notes.forEach(([f, d]) => {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = S.type; o.frequency.value = f;
    g.gain.setValueAtTime(.0001, t+d); g.gain.exponentialRampToValueAtTime(S.gain, t+d+.02); g.gain.exponentialRampToValueAtTime(.0001, t+d+S.dur);
    o.connect(g).connect(audioCtx.destination); o.start(t+d); o.stop(t+d+S.dur+.02);
  });
  try{ navigator.vibrate && navigator.vibrate(kind === "msg" ? [80,60,80] : [300,100,300,100,300]); }catch(e){}
}
const beep = () => playSound("order");
const ALARM_STYLE = { order:["🔔 새 주문","#d33d2a"], add:["➕ 추가 주문","#e07b00"], msg:["💬 새 메시지","#2a6fd3"], cancel:["🧾 취소 요청","#b45309"] };
function alarm(kind, msg, onOpen){
  if(SUB_WIN) return;   // 기사·다이닝 창에서는 알림 안 울림
  playSound(kind);
  let box = $("alarmBox"); if(!box){ box = document.createElement("div"); box.id = "alarmBox"; document.body.appendChild(box); }
  const [title, color] = ALARM_STYLE[kind] || ALARM_STYLE.order;
  const el = document.createElement("div"); el.className = "alarm"; el.style.background = color;
  el.innerHTML = `<b>${title}</b><span data-raw>${esc(msg)}</span><button aria-label="닫기">✕</button>`;
  el.onclick = e => { el.remove(); if(e.target.tagName !== "BUTTON" && onOpen) onOpen(); };
  box.prepend(el); while(box.children.length > 4) box.lastChild.remove();
  try{ if(document.hidden && "Notification" in window && Notification.permission === "granted") new Notification(PTI18N.tr(`빨통 ${title}`), { body: PTI18N.tr(msg), tag: kind + msg }); }catch(e){}
}
const goOrders = f => () => { showView("orders"); filter = f; renderOrders(); };
function alertNew(list, prev){
  const kinds = [];
  list.forEach(o => {
    const p = prev && prev.get(o.id);
    if(!p){ kinds.push("order"); alarm("order", `#${o.order_no} ${o.cust_name} · ${o.total == null ? L("배달비 미정", "fee TBD") : peso(o.total)}${o.order_type === "pickup" ? L(" 🏃 픽업", " 🏃 pickup") : ""}${o.scheduled_at ? " ⏰ " + schedText(o.scheduled_at) : ""} — ${L("수락해주세요", "please accept")}`, goOrders("action")); return; }
    if(o.items_added_at && o.items_added_at !== p.items_added_at){ kinds.push("add"); alarm("add", L(`#${o.order_no} 메뉴 추가 — 최종 ${peso(o.total)} · 주방 확인!`, `#${o.order_no} items added — total ${peso(o.total)} · tell the kitchen!`), goOrders("all")); return; }
    if(o.extra_receipt_at && o.extra_receipt_at !== p.extra_receipt_at){ kinds.push("add"); alarm("add", L(`#${o.order_no} 추가 결제 영수증 도착`, `#${o.order_no} add-on receipt arrived`), goOrders("action")); return; }
    kinds.push("order"); alarm("order", o.status === "new" ? L(`#${o.order_no} — 새 주문을 확인하세요`, `#${o.order_no} — check the new order`) : L(`#${o.order_no} 영수증 도착 — 확인해주세요`, `#${o.order_no} receipt arrived — please check`), goOrders("action"));
  });
}

/* 한글 요청사항 → 영어 (자동) — 메뉴 이름은 메뉴판 영어 이름 그대로 */
async function trText(t){ const pre = PT.menuToEnglish(t); return PT.hasHangul(pre) ? await api.translateText(pre) : pre; }
const trTried = {};
async function autoTranslate(){
  for(const o of orders){
    if(!o.memo || o.memo_en || trTried[o.id] || !PT.hasHangul(o.memo) || ["done","cancelled"].includes(o.status)) continue;
    trTried[o.id] = true;
    try{ const en = await trText(o.memo); if(en){ await api.updateOrder(o.id, { memo_en: en }); o.memo_en = en; renderOrders(); } }catch(e){ /* 번역 실패 → 원문 표시 */ }
  }
}

/* ---------------- 매장 할인 계산 ----------------
   할인 기준 = 음식값 − 쿠폰할인 (배달비는 할인하지 않음), 1페소 미만 버림 */
const foodBase = o => Math.max(0, o.subtotal - (o.discount || 0));
function storeDisc(o, d){
  const t = d && d.dtype;
  if(t === "5" || t === "10") return Math.floor(foodBase(o) * (+t) / 100);
  if(t === "custom") return Math.max(0, Math.min(foodBase(o), Math.round(+d.damt || 0)));
  return 0;
}
/* 할인 이름 — 영어 화면에서는 영어로 (저장은 한국어 그대로) */
const discText = lb => { const t = lb || "매장 할인"; return EN() ? t.replace("다이닝 할인", "Dine-in discount").replace("매장 할인", "Store discount").replace("PWD 할인", "PWD discount").replace("포인트 공제", "Points used").replace("가격 조정", "Price adjustment") : t; };
const discLabel = t => t === "5" ? "매장 할인 5%" : t === "10" ? "매장 할인 10%" : "매장 할인";
const calcTotal = (o, fee, sd) => foodBase(o) - (sd || 0) + (fee || 0) + (o.tip || 0);

/* ---------------- 가격 검증 (손님 화면 조작 방지용) ---------------- */
function expectedUnit(l){
  const it = ITEM_BY_ID[l.id]; if(!it) return null;
  let p = it.price;
  const groups = it.options || [];
  (l.opts || []).forEach((o, i) => {
    if(o.note) return;                                     // 관리자 메모 (가격 없음)
    const g = groups[o.g ?? i]; if(!g) return;
    const c = o.c != null ? g.choices[o.c] : g.choices.find(c => (c.en || c.label) === o.en || c.label === o.ko);
    if(c) p += (c.delta || 0) * (o.n || 1);
  });
  return p;
}
function priceWarnings(o){
  if(o.source === "external") return [];   // 외부 주문은 메뉴판 검사 안 함
  const w = [];
  let sum = 0;
  (o.items||[]).forEach(l => {
    if(PT.isSvc(l) || l.custom || l.priceByAdmin){ sum += l.unitPrice * l.qty; return; }   // 관리자가 가격을 바꾼 줄도 검사 안 함   // 서비스(₱0)·관리자 직접 입력 메뉴는 메뉴판 검사 안 함
    const e = expectedUnit(l);
    if(e == null) w.push(L(`알 수 없는 메뉴: ${l.name}`, `Unknown item: ${l.en || l.name}`));
    else if(e !== l.unitPrice) w.push(L(`${l.name}: 메뉴판 ${peso(e)} ≠ 주문 ${peso(l.unitPrice)}`, `${l.en || l.name}: menu ${peso(e)} ≠ order ${peso(l.unitPrice)}`));
    sum += l.unitPrice * l.qty;
  });
  if(sum !== o.subtotal) w.push(L(`합계 불일치: 항목합 ${peso(sum)} ≠ ${peso(o.subtotal)}`, `Subtotal mismatch: items ${peso(sum)} ≠ ${peso(o.subtotal)}`));
  return w;
}

/* ---------------- 주문 카드 ---------------- */
function fmtTime(d){ const x = new Date(d); return x.toLocaleTimeString(EN() ? "en-US" : "ko-KR", { hour:"2-digit", minute:"2-digit" }) + (Date.now() - x > 864e5*0.9 ? " (" + (x.getMonth()+1) + "/" + x.getDate() + ")" : ""); }
function ago(d){ const m = Math.floor((Date.now() - new Date(d)) / 60000); return m < 1 ? L("방금", "just now") : m < 60 ? L(`${m}분 전`, `${m} min ago`) : L(`${Math.floor(m/60)}시간 전`, `${Math.floor(m/60)} h ago`); }
/* 예약 주문 시간 (마닐라 시간 기준) */
function schedText(d){
  const x = new Date(d), opt = { timeZone:"Asia/Manila" };
  const day = x.toLocaleDateString("en-CA", opt), today = new Date().toLocaleDateString("en-CA", opt), tmr = new Date(Date.now() + 864e5).toLocaleDateString("en-CA", opt);
  const hm = EN() ? x.toLocaleTimeString("en-US", { ...opt, hour:"numeric", minute:"2-digit" }) : x.toLocaleTimeString("en-GB", { ...opt, hour:"2-digit", minute:"2-digit", hour12:false });
  const dl = day === today ? L("오늘", "today") : day === tmr ? L("내일", "tomorrow") : x.toLocaleDateString(EN() ? "en-US" : "ko-KR", { ...opt, month:"numeric", day:"numeric" });
  return `${dl} ${hm}`;
}

/* ---- 날짜별 보기: 오늘 / 어제 (영업일 기준) / 날짜 고르기 — viewDay null = 오늘(실시간) ---- */
const today = () => PT.bizDay(new Date());   // 영업일 (오전 8:00 ~ 다음날 7:59)
const shiftDay = (d, n) => PT.manilaDay(new Date(d + "T12:00:00+08:00").getTime() + n * 864e5);
function dayLabel(d){
  const t = today(), x = new Date(d + "T12:00:00+08:00");
  const base = x.toLocaleDateString(EN() ? "en-US" : "ko-KR", { timeZone:"Asia/Manila", month:"long", day:"numeric", weekday:"short" });
  return d === t ? `${L("오늘", "Today")} · ${base}` : d === shiftDay(t, -1) ? `${L("어제", "Yesterday")} · ${base}` : x.toLocaleDateString(EN() ? "en-US" : "ko-KR", { timeZone:"Asia/Manila", year:"numeric", month:"long", day:"numeric", weekday:"short" });
}
const inCache = d => d >= shiftDay(today(), -1);   // 오늘·어제는 이미 불러온 orders 안에 있어요
function srcOrdersAll(fk = filter){
  if(!viewDay) return fk === "action" || fk === "waiting" ? orders : orders.filter(o => PT.orderDay(o) === today());   // 처리 필요는 어제 못 끝낸 주문도 같이
  return inCache(viewDay) ? orders.filter(o => PT.orderDay(o) === viewDay) : dayOrders;
}
function srcOrders(fk){ return srcOrdersAll(fk).filter(o => !PT.isDine(o) || ["done", "cancelled"].includes(o.status)); }   // 진행 중인 다이닝(T)은 🍽 Dining 창에서, 결제 끝난 다이닝은 여기 목록에도 (R17)
let sortDesc = ls.get("paltong_sort_desc", true);   // 주문번호 정렬 (true = 큰 번호 위)
async function setViewDay(d){
  viewDay = d || null;
  if(viewDay && viewDay >= today()) viewDay = null;
  if(viewDay && !inCache(viewDay)){ try{ dayOrders = await api.listOrdersByDay(viewDay); }catch(e){ dayOrders = []; toast(PT.errMsg(e), 3000); } }
  if(viewDay && filter === "action") filter = "all";
  renderOrders();
}
function renderDaybar(){
  const t = today(), y = shiftDay(t, -1), d = viewDay;
  $("daybar").innerHTML = `<button class="pill ${d === y ? "sel" : ""}" data-day="${y}">${L("어제", "Yesterday")}</button>
    <button class="pill ${!d ? "sel" : ""}" data-day="">${L("오늘", "Today")}</button>
    <button class="pill" data-dstep="-1" title="${L("전날", "Previous day")}">◀</button>
    <input type="date" id="dayPick" value="${d || t}" max="${t}" title="${L("다른 날짜 보기", "Pick another day")}">
    <button class="pill" data-dstep="1" ${!d ? "disabled" : ""} title="${L("다음날", "Next day")}">▶</button>
    <button class="pill" id="cbBtn" style="margin-left:auto;background:#0E6B57;border-color:#0E6B57;color:#fff" title="${L("이 날 완료된 주문을 Paltong Cash Book 매출로 보내기", "Send this day's completed orders to the Paltong Cash Book")}">📒 ${L("캐시북으로", "To Cash Book")}</button>
    ${cReqs.some(r => r.status === "pending" || crNeedsFollow(r)) ? `<button class="pill" id="crBtn" style="background:#b45309;border-color:#b45309;color:#fff;font-weight:800">🧾 ${L("취소 요청", "Cancels")} <span class="n">${cReqs.filter(r => r.status === "pending" || crNeedsFollow(r)).length}</span></button>` : ""}
    <button class="pill" id="dkSnapBtn" style="background:#0f766e;border-color:#0f766e;color:#fff">📷 ${L("DK 캡처", "DK screenshot")}</button>
    <button class="pill" id="extBtn" style="background:var(--red);border-color:var(--red);color:#fff">➕ ${L("외부 주문", "Outside order")}</button>`;
  $("extBtn").onclick = () => extOrderModal();
  $("dkSnapBtn").onclick = () => extOrderModal({ ch: "DK", ocr: true });
  if($("crBtn")) $("crBtn").onclick = () => cancelReqListModal();
  $("cbBtn").onclick = () => cashbookModal(viewDay || today());
  $("daybar").querySelectorAll("[data-day]").forEach(b => b.onclick = () => setViewDay(b.dataset.day));
  $("daybar").querySelectorAll("[data-dstep]").forEach(b => b.onclick = () => setViewDay(shiftDay(viewDay || t, +b.dataset.dstep)));
  $("dayPick").onchange = e => setViewDay(e.target.value);
}
/* ---------------- 🍽 다이닝 (홀) — 40단계 ----------------
   T 주문을 열고, 결제 완료 전까지 메뉴를 계속 추가 → 💳 결제 완료 = '완료'(잠김) → Cash Book 매출 */
const elapsedMin = o => Math.max(0, Math.round((Date.now() - new Date(o.created_at)) / 60000));
function dnCard(o){
  const m = elapsedMin(o), items = o.items || [];
  return `<div class="ocard dn" data-dn="${o.id}">
    <div class="ohead"><span class="no">${esc(PT.orderCode(o))}</span><span class="status-pill" style="background:#e5a731">${L("미결제", "Unpaid")}</span>
      <span class="time">${new Date(o.created_at).toLocaleTimeString(EN() ? "en-US" : "ko-KR", { hour:"numeric", minute:"2-digit", timeZone:"Asia/Manila" })} · ${m < 60 ? L(`${m}분째`, `${m} min`) : L(`${Math.floor(m/60)}시간 ${m%60}분째`, `${Math.floor(m/60)}h ${m%60}m`)}</span></div>
    <div class="items">${items.map((l, i) => `<div class="sum-row" style="align-items:center;gap:6px">
        <span style="flex:1;min-width:0"><b>${esc(EN() ? (l.en || l.name) : l.name)}</b>${l.opts && l.opts.length ? ` <span class="hint" style="margin:0">${esc(l.opts.map(x => EN() ? (x.en || x.ko) : x.ko).join(", "))}</span>` : ""}${PT.isSvc(l) ? ` <b style="color:var(--red-deep)">${L("서비스", "FREE")}</b>` : ""}</span>
        <span style="white-space:nowrap;display:flex;align-items:center;gap:4px"><button class="chip" data-dq="${i}|-1">−</button><b>${l.qty}</b><button class="chip" data-dq="${i}|1">+</button>
        <span style="min-width:64px;text-align:right">${PT.isSvc(l) ? "₱0" : peso(l.unitPrice * l.qty)}</span>${PT.isSvc(l) ? "" : `<button class="chip" data-dprice="${i}" title="${L("가격 수정", "Edit price")}">✏️</button><button class="chip" data-dsvc="${i}" title="${L("서비스로", "Make free")}">🎁</button>`}</span></div>`).join("")}</div>
    <div class="calc-box">
      ${o.discount || o.store_discount || o.tip > 0 ? `<div class="sum-row"><span>${L("소계", "Subtotal")}</span><span>${peso(o.subtotal)}</span></div>` : ""}
      ${o.discount ? `<div class="sum-row"><span>🏷 ${esc(o.coupon_title || "DC")}</span><span>-${peso(o.discount)}</span></div>` : ""}
      ${o.store_discount ? `<div class="sum-row"><span>${esc(discText(o.store_discount_label))}</span><span>-${peso(o.store_discount)}</span></div>` : ""}
      ${o.tip > 0 ? `<div class="sum-row" style="color:#0f766e;font-weight:700"><span>💝 ${L("팁", "Tip")}</span><span>+${peso(o.tip)}</span></div>` : ""}
      <div class="sum-row total"><span>${L("합계", "Total")}</span><b style="font-size:20px">${peso(o.total)}</b></div></div>
    ${cancelReqHTML(o)}
    ${pwdRowHTML(o)}
    <div class="btn-row"><button class="ghost-btn sm" data-dadd>➕ ${L("메뉴 추가", "Add item")}</button><button class="ghost-btn sm" data-dsvcadd>🎁 ${L("서비스", "Free item")}</button><button class="ghost-btn sm" data-dprint>🖨 ${L("주문서", "Print")}</button><button class="ghost-btn sm" data-ddisc>🏷 Add/DC</button></div>
    <div class="btn-row"><button class="primary-btn sm green" data-dpay>💳 ${L("결제 완료", "Paid")} · ${peso(o.total)}</button></div>
    <button class="ghost-btn sm" data-dcancel style="margin-top:6px">🗑 ${L("주문 취소", "Cancel order")}</button></div>`;
}
function renderDining(){
  const V = $("diningView"); if(!V || V.hidden) return;
  const t = today(), dine = orders.filter(PT.isDine);
  const open = dine.filter(o => !["done", "cancelled"].includes(o.status)).sort((a, b) => a.created_at.localeCompare(b.created_at));
  const paid = dine.filter(o => o.status === "done" && PT.orderDay(o) === t).sort((a, b) => b.updated_at.localeCompare(a.updated_at));
  const by = {}; paid.forEach(o => { by[o.payment] = (by[o.payment] || 0) + (o.total || 0); });
  const total = paid.reduce((a, o) => a + (o.total || 0), 0);
  V.innerHTML = `<div class="daybar" style="margin-top:12px"><button class="primary-btn sm" id="dnNew" style="width:auto;padding:12px 18px">➕ ${L("새 다이닝 주문 (T)", "New dine-in order (T)")}</button>
      <span class="hint" style="margin:0;flex:1;min-width:200px">${L("결제 완료 전까지 메뉴를 계속 추가·수정할 수 있어요. 💳 결제 완료를 누르면 잠기고, 결제 완료된 주문만 Cash Book 매출로 들어가요.", "Keep adding items until it's paid. 💳 Paid locks it — only paid orders go to the Cash Book.")}</span></div>
    <div class="grid">${open.length ? open.map(dnCard).join("") : `<div class="empty-box">${L("열린 다이닝 주문이 없어요", "No open dine-in orders")}</div>`}</div>
    <div class="dayhead" style="margin:0 0 8px"><b>💳 ${L("오늘 결제 완료", "Paid today")} · ${paid.length}${L("건", "")} · ${peso(total)}</b>
      <span class="hint">${Object.keys(by).map(k => `${k === "cash" ? L("현금", "Cash") : PT.payInfo(k).labelEn} ${peso(by[k])}`).join(" · ")}</span></div>
    <div class="so-grid">${paid.map(o => `<div class="so-item"><span><b>${esc(PT.orderCode(o))}</b> · ${esc(o.payment === "cash" ? L("현금", "Cash") : PT.payInfo(o.payment).labelEn)} · ${new Date(o.updated_at).toLocaleTimeString(EN() ? "en-US" : "ko-KR", { hour:"numeric", minute:"2-digit", timeZone:"Asia/Manila" })}</span><span><b>${peso(o.total)}</b> <button class="chip" data-dreprint="${o.id}">🖨</button></span></div>`).join("")}</div>`;
  V.querySelector("#dnNew").onclick = () => addItemModal({ dineNew: true, items: [] }, false);
  V.querySelectorAll("[data-dreprint]").forEach(b => b.onclick = () => doPrint(dine.find(o => o.id === b.dataset.dreprint)));
  V.querySelectorAll("[data-dn]").forEach(el => {
    const o = dine.find(x => x.id === el.dataset.dn); if(!o) return;
    el.querySelector("[data-dadd]").onclick = () => addItemModal(o, false);
    el.querySelector("[data-dsvcadd]").onclick = () => addItemModal(o, true);
    el.querySelector("[data-dprint]").onclick = () => doPrint(o);
    el.querySelector("[data-dpay]").onclick = () => dinePayModal(o);
    el.querySelector("[data-dcancel]").onclick = () => cancelReqModal(o);   // 🧾 사유 + 관리자 수락
    el.querySelectorAll("[data-dsvc]").forEach(b => b.onclick = () => svcLine(o, +b.dataset.dsvc));
    el.querySelectorAll("[data-dprice]").forEach(b => b.onclick = () => editLinePrice(o, +b.dataset.dprice));
    el.querySelector("[data-ddisc]").onclick = () => addDcModal(o);
    bindPwd(el, o); bindCancelReq(el);
    el.querySelectorAll("[data-dq]").forEach(b => b.onclick = async () => {
      const [i, d] = b.dataset.dq.split("|").map(Number), items = JSON.parse(JSON.stringify(o.items || []));
      items[i].qty += d;
      if(items[i].qty < 1){
        if(items.length === 1){ el.querySelector("[data-dcancel]").click(); return; }
        if(!confirm(L(`'${items[i].name}'를 뺄까요?`, `Remove '${items[i].name}'?`))) return;
        items.splice(i, 1);
      }
      b.disabled = true; await saveSvcItems(o, items, null);
    });
  });
}
/* 💵 현금 거스름돈 계산 — 받은 돈을 누르거나 입력하면 거스름돈이 크게 보임 */
function cashBoxHTML(total){
  const outs = [...new Set([Math.ceil(total / 100) * 100, Math.ceil(total / 500) * 500, Math.ceil(total / 1000) * 1000, Math.ceil(total / 1000) * 1000 + 1000])].filter(v => v > total).slice(0, 4);
  return `<div class="calc-box" id="cashBox" style="margin:0 0 12px">
    <div class="field" style="margin:0 0 8px"><label>💵 ${L("받은 돈", "Cash received")}</label>
      <input id="cashGot" type="number" min="0" inputmode="numeric" placeholder="${total}" style="font-size:22px;font-weight:800"></div>
    <div class="chips" style="margin:0 0 10px"><button type="button" class="chip" data-cq="${total}" style="padding:9px 12px;font-size:14px">${L("딱 맞게", "Exact")}</button>${outs.map(v => `<button type="button" class="chip" data-cq="${v}" style="padding:9px 12px;font-size:14px">${peso(v)}</button>`).join("")}</div>
    <div class="sum-row total" id="cashChg" style="font-size:24px;margin:0"><span>${L("거스름돈", "Change")}</span><b>—</b></div></div>`;
}
function bindCashBox(ov, total){
  const inp = ov.querySelector("#cashGot"), out = ov.querySelector("#cashChg");
  const paint = () => { const v = inp.value === "" ? null : Math.round(+inp.value);
    if(v == null || isNaN(v)){ out.innerHTML = `<span>${L("거스름돈", "Change")}</span><b>—</b>`; out.style.color = ""; return; }
    if(v < total){ out.innerHTML = `<span>${L("부족", "Short")}</span><b style="color:inherit">${peso(total - v)}</b>`; out.style.color = "var(--red-deep)"; return; }
    out.innerHTML = `<span>${L("거스름돈", "Change")}</span><b style="font-size:28px;color:inherit">${peso(v - total)}</b>`; out.style.color = "var(--green)"; };
  inp.oninput = paint;
  ov.querySelectorAll("[data-cq]").forEach(b => b.onclick = () => { inp.value = b.dataset.cq; paint(); });
  // 받은 돈 (비우면 딱 맞게 받은 걸로), 모자라면 null
  return () => { const v = inp.value === "" ? total : Math.round(+inp.value); if(isNaN(v) || v < total){ toast(L(`${peso(total - (v || 0))} 모자라요`, `${peso(total - (v || 0))} short`), 3000); inp.focus(); return null; } return v; };
}
/* 카드에 💰 받은 금액 · ⚠️ 차액과 사유 */
const recvHTML = o => o.received_amount == null ? "" : o.received_diff
  ? `<div class="warn" style="border-color:var(--red);background:#fdecea;color:#7a1f14">⚠️ <b>${L("받은 금액이 달라요", "Amount received differs")}</b> — ${L("받을", "due")} ${peso((o.received_amount || 0) - o.received_diff)} · ${L("받은", "got")} <b>${peso(o.received_amount)}</b> (${o.received_diff < 0 ? "−" : "+"}${peso(Math.abs(o.received_diff))}) · ${esc(PAY_NAME(o.received_method))}${o.received_by ? ` · <span data-raw>${esc(o.received_by)}</span>` : o.staff_name ? ` · 🙋 <span data-raw>${esc(o.staff_name)}</span>` : ""}
      <br>❓ ${L("이유", "Why")}: <span data-raw>${esc(o.received_reason || "")}</span><br>📢 ${L("미리 안내 안 한 이유", "Why not reported")}: <span data-raw>${esc(o.received_unreported || "")}</span></div>`
  : `<div class="hint" style="margin:4px 0">💰 ${L("받은 금액", "Received")} <b>${peso(o.received_amount)}</b> · ${esc(PAY_NAME(o.received_method))}${o.received_by ? ` · <span data-raw>${esc(o.received_by)}</span>` : ""} ✓</div>`;
/* ---------------- 💰 받은 금액 확인 (46단계) ----------------
   계산 완료 때: 현금 = 받은 돈 입력 선택(비우면 딱 맞게), GCash·Maya·계좌 = 받은 금액 꼭 입력.
   받을 금액과 다르면 '왜 다른지' + '왜 미리 안내 안 했는지'를 써야 완료 */
const PAY_NAME = m => m === "cash" ? L("현금", "Cash") : m === "gcash" ? "GCash" : m === "maya" ? "Maya" : m === "bank" ? L("계좌이체", "Bank") : (m || "");
function recvBoxHTML(due){
  return `<div id="rvCash">${cashBoxHTML(due)}</div>
    <div id="rvOnline" class="calc-box" style="margin:0 0 12px" hidden>
      <div class="field" style="margin:0"><label>💳 <span id="rvWay"></span> ${L("받은 금액 (입금 내역에서 확인한 금액) — 꼭 입력", "Amount received (check the transfer) — required")}</label>
        <input id="rvGot" type="number" min="0" inputmode="numeric" placeholder="${due}" style="font-size:22px;font-weight:800"></div>
      <div class="chips" style="margin:8px 0 0"><button type="button" class="chip" id="rvSame" style="padding:9px 12px;font-size:14px">${L("받을 금액과 같아요", "Same as due")} ${peso(due)}</button></div></div>
    <div id="rvDiff" class="calc-box" style="margin:0 0 12px;border:2px solid var(--red)" hidden>
      <div class="sum-row total" style="color:var(--red-deep);margin:0 0 8px"><span id="rvDiffLbl"></span><b id="rvDiffAmt"></b></div>
      <div class="field"><label>❓ ${L("왜 금액이 다른가요? (꼭 입력)", "Why is the amount different? (required)")}</label>
        <textarea id="rvReason" rows="2" class="note-in" style="margin:0" placeholder="${L("예: 손님이 ₱50 덜 보냄 / 배달비를 깎아줌 / 잔돈이 없어서 덜 받음", "e.g. customer sent ₱50 less / gave a delivery discount")}"></textarea></div>
      <div class="field" style="margin:0"><label>📢 ${L("왜 미리 안내(보고)하지 않았나요? (꼭 입력)", "Why wasn't this reported beforehand? (required)")}</label>
        <textarea id="rvUnrep" rows="2" class="note-in" style="margin:0" placeholder="${L("예: 계산할 때 처음 알았음 / 사장님께 카톡으로 말씀드림", "e.g. only noticed at checkout / told the owner on KakaoTalk")}"></textarea></div></div>`;
}
function bindRecv(ov, due, getMethod){
  bindCashBox(ov, due);   // 빠른 버튼 · 거스름돈 표시
  const q = x => ov.querySelector(x), cashIn = q("#cashGot"), onIn = q("#rvGot");
  const calc = () => {
    const m = getMethod();
    if(m === "cash"){ const v = cashIn.value === "" ? due : Math.round(+cashIn.value); if(isNaN(v)) return null; return { got: v, kept: Math.min(v, due), diff: v >= due ? 0 : v - due, change: Math.max(0, v - due) }; }
    if(onIn.value === "") return null;
    const v = Math.round(+onIn.value); if(isNaN(v) || v < 0) return null;
    return { got: v, kept: v, diff: v - due, change: 0 };
  };
  const paint = () => {
    const m = getMethod(); q("#rvCash").hidden = m !== "cash"; q("#rvOnline").hidden = m === "cash"; q("#rvWay").textContent = PAY_NAME(m);
    const c = calc(), d = c ? c.diff : 0; q("#rvDiff").hidden = !d;
    if(d){ q("#rvDiffLbl").textContent = d < 0 ? L("⚠️ 덜 받음", "⚠️ Short") : L("⚠️ 더 받음", "⚠️ Over"); q("#rvDiffAmt").textContent = (d < 0 ? "−" : "+") + peso(Math.abs(d)); }
  };
  cashIn.addEventListener("input", paint); onIn.addEventListener("input", paint);
  ov.querySelectorAll("[data-cq]").forEach(b => b.addEventListener("click", paint));
  q("#rvSame").onclick = () => { onIn.value = due; paint(); };
  paint();
  return {
    paint,
    focus(){ const el = getMethod() === "cash" ? cashIn : onIn; setTimeout(() => el.focus(), 60); },
    read(){   // 잘못되면 안내하고 null
      const m = getMethod(), c = calc();

async function saveRecv(o, r, base){

  catch(e){
    if(/received_|column|schema cache/i.test(String(e.message || e))){ toast(L("⚠️ 46단계 SQL을 실행해야 받은 금액이 저장돼요 (sql/46-received-amount.sql) — 이번 건은 기록 없이 진행", "⚠️ Run SQL step 46 to save received amounts — continuing without it"), 6000); return true; }

        : `<p class="hint" style="margin:6px 0">${L(`수락하면 손님 채팅에 "주문이 접수되었습니다. 수정되는 부분이 있으면 다시 안내드리겠습니다. 조리가 시작되면 입금 부탁드립니다"가 자동으로 갑니다.`,
             `Accepting sends "Your order is accepted! We will let you know if anything changes. Please pay once cooking starts." to the customer chat.`)}</p>
           <div class="btn-row"><button class="primary-btn sm" data-act="accept">✅ 주문 수락</button></div>`}
      <div class="btn-row">
        ${pick ? "" : `<button class="ghost-btn sm" data-act="llmodal">🛵 라라무브 링크·금액</button><button class="ghost-btn sm" data-act="editfee">✏️ 배달료 수정</button>`}
      </div>
      <div class="btn-row"><button class="ghost-btn sm" data-act="${acc ? "cancel" : "reject"}">${acc ? "주문 취소" : "주문 거절"}</button></div>`;
  }
  if(o.status === "awaiting_payment"){
    action = `${o.store_discount ? `<div class="sum-row"><span>${esc(discText(o.store_discount_label))}</span><span>-${peso(o.store_discount)}</span></div>` : ""}
      <div class="sum-row"><span>배달비${o.fee_source ? ` <span class="en">${feeSrcLabel(o)}</span>` : ""}</span><span>${peso(o.delivery_fee)}</span></div>
      <div class="sum-row total"><span>최종 금액</span><b>${peso(o.total)}</b></div>
      <p class="hint">${L("👩‍🍳 조리 중 · 손님 입금 대기 — 손님이 영수증을 올리면 '처리 필요'로 올라옵니다.", "👩‍🍳 Cooking · waiting for payment — it moves to 'Needs action' when the customer uploads a receipt.")}</p>
      <div class="btn-row">
        ${pick ? "" : `<button class="ghost-btn sm" data-act="llmodal">🛵 라라무브 링크·금액</button><button class="ghost-btn sm" data-act="editfee">✏️ 배달료 수정</button>`}
        <button class="ghost-btn sm" data-act="print">🖨 인쇄</button>
      </div>
      <div class="btn-row"><button class="ghost-btn sm" data-act="forceconfirm">결제 직접 확인 (카톡 등으로 받음)</button></div>
      <div class="btn-row"><button class="ghost-btn sm" data-act="cancel">주문 취소</button></div>`;
  }
  if(o.status === "receipt_submitted"){
    action = `<div class="sum-row total"><span>받아야 할 금액</span><b>${peso(o.paid_total ?? o.total)}</b></div>
      <div class="hint">${esc(L(p.label, p.labelEn || p.label))} → ${esc(p.accountNo||"")} · ${fmtTime(o.receipt_at)} ${L("제출", "submitted")}</div>
      <img class="rc-thumb" data-rc="${o.id}" alt="영수증 불러오는 중…" ${receiptUrls[o.id] ? `src="${esc(receiptUrls[o.id])}"` : ""}>
      <div class="btn-row"><button class="primary-btn sm green" data-act="confirm">✔ 결제 확인 → 주문 시작${CFG.AUTO_PRINT_ON_CONFIRM ? " + 인쇄" : ""}</button></div>
      <input class="note-in" placeholder="반려 사유 (예: 금액이 다릅니다 / 영수증이 잘 안보여요)" value="${esc(d.rnote||"")}" data-draft="${o.id}|rnote">
      <div class="btn-row"><button class="ghost-btn sm" data-act="rejectrc">영수증 반려 (다시 올리게 하기)</button></div>`;
  }
  if(o.status === "confirmed"){
    action = `<div class="sum-row total"><span>${isOnlinePay(o.payment) ? (extraDue(o) ? L("결제완료 ", "Paid ") + peso(o.paid_total) + L(" + 추가분", " + add-on") : L("결제완료", "Paid")) : "현금 수령 예정"}</span><b>${peso(o.total)}</b></div>
      <div class="btn-row"><button class="ghost-btn sm" data-act="print">🖨 영수증 인쇄${printed[o.id] ? " (다시)" : ""}</button>${pick ? `<button class="primary-btn sm" data-act="ready">🔔 준비 완료 (손님 알림)</button>` : `<button class="primary-btn sm" data-act="deliver">🛵 배달 출발</button>`}</div>
      <div class="hint" style="margin-top:6px" ${pick ? "hidden" : ""}>배달비 ${peso(o.delivery_fee)} ${o.fee_source ? `<span class="en">${feeSrcLabel(o)}</span>` : ""} <button class="chip" data-act="editfee">✏️ 배달료 수정</button></div>
      ${o.receipt_path ? `<div class="btn-row"><button class="ghost-btn sm" data-act="showrc">영수증 사진 보기</button></div>` : ""}`;
  }
  if(o.status === "delivering"){
    action = `<div class="sum-row total"><span>${isOnlinePay(o.payment) ? "결제완료" : "현금 수령"}</span><b>${peso(o.total)}</b></div>
      ${pick ? `<p class="hint" style="margin:6px 0">${L("🏃 손님에게 '픽업 준비 완료'가 표시되고 있습니다.", "🏃 The customer sees 'Ready for pickup'.")} ${isOnlinePay(o.payment) ? "" : L(`매장에서 현금 ${peso(o.total)} 받기`, `Collect ${peso(o.total)} cash at the store`)}</p>` : `<div class="hint" style="margin:6px 0">${o.tracking_url ? `📍 <a href="${esc(o.tracking_url)}" target="_blank" rel="noopener">배달 위치 링크</a> (손님 화면에 '위치 확인' 버튼 표시 중)` : "📍 위치 링크 없음"} <button class="chip" data-act="tracklink">${o.tracking_url ? "링크 수정" : "링크 입력"}</button></div>
      <div class="hint" style="margin-bottom:6px">배달비 ${peso(o.delivery_fee)} ${o.fee_source ? `<span class="en">${feeSrcLabel(o)}</span>` : ""} <button class="chip" data-act="editfee">✏️ 배달료 수정</button></div>`}
      <div class="btn-row"><button class="ghost-btn sm" data-act="print">🖨 인쇄</button><button class="primary-btn sm green" data-act="done">${pick ? "✅ 픽업 완료" : "배달 완료"}</button></div>`;
  }
  if(o.status === "done" || o.status === "cancelled"){
    action = `${o.total != null ? `<div class="sum-row total"><span>합계</span><b>${peso(o.total)}</b></div>` : ""}
      ${o.status === "done" ? (priceUnlocked(o)
        ? `<div class="btn-row"><span class="hint" style="margin:0;align-self:center;color:#b45309">🔓 ${L(`가격 수정 중 · ${Math.max(1, Math.ceil((unlockUntil[o.id] - Date.now()) / 60000))}분 뒤 자동 잠김`, `Editing prices · locks in ${Math.max(1, Math.ceil((unlockUntil[o.id] - Date.now()) / 60000))} min`)}</span><button class="ghost-btn sm" data-act="lockprice" style="width:auto">🔒 ${L("잠그기", "Lock")}</button></div>`
        : `<div class="btn-row"><button class="ghost-btn sm" data-act="unlockprice">🔒 ${L("가격 수정 (관리자 비밀번호)", "Edit prices (admin password)")}</button></div>`) : ""}
      ${o.admin_note && o.status === "cancelled" ? `<p class="hint">사유: <span data-raw>${esc(o.admin_note)}</span></p>` : ""}
      <div class="btn-row">${o.total != null ? `<button class="ghost-btn sm" data-act="print">🖨 인쇄</button>` : ""}${o.receipt_path ? `<button class="ghost-btn sm" data-act="showrc">영수증 사진</button>` : ""}</div>`;
  }

  return `<div class="ocard ${needsAction(o) ? "urgent" : ""}" data-id="${o.id}">
    <div class="ohead"><span class="no">${esc(PT.orderCode(o))}</span>
      <span class="status-pill" style="background:${st.color}">${L(st.ko, st.en)}</span>
      <button type="button" class="status-pill" data-act="editpay" title="${L("결제 방법 바꾸기 (가격 비밀번호)", "Change payment method (price password)")}" style="border:0;cursor:pointer;background:${o.received_method === "split" ? "#7a5cd3" : isOnlinePay(o.payment) ? "#2a6fd3" : "#6b6b6b"}">${o.received_method === "split" ? `🔀 ${L("나눠 받음", "Split")}` : dine && o.payment === "cash" ? L("현금", "Cash") : esc(L(p.label, p.labelEn || p.label))} ✎</button>
      ${dine ? `<span class="status-pill" style="background:#e5a731">🍽 ${L("다이닝", "Dining")}</span>` : ""}
      ${o.scheduled_at ? `<span class="status-pill" style="background:#c2410c">⏰ ${L("예약", "Scheduled")} ${schedText(o.scheduled_at)}</span>` : ""}
      ${pick && !dine ? `<span class="status-pill" style="background:#7a5cd3">🏃 픽업</span>` : ""}
      ${o.source === "external" ? `<span class="status-pill" style="background:#0f766e">${chLabel(o.channel)}</span>` : ""}
      ${o.rider_id ? `<span class="status-pill" style="background:#d33d2a">🛵 <span data-raw>${esc(riderName(o.rider_id))}</span></span>` : ""}
      ${staffPill(o)}
      ${dine ? "" : o.user_id ? `<span class="status-pill member-badge">👤 회원</span>` : `<span class="status-pill" style="background:#b8a898">비회원</span>`}
      <span class="time">${fmtTime(o.created_at)} · ${ago(o.created_at)}</span></div>
    <div class="cust"${dine ? ' style="display:none"' : ""}><b data-raw>${esc(o.cust_name)}</b> · <a href="tel:${esc(o.cust_phone.replace(/[^\d+]/g,""))}">${esc(o.cust_phone)}</a><br>
      ${o.scheduled_at ? `<b style="color:#c2410c">⏰ ${L("예약 주문", "Scheduled for")} ${schedText(o.scheduled_at)}</b><br>` : ""}
      ${pick ? `🏃 <b>매장 픽업</b>` : `📍 <span data-raw>${esc(o.cust_addr)}</span>`} ${pick ? "" : o.lat != null
        ? `<a class="map-pin" href="https://www.google.com/maps/search/?api=1&query=${o.lat},${o.lng}" target="_blank" rel="noopener">🗺 핀 위치</a>
           <button class="chip" data-copymap="https://www.google.com/maps/search/?api=1&query=${o.lat},${o.lng}">링크 복사</button>`
        : `<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(o.cust_addr)}" target="_blank" rel="noopener">지도</a>`}
      ${o.memo ? `<br>📝 <b data-raw>${esc(o.memo_en || o.memo)}</b>${o.memo_en && o.memo_en !== o.memo ? `<br><span class="hint">원문: <span data-raw>${esc(o.memo)}</span></span>` : PT.hasHangul(o.memo) ? ` <span class="hint">(번역 중…)</span>` : ""}` : ""}</div>
    <div class="items">${itemsHTML}<div class="sum-row"><span>메뉴 합계</span><b>${peso(o.subtotal)}</b></div>
      ${o.store_discount && o.status !== "awaiting_payment" ? `<div class="sum-row" style="color:var(--green);font-weight:800"><span>🏷 ${esc(discText(o.store_discount_label))}</span><b>-${peso(o.store_discount)}</b></div>` : ""}
      ${o.discount ? (isDcTitle(o.coupon_title) ? `<div class="sum-row" style="color:var(--green);font-weight:800"><span>🏷 ${esc(o.coupon_title)}</span><b>-${peso(o.discount)}</b></div>` : `<div class="sum-row" style="color:var(--green);font-weight:800"><span>🎟 쿠폰 할인 <span class="en" data-raw>${esc(o.coupon_title||"")}</span></span><b>-${peso(o.discount)}</b></div>`) : ""}
      ${o.tip > 0 ? `<div class="sum-row" style="color:#0f766e;font-weight:800"><span>💝 ${L("팁", "Tip")}</span><b>+${peso(o.tip)}</b></div>` : ""}</div>
    ${warns.length ? `<div class="warn">⚠ 가격 확인 필요<br>${warns.map(esc).join("<br>")}</div>` : ""}
    ${recvHTML(o)}
    ${o.items_added_at && !["done","cancelled"].includes(o.status) ? `<div class="warn">➕ ${fmtTime(o.items_added_at)} ${L("손님이 메뉴를 추가했습니다 — 주방에 알려주세요", "the customer added items — tell the kitchen")}${["confirmed","delivering"].includes(o.status) ? ` <button class="chip" data-act="print">🖨 다시 인쇄</button>` : ""}</div>` : ""}
    ${o.payment !== "cash" && o.paid_total != null && o.paid_total > (o.total || 0) && !["cancelled"].includes(o.status) ? `<div class="warn">${L(`💸 손님이 ${peso(o.paid_total - o.total)} 더 냈습니다 (배달비 조정·무료배달) — 돌려주거나 다음 주문에서 차감하세요`, `💸 The customer overpaid ${peso(o.paid_total - o.total)} (fee changed / free delivery) — refund it or deduct next time`)}</div>` : ""}
    ${extraDue(o) && ["receipt_submitted","confirmed","delivering"].includes(o.status) ? `<div class="calc-box" style="border:2px solid var(--red)">
        <div class="sum-row total"><span>➕ 추가 메뉴 결제</span><b>${peso(extraDue(o))}</b></div>
        ${o.extra_receipt_at ? `<img class="rc-thumb" data-exrc="${o.id}" alt="추가 결제 영수증" ${receiptUrls["x" + o.id] ? `src="${esc(receiptUrls["x" + o.id])}"` : ""}>
          <div class="btn-row"><button class="primary-btn sm green" data-act="extraok">✔ 추가 결제 확인</button><button class="ghost-btn sm" data-act="extrano">반려</button></div>`
          : `<p class="hint" style="margin:6px 0 0">손님이 추가 금액을 송금하고 영수증을 올리면 여기에 표시됩니다. <button class="chip" data-act="extraok">받은 것으로 처리</button></p>`}
      </div>` : ""}
    ${riderRowHTML(o)}
    ${cancelReqHTML(o)}
    ${pwdRowHTML(o)}
    ${action}
    ${["confirmed", "receipt_submitted", "delivering"].includes(o.status) && !(cReqOf(o) && (cReqOf(o).status === "pending" || crNeedsFollow(cReqOf(o)))) ? `<div class="btn-row"><button class="ghost-btn sm" data-act="cancel">🧾 ${L("주문 취소 요청", "Request cancel")}</button></div>` : ""}
    ${o.source === "external" ? `<div class="btn-row"><button class="ghost-btn sm" data-delext style="color:var(--red-deep);border-color:var(--red)">🗑 ${L("잘못 올린 외부 주문 삭제", "Delete this outside order")}</button></div>` : ""}
    ${!["done","cancelled"].includes(o.status) ? `<div class="btn-row"><button class="ghost-btn sm" data-chat="${o.id}">💬 채팅${chatUnreadFor(o.id) ? ` <span class="rv-n" style="background:var(--red);color:#fff">${chatUnreadFor(o.id)}</span>` : ""}</button></div>` : ""}
  </div>`;
}

function bindCard(o){
  const el = document.querySelector(`.ocard[data-id="${o.id}"]`); if(!el) return;
  const d = drafts[o.id] = drafts[o.id] || {};
  const feeIn = el.querySelector('[data-draft$="|fee"]');
  const updTotal = () => {
    if(!feeIn) return;
    d.fee = feeIn.value;
    const sd = storeDisc(o, d), q = x => el.querySelector(x);
    q("[data-sdrow]").hidden = !sd; q("[data-sdlbl]").textContent = discLabel(d.dtype); q("[data-sdval]").textContent = "-" + peso(sd);
    q("[data-feeval]").textContent = feeIn.value === "" ? "—" : peso(+feeIn.value || 0);
    q("[data-totalfor]").textContent = feeIn.value === "" ? "—" : peso(calcTotal(o, +feeIn.value || 0, sd));
  };
  if(feeIn){ feeIn.oninput = updTotal; }
  el.querySelectorAll("[data-dtype]").forEach(b => b.onclick = () => {
    d.dtype = b.dataset.dtype;
    el.querySelectorAll("[data-dtype]").forEach(x => x.classList.toggle("sel", x === b));
    const row = el.querySelector("[data-customrow]"); row.hidden = d.dtype !== "custom";
    if(d.dtype === "custom") row.querySelector("input").focus();
    updTotal();
  });
  { const da = el.querySelector('[data-draft$="|damt"]'); if(da) da.addEventListener("input", () => { d.damt = da.value; updTotal(); }); }
  el.querySelectorAll("[data-fee]").forEach(b => b.onclick = () => { feeIn.value = b.dataset.fee; updTotal(); });
  el.querySelectorAll("[data-eta]").forEach(b => b.onclick = () => { d.eta = +b.dataset.eta; el.querySelectorAll("[data-eta]").forEach(x => x.classList.toggle("sel", x === b)); });
  el.querySelectorAll("[data-draft]").forEach(i => i.addEventListener("input", () => { d[i.dataset.draft.split("|")[1]] = i.value; }));

  const img = el.querySelector("[data-rc]");
  if(img){
    if(!receiptUrls[o.id] && o.receipt_path) api.receiptUrl(o.receipt_path).then(u => { receiptUrls[o.id] = u; img.src = u; }).catch(() => { img.alt = "영수증을 불러오지 못했습니다"; });
    img.onclick = () => openViewer(img.src);
  }

  const xi = el.querySelector("[data-exrc]");
  if(xi){
    if(!receiptUrls["x" + o.id] && o.extra_receipt_path) api.receiptUrl(o.extra_receipt_path).then(u => { receiptUrls["x" + o.id] = u; xi.src = u; }).catch(() => { xi.alt = "영수증을 불러오지 못했습니다"; });
    xi.onclick = () => openViewer(xi.src);
  }
  el.querySelectorAll("[data-chat]").forEach(b => b.onclick = () => openOrderChat(o));
  el.querySelectorAll("[data-delext]").forEach(b => b.onclick = () => deleteExternalOrder(o));
  el.querySelectorAll("[data-staffset]").forEach(b => b.onclick = () => changeOrderStaff(o));
  el.querySelectorAll("[data-svc]").forEach(b => b.onclick = () => svcLine(o, +b.dataset.svc));
  el.querySelectorAll("[data-unsvc]").forEach(b => b.onclick = () => unsvcLine(o, +b.dataset.unsvc));
  el.querySelectorAll("[data-svcadd]").forEach(b => b.onclick = () => addSvcItem(o));
  el.querySelectorAll("[data-lprice]").forEach(b => b.onclick = () => editLinePrice(o, +b.dataset.lprice));
  el.querySelectorAll("[data-adddc]").forEach(b => b.onclick = () => addDcModal(o));
  el.querySelectorAll("[data-itemadd]").forEach(b => b.onclick = () => addItemModal(o, false));
  el.querySelectorAll("[data-rmadm]").forEach(b => b.onclick = async () => {
    const items = JSON.parse(JSON.stringify(o.items || [])), i = +b.dataset.rmadm, l = items[i]; if(!l || !l.byAdmin) return;
    if(!confirm(L(`관리자가 추가한 '${l.name}' ×${l.qty} (${peso(l.unitPrice * l.qty)})를 주문에서 뺄까요?`, `Remove '${l.en || l.name}' ×${l.qty} (${peso(l.unitPrice * l.qty)}) added by admin?`))) return;
    items.splice(i, 1); if(!items.length) return toast(L("메뉴가 하나는 남아 있어야 해요", "At least one item must remain"));
    if(await saveSvcItems(o, items, null)) api.adminBotPost(o.id, `➖ ${l.name} ${l.qty}개를 주문에서 뺐어요.${o.total != null ? ` 최종 금액은 ${peso(o.total)}입니다.` : ""}`, `➖ ${l.en || l.name} ×${l.qty} was removed from your order.${o.total != null ? ` New total: ${peso(o.total)}.` : ""}`).catch(() => {});
  });
  el.querySelectorAll("[data-act]").forEach(b => b.onclick = () => act(o, b.dataset.act, b));
  bindPwd(el, o); bindCancelReq(el);
  { const rs = el.querySelector("[data-rider]"); if(rs) rs.onchange = () => assignRider(o, rs.value, rs); }
  el.querySelectorAll("[data-share]").forEach(b => b.onclick = () => shareTrack(o));
  el.querySelectorAll("[data-pinedit]").forEach(b => b.onclick = () => orderPinModal(o));
  el.querySelectorAll("[data-rdmap]").forEach(b => b.onclick = () => { if(!RIDERS_WIN && openRidersWindow(b.dataset.rdmap)) return; rdFocus = b.dataset.rdmap; showView("riders"); });
  el.querySelectorAll("[data-rdpage]").forEach(b => b.onclick = () => openRiderPage(b.dataset.rdpage));
  el.querySelectorAll("[data-copymap]").forEach(b => b.onclick = async () => { try{ await navigator.clipboard.writeText(b.dataset.copymap); toast("지도 링크를 복사했습니다 — 기사님께 카톡/문자로 보내세요"); }catch(e){ prompt("지도 링크", b.dataset.copymap); } });
}

/* ---------------- 🎁 서비스 (37단계) ----------------
   · 주문한 메뉴를 서비스로: 그 줄(또는 일부 수량)을 ₱0 으로 바꾸고 원래 가격은 origUnit 에 남김

async function setPwd(o, on){

    if(o.store_discount && !isPwd(o) && !pts && !confirm(L(`이미 '${discText(o.store_discount_label)}' ${peso(o.store_discount)} 할인이 있어요. PWD 할인 20%로 바꿀까요?`, `There's already '${discText(o.store_discount_label)}' ${peso(o.store_discount)}. Replace with PWD 20%?`))) return;
    const c = await pwdCalcModal(Math.max(0, base - pts), PT.orderCode(o), pwdCount(o.store_discount_label)); if(!c) return;

async function editTotal(o){

  const v = prompt(L(`${PT.orderCode(o)} 최종 금액 (지금 ${peso(o.total)})\n낮추면 '가격 조정' 할인, 높이면 '가격 조정' 메뉴로 들어가요.${paidNote(o)}`, `${PT.orderCode(o)} final amount (now ${peso(o.total)})\nLower = 'price adjustment' discount, higher = 'price adjustment' line.${paidNote(o)}`), o.total);
  if(v == null) return;
  const X = Math.round(+String(v).replace(/[^\d.]/g, ""));
  if(String(v).trim() === "" || !Number.isFinite(X) || X < 0) return toast(L("숫자로 입력하세요", "Enter a number"));
  if(X === o.total) return;
  const fee = o.delivery_fee || 0;
  // 예전 '가격 조정' 줄은 빼고 다시 계산
  const items = JSON.parse(JSON.stringify(o.items || [])).filter(l => !l.adj), adjGone = items.length !== (o.items || []).length;
  const sub = items.reduce((a, l) => a + l.unitPrice * l.qty, 0), base = Math.max(0, sub - (o.discount || 0));
  if(X < fee) return toast(L(`배달비(${peso(fee)})보다 낮게는 못 해요`, `Can't go below the delivery fee (${peso(fee)})`), 3500);
  const need = base + fee - X;   // 필요한 할인 (음수면 더 받아야 함)
  try{
    if(need >= 0){
      if(adjGone){ if(!items.length) return toast(L("메뉴가 없어요", "No items")); const n = await api.setItems(o.id, items); if(n) Object.assign(o, n); }
      await api.updateOrder(o.id, { store_discount: need, store_discount_label: need ? "가격 조정" : null, total: X });
    } else {
      await api.updateOrder(o.id, { store_discount: 0, store_discount_label: null, total: base + fee });
      items.push({ id: "adj_" + Date.now().toString(36), name: "가격 조정", en: "Price adjustment", qty: 1, unitPrice: -need, opts: [], custom: true, byAdmin: true, adj: true });
      const n = await api.setItems(o.id, items); if(n) Object.assign(o, n);
    }
    toast(L(`${PT.orderCode(o)} 최종 금액 ${peso(X)}`, `${PT.orderCode(o)} total ${peso(X)}`), 3500);
    if(notifyCustomer(o)) api.adminBotPost(o.id, `✏️ 가게에서 최종 금액을 ${peso(X)}로 조정했어요.`, `✏️ The store adjusted your total to ${peso(X)}.`).catch(() => {});
    await loadOrders();
  }catch(e){ toast(L("저장 실패: ", "Save failed: ") + PT.errMsg(e), 5000); }

async function svcLine(o, i){

async function unsvcLine(o, i){

    items.splice(i, 1);

    const back = { ...l, unitPrice: l.origUnit || 0 }; delete back.svc; delete back.origUnit;
    const same = x => !PT.isSvc(x) && x.id === back.id && !!x.added === !!back.added && JSON.stringify(x.opts || []) === JSON.stringify(back.opts || []) && x.unitPrice === back.unitPrice;
    const j = items.findIndex(same);

  await saveSvcItems(o, items, null);

async function act(o, a, btn){
  const d = drafts[o.id] || {};
  // 👤 주문을 처음 받는 순간(수락·조리 시작·결제 확인)에 받은 직원 기록 (45단계)

    btn.disabled = true;
    try{ const n = await api.updateOrder(o.id, patch); Object.assign(o, n || patch); delete drafts[o.id]; toast(msg); await loadOrders(); return true; }
    catch(e){ toast(L("저장 실패: ", "Save failed: ") + (e.message || e), 4000); btn.disabled = false; return false; }

    const sd = storeDisc(o, d);
    await run({ delivery_fee: Math.round(+fee), store_discount: sd, store_discount_label: sd ? discLabel(d.dtype) : null,
      total: calcTotal(o, Math.round(+fee), sd), eta_min: d.eta || null,
      admin_note: (d.note||"").trim() || null, status: "awaiting_payment" }, `#${o.order_no} 결제 안내를 보냈습니다`);
  }
  if(a === "editfee"){
    const v = prompt(L(`#${o.order_no} 배달료 수정 (지금 ₱${o.delivery_fee ?? 0})\n바꾸면 손님 화면과 채팅에 "배달료가 수정되었습니다"가 자동으로 안내됩니다.`, `#${o.order_no} edit delivery fee (now ₱${o.delivery_fee ?? 0})\nThe customer is told "delivery fee updated" automatically.`), o.delivery_fee ?? 0); if(v == null) return;

    catch(e){ toast(L("수정 실패: ", "Update failed: ") + (e.message || e), 4000); }
  }
  if(a === "editdisc"){
    const v = prompt(L(`${PT.orderCode(o)} 매장 할인\n5% / 10% / 금액(숫자) / 0 = 할인 없음`, `${PT.orderCode(o)} store discount\n5% / 10% / amount (number) / 0 = none`), o.store_discount ? (/^매장 할인 \d+%$/.test(o.store_discount_label || "") ? o.store_discount_label.replace("매장 할인 ", "") : String(o.store_discount)) : "0");
    if(v == null) return;

/* 라라무브 오류 → 알기 쉬운 말 */
function llErr(e){
  const m = String(e || "");
  if(/lalamove_no_key/.test(m)) return "라라무브 API 키가 아직 없어요 → ⚙ 설정 → 라라무브 API 키에 Key·Secret을 넣으세요";
  if(/http_response|http_header|extensions\.http|function .*http/i.test(m)) return "Supabase의 http 확장이 꺼져 있어요 → Database → Extensions 에서 'http'를 켜세요";
  if(/401|403|Unauthorized|signature/i.test(m)) return "라라무브 키가 맞지 않아요 (Key·Secret, 운영/테스트 환경 확인)";
  if(/404/.test(m)) return "링크의 라라무브 주문을 API로 찾을 수 없어요 (앱으로 부른 주문은 조회가 안 될 수 있음)";
  if(/핀 위치가 없어/.test(m)) return "손님 주소에 지도 핀이 없어 요금을 조회할 수 없어요";
  return m || "알 수 없는 오류";
}
/* 라라무브 링크(또는 손님 위치) → 실제 배달비로 조정 + 손님 채팅에 자동 안내 */
async function lalamoveAdjust(o, url){
  toast("라라무브 요금 조회 중…", 2500);
  let r; try{ r = await api.lalamoveFee(o.id, url || ""); }catch(e){ r = { error: e.message || String(e) }; }
  let v;
  if(r && r.fee != null){
    v = prompt(`라라무브 요금 ₱${r.raw} → 배달비 ₱${r.fee} (${r.source === "order" ? "링크의 라라무브 주문" : "손님 위치로 조회"})\n지금 배달비 ₱${o.delivery_fee ?? 0}\n\n이 금액으로 바꾸고 손님 채팅에 "배달비가 조정되었습니다"를 자동으로 보낼까요? (금액 수정 가능)`, r.fee);
  } else {
    v = prompt(`라라무브 요금을 자동으로 가져오지 못했어요.\n이유: ${llErr(r && r.error)}\n\n라라무브 앱에 표시된 배달비를 입력하면 배달비가 바뀌고 손님에게 자동 안내됩니다. (취소 = 그대로 둠)`, "");
  }
  if(v === null || String(v).trim() === "") return;
  const fee = Math.round(+v);
  if(isNaN(fee) || fee < 0) return toast("숫자를 입력하세요");
  try{ const res = await api.applyFee(o.id, fee, url || ""); toast(`#${o.order_no} 배달비 ${peso(fee)} 적용 → 최종 ${peso(res.total)} · 손님 채팅에 자동 안내`, 4500); await loadOrders(); loadThreads(); }
  catch(e){ toast("적용 실패: " + (e.message || e), 5000); }
}

/* 주방·홀 영수증은 영어만 → 인쇄 전에 한글 요청사항·직접 입력 메뉴·메모를 영어로 (최대 4초, 실패하면 원문) */
async function printEnglish(o){
  const c = JSON.parse(JSON.stringify(o)); if(o._cashGot != null) c._cashGot = o._cashGot;
  const tr = async t => { try{ return await Promise.race([trText(t), new Promise(r => setTimeout(() => r(null), 4000))]) || t; }catch(e){ return t; } };
  const jobs = [];
  if(c.memo && !c.memo_en && PT.hasHangul(c.memo)) jobs.push(tr(c.memo).then(v => { c.memo_en = v; if(v !== c.memo) api.updateOrder(o.id, { memo_en: v }).catch(() => {}); }));
  (c.items || []).forEach(l => {
    const it = ITEM_BY_ID[l.id] || {};
    if(PT.hasHangul(l.en || it.en || l.name || "")) jobs.push(tr(l.en || l.name).then(v => { l.en = v; }));
    (l.opts || []).forEach(x => { if(PT.hasHangul(x.en || x.ko || "")) jobs.push(tr(x.en || x.ko).then(v => { x.en = v; })); });
  });
  await Promise.all(jobs);
  return c;
}
async function doPrint(o){
  let fresh = orders.find(x => x.id === o.id) || o;
  if(o._cashGot != null) fresh._cashGot = o._cashGot;
  fresh = await printEnglish(fresh);
  try{ await PTPrinter.print(fresh); if(!["browser", "share"].includes(PTPrinter.getMode())) toast(L(`#${fresh.order_no} 영수증 전송 완료`, `#${fresh.order_no} sent to printer`)); }
  catch(e){ toast(L("인쇄 실패: ", "Print failed: ") + (e.message || e) + L(" — 🖨 프린터 버튼에서 다시 연결하세요", " — reconnect from the 🖨 Printer button"), 5000); paintPrinterBtn(false); return; }
  printed[o.id] = Date.now(); ls.set("paltong_printed", printed);
  setTimeout(renderOrders, 500);
}

function openViewer(src){
  if(!src) return;
  const v = document.createElement("div"); v.className = "viewer"; v.innerHTML = `<img src="${esc(src)}" alt="receipt">`;
  v.onclick = () => v.remove(); document.body.appendChild(v);
}

  document.body.appendChild(ov);

    share: `<b>아이패드·아이폰용</b> — 영수증을 그림으로 만들어 <b>공유 창</b>으로 프린터 제조사 앱에 보내 인쇄해요. (와이파이·블루투스 프린터 모두)<br>
          ① App Store에서 <b>프린터 설명서·상자에 적힌 앱</b>을 설치하고, 그 앱에서 프린터를 연결해 테스트 인쇄가 되는지 확인<br>
          ② 여기서 '테스트 인쇄' → 공유 창에서 그 앱 선택 → 앱에서 인쇄<br>
          ③ 처음 한 번: 공유 창 앱 목록 맨 끝 <b>'더 보기' → 편집</b>에서 그 앱을 <b>즐겨찾기</b>로 앞에 두면 다음부터 한 번에 눌러요<br>
          • 주방용 + 손님용은 한 장으로 이어서 나오고 사이에 ✂ 선이 있어요 (손으로 뜯기)<br>
          • 공유 창 목록에 프린터 앱이 없으면, 그 앱이 사진 받기를 지원하지 않는 거예요 → 앱 안의 '사진/이미지 인쇄'에서 저장한 영수증을 고르세요`,
    station: `<b>와이파이 프린터용</b> — 이 기기(아이패드 등)에서 🖨 인쇄를 누르면, 가게에 켜둔 <b>안드로이드폰(인쇄 스테이션)</b>이 받아서 와이파이 프린터로 바로 출력해요. 공유 창 없이 한 번에 나와요.<br>
          ① 안 쓰는 안드로이드폰을 가게 와이파이에 연결<br>
          ② 그 폰 Chrome에서 <b>${location.origin}/print-station</b> 을 열고 관리자 로그인 → 화면 안내대로 RawBT 설정<br>
          ③ 여기서 '테스트 인쇄' → 스테이션 폰을 거쳐 영수증이 나오면 끝<br>
          • 스테이션 폰은 <b>충전기에 꽂아두고 그 화면을 켜둔 채</b> 두세요 (꺼지면 인쇄가 쌓였다가 다시 켜질 때 나와요)`,
    browser: `PC에 프린터 드라이버를 설치한 경우(USB/블루투스 COM 포트) 브라우저 인쇄창으로 출력합니다. 설치가이드 5단계 참고.`,
  };
  function paint(){
    const m = PTPrinter.getMode();
    ov.querySelectorAll("[data-m]").forEach(b => b.classList.toggle("sel", b.dataset.m === m));
    q("#pdesc").innerHTML = DESC[m];
    q("#pconnect").hidden = m !== "ble";
    if(m === "station"){ q("#pstat").textContent = "스테이션 확인 중…"; stationStatusText().then(t => { if(PTPrinter.getMode() === "station") q("#pstat").textContent = t; }); return; }
    if(m === "ble" && !PTPrinter.bleSupported()) q("#pstat").textContent = /iPhone|iPad|iPod|Macintosh.*Mobile/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)
      ? "⚠ 아이폰 Safari·Chrome은 블루투스 연결이 안 돼요 → App Store 'Bluefy – Web BLE Browser' 앱에서 이 페이지를 열어주세요."
      : "⚠ 이 브라우저는 블루투스 직접 연결을 지원하지 않습니다. 안드로이드는 Chrome을 쓰거나 RawBT 방식을 쓰세요.";
    else q("#pstat").textContent = m === "ble" && PTPrinter.bleName ? "마지막 연결: " + PTPrinter.bleName : "";
  }
  ov.querySelectorAll("[data-m]").forEach(b => b.onclick = () => { PTPrinter.setMode(b.dataset.m); paint(); paintPrinterBtn(); });
  const paintSets = () => { const cur = PT.ls.get("paltong_print_set", "kc"); ov.querySelectorAll("[data-ps]").forEach(b => b.classList.toggle("sel", b.dataset.ps === cur)); };
  ov.querySelectorAll("[data-ps]").forEach(b => b.onclick = () => { PT.ls.set("paltong_print_set", b.dataset.ps); paintSets(); toast("인쇄 설정: " + PT.PRINT_SETS[b.dataset.ps]); });
  paintSets();
  q("#pconnect").onclick = async () => {
    q("#pstat").textContent = "프린터 찾는 중…";
    try{ const n = await PTPrinter.bleConnect(true); q("#pstat").textContent = "✔ 연결됨: " + n; paintPrinterBtn(true); }
    catch(e){ q("#pstat").textContent = "연결 실패: " + (e.message || e); paintPrinterBtn(false); }
  };
  q("#pnote").onclick = () => { close(); PTPrinter.openNoteEditor({ en: EN(),
    loadOrders: day => day === today() ? Promise.resolve(orders.filter(o => PT.orderDay(o) === day)) : api.listOrdersByDay(day),
    onPrint: (note, copies) => PTPrinter.print([{ _note: note }], copies) }); };
  q("#ptest").onclick = async () => {
    q("#pstat").textContent = "인쇄 데이터 보내는 중…";
    try{ await PTPrinter.print(SAMPLE); q("#pstat").textContent = PTPrinter.getMode() === "station" ? "✔ 인쇄 스테이션으로 보냈어요. 몇 초 안에 영수증이 나오는지 확인하세요." : "✔ 전송했습니다. 영수증이 나왔는지 확인하세요."; if(PTPrinter.getMode()==="ble") paintPrinterBtn(true); }
    catch(e){ q("#pstat").textContent = "인쇄 실패: " + (e.message || e); }
  };
  paint();
};

/* ---------------- 품절 관리 ---------------- */
async function loadSoldOut(){ try{ soldOut = await api.getMenuStatus({ includeHidden: true }); }catch(e){} renderSoldOut(); }
/* ---- 메뉴판 고치기: 지금 메뉴판을 복사 → 고침 → 저장 (가격이 바뀌면 가격 비밀번호) ---- */
const menuFind = (cfg, id) => { for(const c of cfg){ const i = c.items.findIndex(x => x.id === id); if(i >= 0) return { cat: c, i, it: c.items[i] }; } return null; };
async function editMenu(mut, okMsg, pinWhat){
  // 처음 저장이면 지금 메뉴판을 그대로 먼저 옮겨두기 (가격 변경은 그 다음 저장에서 비밀번호 확인)
  if(!PT.menuCfgActive){ try{ await api.saveMenu(PT.exportMenu(), null); await loadSoldOut(); }catch(e){ toast(PT.errMsg(e), 5000); return false; } }
  const cfg = PT.exportMenu();
  if(mut(cfg) === false) return false;
  const save = pin => api.saveMenu(cfg, pin);
  try{ await save(null); }
  catch(e){
    if(!/price_pin_required/.test(String(e.message || e))){ toast(PT.errMsg(e), 5000); return false; }
    for(;;){   // 비밀번호가 틀리면 다시 물어봄 (닫으면 취소)
      const pin = await askPricePin(pinWhat || okMsg); if(pin == null) return false;
      try{ await save(pin); break; }
      catch(e2){ toast(PT.errMsg(e2), 4000); if(!/price_pin_wrong/.test(String(e2.message || e2))) return false; }
    }
  }
  await loadSoldOut(); if(okMsg) toast("✅ " + okMsg, 3000); return true;
}
function renderSoldOut(){
  const catOpts = cur => PT.CATS.map(c => `<option value="${esc(c.cat)}" ${c.cat === cur ? "selected" : ""}>${esc(c.cat)} · ${esc(c.catEn)}</option>`).join("");
  const allIt = MENU.flatMap(c => c.items), nNew = allIt.filter(x => x.isNew), nHot = allIt.filter(x => x.isHot);
  $("soGrid").innerHTML = `<div class="calc-box" style="grid-column:1/-1">
      <div class="btn-row" style="margin:0 0 8px;flex-wrap:wrap">
        <button class="primary-btn sm" id="mmNew">➕ ${L("새 메뉴 추가", "Add item")}</button>
        <button class="ghost-btn sm" id="mmCats">📂 ${L("카테고리 관리", "Categories")}</button>
        <button class="ghost-btn sm" id="mmBulk" style="border-color:var(--red);color:var(--red-deep);font-weight:800">🏷 ${L("일괄 할인", "Bulk sale")}</button>
        <button class="ghost-btn sm" id="pinChange">🔒 ${L("가격 비밀번호 변경", "Change price password")}</button>
      </div>
      <b>🆕 ${L("신메뉴", "NEW")} ${nNew.length}</b> <span class="hint" data-raw>${esc(nNew.map(x => x.name).join(", ") || "-")}</span><br>
      <b>🔥 ${L("인기메뉴", "BEST")} ${nHot.length}</b> <span class="hint" data-raw>${esc(nHot.map(x => x.name).join(", ") || "-")}</span><br>
      <span class="hint">${L("✏️ 수정을 누르면 이름·가격·옵션 등 메뉴의 모든 것을 바꿀 수 있어요. 가격·할인가·옵션 추가금을 바꾸거나 메뉴를 추가·삭제할 때만 가격 비밀번호를 물어봅니다.", "Tap ✏️ Edit to change anything about an item. The price password is only needed for prices, option add-on prices, and adding/deleting items.")}</span></div>` +
    MENU.map(cat => `<h3 style="grid-column:1/-1;margin-top:10px" data-raw>${esc(cat.cat)} <span class="en">${esc(cat.catEn)}</span> <span class="hint">${cat.items.length}</span></h3>` +
    (cat.items.length ? "" : `<p class="hint" style="grid-column:1/-1;margin:0">${L("메뉴 없음 — 손님 화면에서 숨겨집니다", "No items — hidden from customers")}</p>`) +
    cat.items.map((it, idx) => `<div class="so-item ${soldOut[it.id] || it.hidden ? "out" : ""}" style="flex-direction:column;align-items:stretch">
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start">
        <span>${it.hidden ? `<span class="status-pill" style="background:#888">🙈 ${L("숨김", "Hidden")}</span> ` : ""}<span data-raw><b>${esc(it.name)}</b> <span class="en">${esc(it.en)}</span></span><br>
          <span class="hint">${it.onSale ? `<s>${peso(it.listPrice)}</s> → <b style="color:var(--red-deep)">${peso(it.price)}</b> 🏷 <span style="font-size:11px">${it.saleDine ? L("· 🍽 다이닝도 할인", "· 🍽 dining too") : L("· 🍽 다이닝 정가", "· 🍽 dining full price")}</span>` : peso(it.price)}${(it.options || []).length ? ` · ${L("옵션", "options")} ${it.options.length}` : ""}</span></span>
        <span style="display:flex;flex-direction:column;gap:4px;align-items:flex-end">
          <button class="so-toggle ${soldOut[it.id] ? "out" : ""}" data-so="${it.id}">${soldOut[it.id] ? "품절됨 → 판매 재개" : "품절 처리"}</button>
          <span style="display:flex;gap:4px"><button class="chip" data-mup="${it.id}" ${idx === 0 ? "disabled" : ""} title="up">▲</button><button class="chip" data-mdown="${it.id}" ${idx === cat.items.length - 1 ? "disabled" : ""} title="down">▼</button>

      <div class="mm-ctl">
        <label class="hint">${L("카테고리", "Category")}</label><select data-mcat="${it.id}">${catOpts(it.cat)}</select>
        <button class="chip ${it.isNew ? "sel" : ""}" data-mflag="isNew" data-mid="${it.id}">🆕 ${L("신메뉴", "NEW")} ${it.isNew ? "ON" : "OFF"}</button>
        <button class="chip ${it.isHot ? "sel" : ""}" data-mflag="isHot" data-mid="${it.id}">🔥 ${L("인기", "BEST")} ${it.isHot ? "ON" : "OFF"}</button>
      </div>
      <div class="mm-ctl">
        <label class="hint">${L("정가 ₱", "Price ₱")}</label><input type="number" min="1" inputmode="numeric" data-mbase="${it.id}" value="${it.listPrice}">
        <label class="hint">${L("할인가 ₱", "Sale ₱")}</label><input type="number" min="0" inputmode="numeric" data-msale="${it.id}" value="${it.onSale ? it.price : ""}" placeholder="${L("없음", "none")}">
        <button class="chip" data-msave="${it.id}">🔒 ${L("가격 저장", "Save price")}</button>
        <label class="chip ${it.saleDine ? "sel" : ""}" style="cursor:pointer" title="${L("체크하면 다이닝(T) 주문에도 할인가, 안 하면 다이닝은 정가", "Checked = dine-in (T) also gets the sale price")}"><input type="checkbox" data-mdine="${it.id}" ${it.saleDine ? "checked" : ""} style="margin-right:4px">🍽 ${L("다이닝 포함", "Incl. dining")}</label>
      </div></div>`).join("")).join("");
  const G = $("soGrid");
  G.querySelectorAll("[data-so]").forEach(b => b.onclick = async () => {
    const id = b.dataset.so, v = !soldOut[id]; b.disabled = true;
    try{ await api.setSoldOut(id, v); if(v) soldOut[id] = true; else delete soldOut[id]; toast(v ? "품절 처리했습니다" : "판매 재개했습니다"); }
    catch(e){ toast(L("저장 실패: ", "Save failed: ") + (e.message||e)); }
    renderSoldOut();
  });
  G.querySelectorAll("[data-mflag]").forEach(b => b.onclick = () => { const it = ITEM_BY_ID[b.dataset.mid], k = b.dataset.mflag, v = !it[k]; b.disabled = true;
    editMenu(cfg => { const f = menuFind(cfg, it.id); if(v) f.it[k] = true; else delete f.it[k]; }, `${k === "isNew" ? "🆕" : "🔥"} ${it.name} ${v ? L("표시", "on") : L("해제", "off")}`); });
  G.querySelectorAll("[data-mcat]").forEach(sel => sel.onchange = () => { const it = ITEM_BY_ID[sel.dataset.mcat];
    editMenu(cfg => { const f = menuFind(cfg, it.id), to = cfg.find(c => c.cat === sel.value); f.cat.items.splice(f.i, 1); to.items.push(f.it); }, L(`${it.name} → ${sel.value} 로 옮겼습니다`, `${it.en} moved to ${sel.value}`)); });
  const move = (id, d) => editMenu(cfg => { const f = menuFind(cfg, id), j = f.i + d; if(j < 0 || j >= f.cat.items.length) return false; [f.cat.items[f.i], f.cat.items[j]] = [f.cat.items[j], f.cat.items[f.i]]; }, "");
  G.querySelectorAll("[data-mup]").forEach(b => b.onclick = () => move(b.dataset.mup, -1));
  G.querySelectorAll("[data-mdown]").forEach(b => b.onclick = () => move(b.dataset.mdown, 1));
  G.querySelectorAll("[data-medit]").forEach(b => b.onclick = () => openItemEditor(b.dataset.medit));
  G.querySelectorAll("[data-msave]").forEach(b => b.onclick = () => {
    const it = ITEM_BY_ID[b.dataset.msave];
    const bv = G.querySelector(`[data-mbase="${it.id}"]`).value.trim(), sv = G.querySelector(`[data-msale="${it.id}"]`).value.trim();
    const base = Math.round(+bv), sale = sv === "" ? 0 : Math.round(+sv);
    if(!(base > 0) || isNaN(sale) || sale < 0) return toast(L("숫자로 입력하세요", "Enter numbers"));
    if(sale && sale >= base) return toast(L(`할인가는 정가 ${peso(base)}보다 낮아야 해요 (비우면 할인 없음)`, `Sale price must be below ${peso(base)} (empty = no sale)`), 4000);
    if(base === it.listPrice && sale === (it.onSale ? it.price : 0)) return toast(L("바뀐 가격이 없어요", "Nothing changed"));
    const was = it.onSale ? it.price : 0;
    const desc = `${it.name} — ${L("정가", "price")} ${base !== it.listPrice ? `${peso(it.listPrice)} → ` : ""}${peso(base)}` +
      (sale !== was ? ` · ${L("할인가", "sale")} ${was ? peso(was) : L("없음", "none")} → ${sale ? peso(sale) : L("없음", "none")}` : sale ? ` · ${L("할인가", "sale")} ${peso(sale)}` : "");
    editMenu(cfg => { const f = menuFind(cfg, it.id); f.it.price = base; if(sale) f.it.sale = sale; else delete f.it.sale; }, desc, desc);
  });
  G.querySelectorAll("[data-mdine]").forEach(c => c.onchange = () => { const it = ITEM_BY_ID[c.dataset.mdine], v = c.checked; c.disabled = true;
    editMenu(cfg => { const f = menuFind(cfg, it.id); if(v) f.it.saleDine = true; else delete f.it.saleDine; },
      v ? L(`🍽 ${it.name} 할인가를 다이닝에도 적용`, `🍽 ${it.en || it.name}: sale applies to dining`) : L(`🍽 ${it.name} 다이닝은 정가`, `🍽 ${it.en || it.name}: dining at full price`)); });
