<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#d33d2a">
<title>기사 상세 · 빨통</title>
<link rel="icon" type="image/png" href="rider-icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="style.css">
<style>
  body{max-width:1180px;}
  .topbar{top:0;}
  .top-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
  .sm-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 11px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;text-decoration:none;}
  .chip{border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:8px;padding:6px 9px;font-size:12px;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap;}
  .chip.sel{background:var(--ink);color:var(--bg);border-color:var(--ink);}
  .chip.red{background:var(--red);border-color:var(--red);color:#fff;}
  .chip.green{background:var(--green);border-color:var(--green);color:#fff;}
  .chip.blue{background:#2a6fd3;border-color:#2a6fd3;color:#fff;}
  .chip:disabled{opacity:.5;cursor:default;}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 0;}
  .wrap{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:14px;padding:14px 0 70px;align-items:start;}
  @media (max-width:900px){ .wrap{grid-template-columns:minmax(0,1fr);} }
  .map-col{position:sticky;top:72px;}
  @media (max-width:900px){ .map-col{position:static;} }
  #map{height:min(70vh,660px);border-radius:16px;border:1px solid var(--line);background:var(--surface-2);z-index:1;}
  @media (max-width:900px){ #map{height:46vh;} }
  .box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;}
  .box h2{display:flex;align-items:center;gap:8px;margin:0 0 10px;font:400 19px 'Black Han Sans','Noto Sans KR',sans-serif;}
  .box h2 .n{font:800 12px 'Noto Sans KR',sans-serif;background:var(--red);color:#fff;border-radius:999px;padding:2px 8px;}
  .box h2 .grow{flex:1;}
  .who{display:flex;align-items:center;gap:12px;}
  .who .dot{width:14px;height:14px;border-radius:50%;background:#b8a898;flex-shrink:0;}
  .who .dot.on{background:var(--green);box-shadow:0 0 0 5px rgba(47,143,78,.18);}
  .who .dot.stale{background:var(--mustard);box-shadow:0 0 0 5px rgba(229,167,49,.2);}
  .who b{font-size:22px;line-height:1.1;display:block;}
  .who .meta{font-size:12.5px;color:var(--muted);margin-top:3px;}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;}
  .stat{background:var(--surface-2);border-radius:12px;padding:9px 10px;text-align:center;}
  .stat b{display:block;font-size:19px;font-weight:800;}
  .stat span{font-size:11.5px;color:var(--muted);}
  .daybar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .daybar input[type=date]{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 10px;border-radius:999px;font:inherit;font-size:13px;font-weight:700;}
  .er{border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-top:8px;background:var(--surface);}
  .er.going{border:2px solid #2a6fd3;}
  .er.assigned{border:2px solid var(--mustard);}
  .er.sel{box-shadow:0 0 0 4px rgba(211,61,42,.25);}
  .er.closed{background:var(--surface-2);}
  .er-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .er-top .no{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;border-radius:50%;background:#e07b1a;color:#fff;font-size:12px;font-weight:800;}
  .er-top b{font-size:15.5px;}
  .er-top .t{margin-left:auto;font-size:12px;color:var(--muted);}
  .pill{display:inline-block;color:#fff;border-radius:999px;padding:3px 9px;font-size:11.5px;font-weight:800;}
  .er p{margin:5px 0 0;font-size:13px;line-height:1.5;}
  .er .money{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;font-size:12.5px;font-weight:700;}
  .er .money span{background:var(--surface-2);border-radius:8px;padding:3px 8px;}
  .er.closed .money span{background:var(--surface);}
  .er .note{color:var(--red-deep);font-weight:700;}
  .ord{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 0;border-top:1px solid var(--line);font-size:13px;}
  .ord:first-of-type{border-top:0;}
  .ord .no{font:400 20px/1 'Black Han Sans',sans-serif;color:var(--red);}
  .ord .t{margin-left:auto;font-size:12px;color:var(--muted);}
  .ord .addr{flex-basis:100%;color:var(--ink-soft);font-size:12.5px;}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:16px 0;}
  .notice{background:#fff1c9;color:#6b4e00;border:1px solid #f0d27a;border-radius:12px;padding:12px 14px;font-size:13.5px;margin-top:14px;line-height:1.55;}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .notice{background:#3a2f12;color:#f3d98a;border-color:#6b5520;} }
  .rd-pin{display:flex;align-items:center;justify-content:center;border-radius:50%;border:3px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.35);font-size:16px;line-height:1;width:38px;height:38px;background:var(--red);color:#fff;font-weight:800;}
  .rd-pin.home{background:#2a6fd3;width:32px;height:32px;font-size:11px;}
  .rd-pin.store{background:#fff;width:32px;height:32px;font-size:16px;}
  .rd-pin.errand{background:#e07b1a;width:32px;height:32px;font-size:12px;}
  .rd-pin.errand.sel{background:var(--red);width:38px;height:38px;}
  .rd-pin.dot{width:16px;height:16px;border-width:2px;background:var(--green);}
  .rd-rider{position:relative;width:52px;height:57px;}
  .rd-rider img{position:relative;z-index:1;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35));}
  .rd-rider::before{content:"";position:absolute;left:50%;bottom:-2px;width:36px;height:11px;margin-left:-18px;border-radius:50%;background:rgba(211,61,42,.35);}
  .rd-rider.stale img{filter:grayscale(1) opacity(.65) drop-shadow(0 2px 3px rgba(0,0,0,.35));}
  #pickMap{height:220px;border-radius:12px;border:1px solid var(--line);margin-top:6px;z-index:1;}
  .viewer{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:300;display:flex;align-items:center;justify-content:center;cursor:zoom-out;}
  .viewer img{max-width:96vw;max-height:96vh;}
  .trail-note{font-size:12px;color:var(--muted);margin:8px 2px 0;}
  .quick{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 12px;}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><h1 id="hName">🛵 기사 상세</h1><p id="hSub">빨통 관리자 · Rider</p></div>
  <div class="top-actions">
    <a class="sm-btn" href="/admin" id="backBtn">← 관리자</a>
    <button class="sm-btn" id="langBtn" data-raw>🌐 English</button>
  </div>
</div>

<div id="gate" hidden></div>

<div id="appView" hidden>
  <div class="wrap">
    <div class="map-col">
      <div id="map"></div>
      <div class="chips" id="mapChips"></div>
      <p class="trail-note" id="mapNote"></p>
    </div>
    <div>
      <div class="box" id="whoBox"></div>
      <div class="box">
        <div class="daybar" id="dayBar"></div>
        <div class="stats" id="stats"></div>
      </div>
      <div class="box" id="errBox"></div>
      <div class="box" id="ordBox"></div>
    </div>
  </div>
</div>

const ageText = s => s == null ? L("위치 없음", "no location") : s < 60 ? L(`${s}초 전`, `${s}s ago`) : s < 3600 ? L(`${Math.floor(s/60)}분 전`, `${Math.floor(s/60)} min ago`) : s < 86400 ? L(`${Math.floor(s/3600)}시간 전`, `${Math.floor(s/3600)} h ago`) : L(`${Math.floor(s/86400)}일 전`, `${Math.floor(s/86400)} d ago`);
const durText = (a, b) => { if(!a) return ""; const m = Math.max(0, Math.round(((b ? new Date(b) : new Date()) - new Date(a)) / 60000));
  return m < 60 ? L(`${m}분`, `${m} min`) : L(`${Math.floor(m/60)}시간 ${m%60}분`, `${Math.floor(m/60)} h ${m%60} min`); };
const tm = d => d ? new Date(d).toLocaleTimeString(PTI18N.lang === "en" ? "en-US" : "ko-KR", { hour:"numeric", minute:"2-digit" }) : "";
const won = n => n == null || n === "" ? "—" : peso(n);
const telOf = p => String(p || "").replace(/[^\d+]/g, "");
const sum = (a, f) => a.reduce((s, x) => s + (+f(x) || 0), 0);
function addDays(d, n){ const t = new Date(d + "T12:00:00Z"); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); }
function debounce(f, ms){ let h; return () => { clearTimeout(h); h = setTimeout(f, ms); }; }

function paintLang(){ $("langBtn").textContent = PTI18N.lang === "en" ? "🌐 한국어" : "🌐 English"; $("backBtn").textContent = L("← 관리자", "← Admin"); }
$("langBtn").onclick = () => PTI18N.toggle();

function gate(html){ $("gate").hidden = false; $("appView").hidden = true; $("gate").innerHTML = `<div class="notice">${html}</div>`; }
async function boot(){
  PTI18N.start(); paintLang();
  if(PT.DEMO) return gate(L("데모 모드에서는 기사 화면을 쓸 수 없어요. config.js 에 Supabase 정보를 넣어주세요.", "Rider pages need a real Supabase connection (config.js)."));
  if(!RID) return gate(L("기사가 지정되지 않았어요. 관리자 화면 🛵 기사에서 기사를 눌러 열어주세요.", "No rider selected. Open this from Admin → 🛵 Riders."));
  if(!(await api.hasSession().catch(() => false))) return gate(L(`관리자 로그인이 필요해요. <a href="/admin">관리자 화면</a>에서 로그인한 뒤 이 창을 새로고침하세요.`, `Please sign in on the <a href="/admin">admin page</a> first, then reload this tab.`));
  $("gate").hidden = true; $("appView").hidden = false;
  api.getSettings().then(st => { gGeoKey = (st && st.google_maps_key) || null; }).catch(() => {});   // 설정의 Google 지도 키 (주소 찾기 정확도↑)
  await load();
  initMap();
  try{ api.onRiderDetailChange(RID, debounce(load, 500)); }catch(e){}
  setInterval(load, 20000);
  setInterval(() => { if(D){ renderWho(); renderErrands(); } }, 10000);   // '몇 분 전' 갱신
  document.addEventListener("visibilitychange", () => { if(!document.hidden) load(); });
}

async function load(){
  if(loading) return; loading = true;
  try{
    D = await api.riderDetail(RID, day);
    if(!today) today = D.day;
    if(!day) day = D.day;
    if(selErrand && !(D.errands || []).some(e => e.id === selErrand)) { selErrand = null; trail = []; }
    if(selErrand){ const e = D.errands.find(x => x.id === selErrand); if(e && e.status === "going") trail = await api.errandTrail(selErrand).catch(() => trail); }
    renderAll();
  }catch(e){
    if(!D) gate(esc(PT.errMsg(e)) + "<br>" + L("관리자 계정으로 로그인했는지, sql/38-rider-errands.sql 을 실행했는지 확인하세요.", "Check that you're signed in as admin and ran sql/38-rider-errands.sql."));
    else console.warn(e);
  }
  loading = false;
}

  const r = D.rider;

  $("hSub").textContent = L("기사 상세 · 심부름", "Rider detail · Errands");

/* ---------------- 🧾 심부름 ---------------- */
function errandNo(e){ const open = (D.errands || []).filter(x => ["assigned","going"].includes(x.status)); const i = open.findIndex(x => x.id === e.id); return i >= 0 ? i + 1 : null; }
function errandHTML(e){
  const s = ES[e.status] || [e.status, e.status, "#888"], closed = ["done","cancelled"].includes(e.status), n = errandNo(e);
  let when;
  if(e.status === "assigned") when = L(`맡긴 지 ${durText(e.created_at)}`, `assigned ${durText(e.created_at)} ago`);
  else if(e.status === "going") when = L(`${tm(e.started_at)} 출발 · ${durText(e.started_at)} 째`, `left ${tm(e.started_at)} · ${durText(e.started_at)}`);
  else if(e.status === "done") when = `${e.started_at ? tm(e.started_at) + " → " : ""}${tm(e.done_at)}${e.started_at ? ` (${durText(e.started_at, e.done_at)})` : ""}`;
  else when = tm(e.done_at || e.updated_at);
  const change = e.cash_given != null && e.spent != null ? e.cash_given - e.spent : null;
  const money = (e.cash_given != null || e.spent != null) ? `<div class="money">
      <span>💵 ${L("준 돈", "Given")} ${won(e.cash_given)}</span>
      ${e.status === "done" || e.spent != null ? `<span>🧾 ${L("쓴 돈", "Spent")} ${won(e.spent)}</span>` : ""}
      ${change != null ? `<span style="color:${change < 0 ? "var(--red-deep)" : "var(--green)"}">↩ ${L("거스름", "Change")} ${peso(change)}</span>` : ""}</div>` : "";
  const btns = [];
  if(e.lat != null || selErrand === e.id || e.started_at) btns.push(`<button class="chip ${selErrand === e.id ? "sel" : ""}" data-route="${e.id}">🗺 ${selErrand === e.id ? L("경로 끄기", "Hide route") : L("지도·경로", "Map · route")}</button>`);
  if(e.status !== "cancelled") btns.push(`<button class="chip" data-share="${e.id}">🔗 ${L("공유", "Share")}</button>`);
  if(e.photo_path) btns.push(`<button class="chip" data-photo="${e.id}">📷 ${L("사진", "Photo")}</button>`);
  if(!closed){
    btns.push(`<button class="chip" data-edit="${e.id}">✏️ ${L("수정", "Edit")}</button>`);
    if(e.status === "assigned") btns.push(`<button class="chip blue" data-go="${e.id}">▶ ${L("출발 처리", "Mark started")}</button>`);
    btns.push(`<button class="chip green" data-done="${e.id}">✅ ${L("완료 처리", "Mark done")}</button>`);
    btns.push(`<button class="chip" data-cancel="${e.id}">✕ ${L("취소", "Cancel")}</button>`);
  } else {
    btns.push(`<button class="chip" data-edit="${e.id}">✏️ ${L("금액 수정", "Edit amounts")}</button>`);
    btns.push(`<button class="chip" data-reopen="${e.id}">↺ ${L("되돌리기", "Reopen")}</button>`);
    btns.push(`<button class="chip" data-del="${e.id}">🗑</button>`);
  }
  return `<div class="er ${e.status} ${closed ? "closed" : ""} ${selErrand === e.id ? "sel" : ""}">
    <div class="er-top">${n ? `<span class="no">${n}</span>` : ""}<b data-raw>${esc(e.title)}</b><span class="pill" style="background:${s[2]}">${L(s[0], s[1])}</span><span class="t">${when}</span></div>
    ${e.place ? `<p>📍 <span data-raw>${esc(e.place)}</span>${e.lat != null ? "" : ` <span class="hint">(${L("지도 핀 없음", "no pin")})</span>`}</p>` : e.lat != null ? `<p>📍 ${L("지도 핀", "Map pin")}</p>` : ""}
    ${e.memo ? `<p>📝 <span data-raw>${esc(e.memo)}</span></p>` : ""}
    ${e.contact_phone ? `<p>👤 ${L("받는 분", "Contact")} <a href="tel:${esc(telOf(e.contact_phone))}" data-raw>${esc(e.contact_phone)}</a></p>` : ""}
    ${money}
    ${e.rider_note ? `<p class="note">🛵 <span data-raw>${esc(e.rider_note)}</span></p>` : ""}
    <div class="chips">${btns.join("")}</div></div>`;
}
function renderErrands(){

  $("errBox").innerHTML = `<h2>🧾 ${L("심부름", "Errands")} ${open.length ? `<span class="n">${open.length}</span>` : ""}<span class="grow"></span>

    ${open.length ? open.map(errandHTML).join("") : `<div class="empty">${L("진행 중인 심부름이 없어요. ➕ 심부름 맡기기를 누르면 기사 앱에 바로 떠요.", "No open errands. Tap ➕ New errand — it pops up in the rider app.")}</div>`}
    ${closed.length ? `<p class="hint" style="margin:14px 2px 0;font-weight:700">${day === today ? L("오늘 끝난 심부름", "Finished today") : L(`${day} 끝난 심부름`, `Finished on ${day}`)} · ${closed.length}</p>${closed.map(errandHTML).join("")}` : ""}`;

  $("errBox").querySelectorAll("[data-reopen]").forEach(b => b.onclick = () => { const e = find(b.dataset.reopen);
    if(confirm(L("이 심부름을 다시 진행 중으로 돌릴까요?", "Reopen this errand?"))) act(() => api.errandStatus(e.id, e.started_at ? "going" : "assigned")); });
  $("errBox").querySelectorAll("[data-del]").forEach(b => b.onclick = () => { if(confirm(L("이 심부름 기록을 완전히 지울까요? (경로·금액 기록도 사라져요)", "Delete this errand record permanently?"))) act(() => api.deleteErrand(b.dataset.del), L("지웠어요", "Deleted")); });
  $("errBox").querySelectorAll("[data-route]").forEach(b => b.onclick = async () => {
    const id = b.dataset.route;
    if(selErrand === id){ selErrand = null; trail = []; fitted = false; renderErrands(); drawMap(); return; }
    selErrand = id; trail = await api.errandTrail(id).catch(() => []); fitted = false; renderErrands(); drawMap();
    if(innerWidth <= 900) $("map").scrollIntoView({ behavior:"smooth", block:"center" });
  });
  $("errBox").querySelectorAll("[data-share]").forEach(b => b.onclick = () => shareErrand(find(b.dataset.share)));
  $("errBox").querySelectorAll("[data-photo]").forEach(b => b.onclick = async () => {
    try{ const u = await api.receiptUrl(find(b.dataset.photo).photo_path); const v = document.createElement("div"); v.className = "viewer"; v.innerHTML = `<img src="${esc(u)}" alt="">`; v.onclick = () => v.remove(); document.body.append(v); }
    catch(e){ toast(PT.errMsg(e), 4000); }
  });
}

function modal(title, bodyHTML, onOk, okLabel){
  const ov = document.createElement("div"); ov.className = "overlay";
  ov.innerHTML = `<div class="sheet" style="max-width:520px"><div class="sheet-head"><h3>${title}</h3><button class="close-x">✕</button></div>${bodyHTML}
    <button class="primary-btn" data-ok>${okLabel || L("저장", "Save")}</button></div>`;

  const ok = ov.querySelector("[data-ok]");
  ok.onclick = async () => { ok.disabled = true; try{ if(await onOk(ov) !== false) close(); }catch(e){ toast(PT.errMsg(e), 4500); } ok.disabled = false; };
  return ov;
}
const readFields = root => { const o = {}; root.querySelectorAll("[data-f]").forEach(i => { o[i.dataset.f] = i.value.trim(); }); return o; };
const intOrBlank = v => v === "" || v == null ? "" : String(Math.max(0, Math.round(+String(v).replace(/[^\d.]/g, "")) || 0));

/* ---- 주소 → 지도 위치 (관리자 외부 주문 화면과 같은 방식: Google 키 있으면 Google → Photon → OpenStreetMap) ---- */
let gGeoKey = null, gLoadP = null;
/* Google 지도 JS (설정의 Google Maps 키) — 손님 주문 화면과 같은 'Places API (New)' 사용 */
function loadGoogleAdmin(){
  if(!gGeoKey) return Promise.reject(new Error("no key"));
  if(window.google && google.maps && google.maps.importLibrary) return Promise.resolve();
  return gLoadP = gLoadP || new Promise((res, rej) => { const sc = document.createElement("script");
    sc.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(gGeoKey)}&v=weekly&loading=async&language=en&region=PH&callback=__gadm`;
    window.__gadm = res; sc.onerror = () => { gLoadP = null; rej(new Error("google load")); }; document.head.append(sc); });
}
async function googleFind(q, c){
  await loadGoogleAdmin();
  const P = await google.maps.importLibrary("places");
  try{
    const { places } = await P.Place.searchByText({ textQuery: q, fields: ["location", "displayName", "formattedAddress"], region: "ph", language: "en",
      locationBias: { center: c, radius: 30000 }, maxResultCount: 1 });
    const pl = places && places[0];
    if(pl && pl.location) return { lat: pl.location.lat(), lng: pl.location.lng(), label: [pl.displayName, pl.formattedAddress].filter(Boolean).join(", ") };
  }catch(e){ console.warn("google text search", e); }
  const { suggestions } = await P.AutocompleteSuggestion.fetchAutocompleteSuggestions({ input: q, includedRegionCodes: ["ph"], language: "en", locationBias: { center: c, radius: 30000 }, origin: c });
  const pred = suggestions && suggestions.map(s => s.placePrediction).find(Boolean);
  if(!pred) return null;
  const place = pred.toPlace(); await place.fetchFields({ fields: ["displayName", "formattedAddress", "location"] });
  return place.location ? { lat: place.location.lat(), lng: place.location.lng(), label: [place.displayName, place.formattedAddress].filter(Boolean).join(", ") } : null;
}
async function photonFind(q, c){
  const r = await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&lat=${c.lat}&lon=${c.lng}&limit=1&lang=en&bbox=116.9,4.5,126.7,21.2`);
  const f = ((await r.json()).features || [])[0]; if(!f) return null;
  const pr = f.properties || {};
  return { lat: f.geometry.coordinates[1], lng: f.geometry.coordinates[0], label: [pr.name, pr.street, pr.district || pr.locality, pr.city].filter(Boolean).join(", ") };
}
async function nominatimFind(q, c){
  const r = await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=ph&viewbox=${c.lng - .3},${c.lat + .3},${c.lng + .3},${c.lat - .3}&q=${encodeURIComponent(q)}`, { headers: { "Accept-Language": "en" } });
  const j = (await r.json())[0]; return j ? { lat: +j.lat, lng: +j.lon, label: j.display_name } : null;
}
/* 주소 → 좌표: Google(키 있으면) → Photon → Nominatim, 주소를 여러 모양으로 바꿔가며 시도 */
async function geocodeAddr(text){
  const q = String(text || "").replace(/\s+/g, " ").trim();
  if(q.length < 3) return null;
  const c = (D && D.store && D.store.lat ? D.store : null) || CFG.STORE_LOCATION || { lat: 14.5695, lng: 120.989 };
  const pc = plusCode(q, c); if(pc) return { ...pc, label: "Plus code" };
  // 호수·층·방 번호는 지도 검색에 방해 → 뺀 버전도 시도
  const clean = q.replace(/\b(unit|rm|room|flr|floor|apt|suite|ste|no\.?|#)\s*[\w-]+/gi, "").replace(/\b\d+(st|nd|rd|th)?\s*(f|flr|floor)\b/gi, "").replace(/#\s*\d+\w*/g, "")
    .replace(/(\d+\s*호|\d+\s*층)/g, "").replace(/\s*,\s*,+/g, ",").replace(/^[\s,]+|[\s,]+$/g, "").trim();
  const parts = clean.split(",").map(s => s.trim()).filter(Boolean);
  const city = /manila|makati|pasay|taguig|pasig|quezon|mandaluyong|paranaque|parañaque|pateros|marikina|san juan|caloocan|malabon|navotas|valenzuela|las pi[nñ]as|muntinlupa|metro/i.test(q) ? "" : ", Manila";
  const tries = [q, clean + city, parts.slice(0, 2).join(", ") + city, parts.slice(-3).join(", ") + city]
    .map(s => s.replace(/^[\s,]+/, "").trim()).filter((x, i, a) => x.length > 2 && a.indexOf(x) === i);
  const near = p => p && Math.abs(p.lat - c.lat) < 1 && Math.abs(p.lng - c.lng) < 1;   // 가게에서 너무 먼 엉뚱한 결과는 버림
  const engines = [gGeoKey ? googleFind : null, photonFind, nominatimFind].filter(Boolean);
  for(const fn of engines) for(const t of tries){
    try{ const p = await fn(t, c); if(near(p)) return { ...p, approx: true }; }catch(e){ console.warn("geocode", fn.name, e); if(fn === googleFind) break; }
  }
  return null;
}
/* 구글 플러스코드 (HXCQ+X5 Manila / 7Q63HXCQ+X5) → 좌표 — Open Location Code 규격 */
function plusCode(text, ref){
  const m = String(text).toUpperCase().match(/(?:^|[^A-Z0-9])([23456789CFGHJMPQRVWX]{2,8}\+[23456789CFGHJMPQRVWX]{2,3})(?![A-Z0-9])/);
  if(!m) return null;
  const A = "23456789CFGHJMPQRVWX", PR = [20, 1, .05, .0025, .000125], sep = m[1].indexOf("+");
  if(sep % 2) return null;
  const digits = m[1].replace("+", "");
  const decode = d => { let lat = -90, lng = -180, n = Math.min(10, d.length - d.length % 2);
    for(let i = 0; i < n; i += 2){ lat += A.indexOf(d[i]) * PR[i / 2]; lng += A.indexOf(d[i + 1]) * PR[i / 2]; }
    const r = PR[n / 2 - 1]; return { lat: lat + r / 2, lng: lng + r / 2 }; };
  if(sep === 8) return decode(digits);
  if(!ref) return null;
  const pad = 8 - sep, res = Math.pow(20, 2 - pad / 2);
  let pre = "", la = ref.lat + 90, ln = ref.lng + 180;
  for(let i = 0; i < pad / 2; i++){ const a = Math.floor(la / PR[i]), b = Math.floor(ln / PR[i]); pre += A[a] + A[b]; la -= a * PR[i]; ln -= b * PR[i]; }
  const p = decode(pre + digits), h = res / 2;
  if(ref.lat + h < p.lat && p.lat - res >= -90) p.lat -= res; else if(ref.lat - h > p.lat && p.lat + res <= 90) p.lat += res;
  if(ref.lng + h < p.lng) p.lng -= res; else if(ref.lng - h > p.lng) p.lng += res;
  return p;
}

/* 붙여넣은 구글 지도 링크·좌표 → 위치 */
function parseLatLng(t){
  const s = decodeURIComponent(String(t || "")), ok = (a, b) => Math.abs(a) <= 90 && Math.abs(b) <= 180 && (a || b) ? { lat: a, lng: b } : null;
  let m = s.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/); if(m) return ok(+m[1], +m[2]);
  m = s.match(/[?&](?:q|query|ll|destination|daddr|center)=(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)/i); if(m) return ok(+m[1], +m[2]);
  m = s.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/); if(m) return ok(+m[1], +m[2]);
  m = s.match(/(-?\d{1,2}\.\d{3,})\s*[,\s]\s*(-?\d{1,3}\.\d{3,})/); return m ? ok(+m[1], +m[2]) : null;
}
/* 구글 지도 링크에서 장소 이름·주소 꺼내기 (/maps/search/주소, /maps/place/이름, ?q=주소) */
function linkText(url){
  try{
    const u = new URL(url);
    const q = u.searchParams.get("q") || u.searchParams.get("query") || u.searchParams.get("destination") || u.searchParams.get("daddr") || u.searchParams.get("address");
    if(q && !/^-?\d+\.\d+\s*,/.test(q)) return q.replace(/\+/g, " ");
    const m = u.pathname.match(/\/(?:search|place|dir\/[^/]*)\/([^/@]+)/);
    if(m) return decodeURIComponent(m[1].replace(/\+/g, " "));
  }catch(e){}
  return null;
}
/* 붙여넣은 것 → 위치. 링크(좌표 → 링크 속 주소 → 짧은 링크 풀기) 또는 그냥 주소 글자 */
async function resolveMapLink(t){
  t = String(t || "").trim();
  const p = parseLatLng(t); if(p) return p;
  const url = (t.match(/https?:\/\/\S+/) || [])[0];
  if(!url) return await geocodeAddr(t);
  const inLink = linkText(url);
  if(inLink){ const g = await geocodeAddr(inLink); if(g) return { ...g, text: inLink }; }
  try{
    const r = await fetch("/api/maplink?u=" + encodeURIComponent(url)), j = await r.json();
    if(j.lat != null) return { lat: +j.lat, lng: +j.lng, text: j.q || inLink };
    if(j.q){ const g = await geocodeAddr(j.q); if(g) return { ...g, text: j.q }; }
  }catch(e){}
  return null;
}

}
function drawMap(){
  if(!map || !layer || !D) return;
  const Lf = window.L; layer.clearLayers();
  const pts = [], focus = [];
  if(D.store && D.store.lat){ Lf.marker([D.store.lat, D.store.lng], { icon: pinIcon("store", "🌶", 32) }).addTo(layer).bindTooltip(L("가게", "Store")); pts.push([D.store.lat, D.store.lng]); }
  (D.orders || []).filter(o => o.lat != null).forEach(o => {
    Lf.marker([o.lat, o.lng], { icon: pinIcon("home", "#" + o.order_no, 32) }).addTo(layer).bindTooltip(`#${esc(o.order_no)} ${esc(o.cust_name)}`); pts.push([o.lat, o.lng]);
    if(D.loc && o.status === "delivering") Lf.polyline([[D.loc.lat, D.loc.lng], [o.lat, o.lng]], { color:"#2a6fd3", weight:2, dashArray:"6 6", opacity:.7 }).addTo(layer);
  });
  (D.errands || []).forEach(e => {
    const open = ["assigned","going"].includes(e.status), sel = selErrand === e.id;
    if(e.lat == null || (!open && !sel)) return;
    Lf.marker([e.lat, e.lng], { icon: pinIcon("errand" + (sel ? " sel" : ""), sel ? "🧾" : String(errandNo(e) || "🧾"), sel ? 38 : 32), zIndexOffset: sel ? 900 : 0 }).addTo(layer)
      .bindTooltip(`🧾 ${esc(e.title)}${e.place ? " · " + esc(e.place) : ""}`, sel ? { permanent:true, direction:"top", offset:[0, -20] } : {});
    pts.push([e.lat, e.lng]); if(sel) focus.push([e.lat, e.lng]);
    if(D.loc && e.status === "going") Lf.polyline([[D.loc.lat, D.loc.lng], [e.lat, e.lng]], { color:"#e07b1a", weight:2, dashArray:"6 6", opacity:.8 }).addTo(layer);
  });
  // 선택한 심부름의 지나온 길
  let note = "";
  if(selErrand){
    const e = (D.errands || []).find(x => x.id === selErrand);
    if(trail.length > 1){
      Lf.polyline(trail, { color:"#d33d2a", weight:5, opacity:.85 }).addTo(layer);
      Lf.marker(trail[0], { icon: pinIcon("dot", "", 16) }).addTo(layer).bindTooltip(L("출발", "Start"));
      trail.forEach(p => focus.push(p));
      note = L(`🧾 '${e ? e.title : ""}' 이동 경로 · 점 ${trail.length}개${e && e.started_at ? ` · ${tm(e.started_at)}${e.done_at ? " → " + tm(e.done_at) : " ~ 지금"}` : ""}`, `🧾 Route for '${e ? e.title : ""}' · ${trail.length} points`);
    } else note = L("🧾 이 심부름은 아직 이동 기록이 없어요 (기사가 '출발'을 누른 뒤부터 근무 중 위치가 기록돼요)", "🧾 No route yet — it's recorded after the rider taps 'Start' (while on duty)");
  }
  if(D.loc){
    const s = ageSec(D.loc.at), stale = !D.rider.on_duty || s == null || s > STALE;
    Lf.marker([D.loc.lat, D.loc.lng], { icon: Lf.divIcon({ className:"", html:`<div class="rd-rider ${stale ? "stale" : ""}"><img src="${RIDER_IMG}" alt="🛵"></div>`, iconSize:[52, 57], iconAnchor:[26, 54] }), zIndexOffset: 1000 })
      .addTo(layer).bindTooltip(`<b>${esc(D.rider.name)}</b> · ${ageText(s)}`, { permanent:true, direction:"top", offset:[0, -56], opacity:.95 });
    if(D.loc.accuracy > 30) Lf.circle([D.loc.lat, D.loc.lng], { radius: D.loc.accuracy, color:"#d33d2a", weight:1, fillOpacity:.06 }).addTo(layer);
    pts.push([D.loc.lat, D.loc.lng]);
  }
  $("mapNote").textContent = note || L("🛵 기사 · 🌶 가게 · 🔵#번호 배달지 · 🟠번호 심부름 장소 (심부름 '🗺 지도·경로'를 누르면 지나온 길이 보여요)", "🛵 rider · 🌶 store · 🔵# drop-off · 🟠 errand place (tap '🗺 Map · route' on an errand to see its path)");
  $("mapChips").innerHTML = selErrand ? `<button class="chip" id="clrRoute">✕ ${L("경로 끄기", "Hide route")}</button>` : "";
  if($("clrRoute")) $("clrRoute").onclick = () => { selErrand = null; trail = []; fitted = false; renderErrands(); drawMap(); };
  if(!fitted){
    const f = focus.length ? focus : pts;
    if(f.length > 1) map.fitBounds(f, { padding:[40, 40], maxZoom:16 }); else if(f.length) map.setView(f[0], 15);
    fitted = true;
  }
}

boot();
</script>
</body>
