<style>
  :root{
    --ink:#241812; --ink-soft:#5c4a3e; --bg:#faf3ea; --surface:#ffffff; --surface-2:#fff8ef;
    --line:#ecdfce; --red:#d33d2a; --red-deep:#a92a1b; --muted:#8a7868; --green:#2f8f4e; --blue:#2a6fd3;
    --shadow:0 -10px 30px -12px rgba(36,24,18,.35); color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#f3e9dd; --ink-soft:#cbb9a8; --bg:#1c130f; --surface:#271b15; --surface-2:#2f2118;
      --line:#3c2c22; --red:#ef5c46; --red-deep:#ff7a63; --muted:#9c8979; --green:#4fbf73; --blue:#5b95ef;
      --shadow:0 -10px 30px -12px rgba(0,0,0,.7); color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --ink:#f3e9dd; --ink-soft:#cbb9a8; --bg:#1c130f; --surface:#271b15; --surface-2:#2f2118;
    --line:#3c2c22; --red:#ef5c46; --red-deep:#ff7a63; --muted:#9c8979; --green:#4fbf73; --blue:#5b95ef; color-scheme:dark;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{background:var(--bg);color:var(--ink);font:14px/1.45 'Noto Sans KR',system-ui,-apple-system,sans-serif;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent;overflow:hidden;}
  button{font:inherit;color:inherit;}
  .top{position:fixed;top:0;left:0;right:0;z-index:500;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:linear-gradient(var(--bg) 60%, transparent);pointer-events:none;}
  .top > *{pointer-events:auto;}
  .top img{width:38px;height:38px;object-fit:contain;}
  .top h1{flex:1;margin:0;font:400 19px/1 'Black Han Sans','Noto Sans KR',sans-serif;color:var(--red);}
  .top h1 small{display:block;margin-top:3px;font:500 11px 'Noto Sans KR',sans-serif;color:var(--muted);letter-spacing:.4px;}
  .lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface);}
  .lang button{border:0;background:none;padding:6px 10px;font-size:11px;font-weight:700;color:var(--ink-soft);cursor:pointer;}
  .lang button.sel{background:var(--ink);color:var(--bg);}
  #map{position:fixed;inset:0;z-index:1;background:var(--surface-2);}
  .leaflet-control-attribution{font-size:9px;}
  .recenter{position:fixed;right:14px;z-index:500;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);box-shadow:0 4px 14px rgba(0,0,0,.18);font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:500;background:var(--surface);border-radius:22px 22px 0 0;box-shadow:var(--shadow);padding:10px 18px calc(18px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;}
  .grab{width:38px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 12px;}
  .eta{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;}
  .eta .big{font:400 30px/1 'Black Han Sans','Noto Sans KR',sans-serif;color:var(--ink);}
  .eta .big em{font-style:normal;color:var(--red);}
  .eta .sub{font-size:13px;color:var(--ink-soft);margin-top:6px;}
  .eta .no{font:400 22px/1 'Black Han Sans',sans-serif;color:var(--red);white-space:nowrap;}
  .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:16px 0 4px;}
  .step{position:relative;text-align:center;font-size:11.5px;font-weight:700;color:var(--muted);padding-top:14px;}
  .step::before{content:"";position:absolute;top:0;left:0;right:0;height:5px;border-radius:5px;background:var(--line);}
  .step.on{color:var(--ink);} .step.on::before{background:var(--red);}
  .step.now::before{background:linear-gradient(90deg,var(--red) 0 50%,var(--line) 50%);background-size:200% 100%;animation:flow 1.6s linear infinite;}
  @keyframes flow{from{background-position:100% 0}to{background-position:0 0}}
  .rider{display:flex;align-items:center;gap:12px;margin-top:14px;padding:12px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);}
  .rider .av img{width:88%;height:88%;object-fit:contain;}
  .rider .av{width:42px;height:42px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0;}
  .rider b{display:block;font-size:15px;}
  .rider small{color:var(--muted);font-size:12px;}
  .rider .info{flex:1;min-width:0;}
  .call{display:flex;align-items:center;gap:6px;text-decoration:none;color:#fff;background:var(--green);border-radius:999px;padding:9px 14px;font-weight:800;font-size:13px;white-space:nowrap;}
  .live{display:inline-flex;align-items:center;gap:5px;}
  .live i{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 1.4s infinite;}
  .live.stale i{background:#e5a731;animation:none;}
  @keyframes pulse{50%{opacity:.25}}
  .msg{text-align:center;padding:8px 4px 4px;}
  .msg .ico{font-size:40px;}
  .msg b{display:block;font-size:17px;margin-top:4px;}
  .msg p{margin:6px 0 0;color:var(--ink-soft);font-size:13px;}
  .back{display:block;text-align:center;margin-top:12px;color:var(--muted);font-size:12px;}
  .demo{margin:10px 0 0;padding:7px 10px;border-radius:10px;background:#fff1c9;color:#6b4e00;font-size:11.5px;text-align:center;}
  .recenter[hidden]{display:none;}
  .pin{position:relative;display:flex;align-items:center;justify-content:center;border-radius:50%;border:3px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.35);font-size:18px;line-height:1;}
  .rdr-mk{position:relative;width:66px;height:72px;}
  .rdr-mk img{position:relative;z-index:1;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35));transition:transform .3s;}
  .rdr-mk.flip img{transform:scaleX(-1);}
  .rdr-mk::before{content:"";position:absolute;left:50%;bottom:-2px;width:46px;height:14px;margin-left:-23px;border-radius:50%;background:rgba(211,61,42,.35);animation:rdrpulse 1.8s ease-out infinite;}
  @keyframes rdrpulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.6);opacity:0}}
  @keyframes ring{from{transform:scale(.7);opacity:.7}to{transform:scale(1.4);opacity:0}}
  .pin.home{background:var(--blue);width:36px;height:36px;}
  .pin.home.approx{opacity:.92;}
  .pin.home.approx::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:2px dashed var(--blue);opacity:.6;}
  .pin.store{background:#fff;width:34px;height:34px;overflow:hidden;}
  .pin.store img{width:100%;height:100%;object-fit:contain;display:block;}
</style>
</head>

if(q.get("lang") === "en" || q.get("lang") === "ko") LANG = q.get("lang");
const T = (ko, en) => LANG === "en" ? en : ko;
function paintLang(){ $("langSw").querySelectorAll("button").forEach(b => b.classList.toggle("sel", b.dataset.l === LANG)); document.documentElement.lang = LANG; $("topSub").textContent = IS_E ? T("심부름 · 실시간 위치", "Live errand tracking") : T("배달 위치 · 실시간", "Live delivery tracking");
  if(IS_E) document.title = T("심부름 위치 · 빨통 PAL TONG", "Errand tracking · PAL TONG"); }
$("langSw").onclick = e => { const l = e.target.dataset.l; if(!l) return; LANG = l; try{ localStorage.setItem("paltong_lang", JSON.stringify(l)); }catch(e){} paintLang(); render(); };
paintLang();

/* ---- 거리·도착 예상 ---- */
function km(a, b){ const R = 6371, r = x => x * Math.PI / 180, dLat = r(b.lat - a.lat), dLng = r(b.lng - a.lng);
  const h = Math.sin(dLat/2)**2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLng/2)**2; return 2 * R * Math.asin(Math.sqrt(h)); }
const ROAD = 1.35, KMH = 18;   // 마닐라 오토바이 평균 (직선거리 × 1.35, 시속 18km)
function etaMin(d){ return Math.max(1, Math.round(d * ROAD / KMH * 60 + 1)); }
function agoText(sec){ return sec < 10 ? T("방금", "just now") : sec < 60 ? T(`${sec}초 전`, `${sec}s ago`) : T(`${Math.floor(sec/60)}분 전`, `${Math.floor(sec/60)} min ago`); }

/* ---- 지도 ---- */
const map = L.map("map", { zoomControl:false, attributionControl:true }).setView([CFG.STORE_LOCATION?.lat || 14.5695, CFG.STORE_LOCATION?.lng || 120.989], 15);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom:19, attribution:"© OpenStreetMap" }).addTo(map);
const icon = (cls, html, size) => L.divIcon({ className:"", html:`<div class="pin ${cls}">${html}</div>`, iconSize:[size, size], iconAnchor:[size/2, size/2] });
let mStore, mHome, mRider, trail, follow = true, fitted = false;
map.on("dragstart", () => { follow = false; $("recenter").hidden = false; });
$("recenter").onclick = () => { follow = true; fitted = false; $("recenter").hidden = true; drawMap(); };
function placeRecenter(){ $("recenter").style.bottom = ($("sheet").offsetHeight + 14) + "px"; }

/* 기사 마커를 부드럽게 이동 */
let anim = null;
function moveRider(to){
  if(!mRider){ mRider = L.marker([to.lat, to.lng], { icon: L.divIcon({ className:"", html:`<div class="rdr-mk"><img src="${RIDER_IMG}" alt="🛵"></div>`,
    iconSize:[66, 72], iconAnchor:[33, 68] }), zIndexOffset: 1000 }).addTo(map); return; }
  const from = mRider.getLatLng(), t0 = performance.now(), dur = 1200;
  { const el = mRider.getElement(), mk = el && el.querySelector(".rdr-mk"), dx = to.lng - from.lng;
    if(mk && Math.abs(dx) > 0.00003) mk.classList.toggle("flip", dx < 0); }
  cancelAnimationFrame(anim);
  const step = t => { const k = Math.min(1, (t - t0) / dur), e = k < .5 ? 2*k*k : 1 - (-2*k + 2)**2 / 2;
    mRider.setLatLng([from.lat + (to.lat - from.lat) * e, from.lng + (to.lng - from.lng) * e]); if(k < 1) anim = requestAnimationFrame(step); };
  anim = requestAnimationFrame(step);
}
function drawMap(){
  if(!D) return;
  if(D.store && D.store.lat != null && !mStore) mStore = L.marker([D.store.lat, D.store.lng], { icon: icon("store", `<img src="${LOGO}" alt="">`, 34) }).addTo(map);
  const dest = DEST();
  if(dest){
    const cls = dest.approx ? "home approx" : "home";
    if(!mHome || mHome._cls !== cls){ if(mHome) mHome.remove(); mHome = L.marker([dest.lat, dest.lng], { icon: icon(cls, "🏠", 36), zIndexOffset: 500 }).addTo(map); mHome._cls = cls;
      mHome.bindTooltip(dest.approx ? T("주소로 찾은 대략 위치", "Approximate (from address)") : IS_E ? T("도착할 곳", "Destination") : T("배달 받을 곳", "Drop-off"), { direction:"top", offset:[0, -20] }); }
    else mHome.setLatLng([dest.lat, dest.lng]);
  } else if(mHome){ mHome.remove(); mHome = null; }
  const pts = (D.trail || []).map(p => [p[0], p[1]]);
  if(D.loc) pts.push([D.loc.lat, D.loc.lng]);
  if(pts.length > 1){ if(!trail) trail = L.polyline(pts, { color:"#d33d2a", weight:5, opacity:.55, lineCap:"round" }).addTo(map); else trail.setLatLngs(pts); }
  else if(trail){ trail.remove(); trail = null; }
  if(D.loc) moveRider(D.loc); else if(mRider){ mRider.remove(); mRider = null; }
  if(follow){
    const b = [D.loc, dest, !D.loc ? D.store : null].filter(Boolean).map(p => [p.lat, p.lng]);
    const pad = { paddingTopLeft:[40, 90], paddingBottomRight:[40, $("sheet").offsetHeight + 30], maxZoom:17 };
    if(b.length > 1) map.flyToBounds(b, { ...pad, duration: fitted ? .8 : 0 }); else if(b.length) map.setView(b[0], 16);
    fitted = true;
  }
}

/* ---- 손님 위치: 도착 핀이 없으면 주소로 대략 위치 찾기 ---- */
let guess = null, guessFor = null;
const DEST = () => D && D.dest && D.dest.lat != null ? D.dest : guess;
async function guessDest(){
  if(!D || (D.dest && D.dest.lat != null) || !D.addr || D.order_type === "pickup" || guessFor === D.addr) return;
  guessFor = D.addr;
  const c = D.store && D.store.lat != null ? D.store : (CFG.STORE_LOCATION || { lat:14.5695, lng:120.989 });
  const q = String(D.addr).replace(/\s+/g, " ").trim();
  for(const t of [q, q.split(",").slice(-3).join(",")].filter((x, i, a) => x.trim() && a.indexOf(x) === i)){
    try{
      const r = await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(t)}&lat=${c.lat}&lon=${c.lng}&limit=1&lang=en&bbox=116.9,4.5,126.7,21.2`);
      const f = ((await r.json()).features || [])[0];
      if(f && km(c, { lat: f.geometry.coordinates[1], lng: f.geometry.coordinates[0] }) < 60){
        guess = { lat: f.geometry.coordinates[1], lng: f.geometry.coordinates[0], approx: true }; fitted = false; render(); drawMap(); return; }
    }catch(e){ console.warn("geocode", e); }
  }
}

/* ---- 화면 ---- */
let D = null, lastErr = null;
function steps(){
  const s = D.status, i = s === "done" ? 3 : s === "delivering" ? 2 : 1;
  const lab = IS_E ? [T("출발 전", "Not started"), T("이동 중", "On the way"), T("완료", "Done")] : [T("조리 중", "Preparing"), T("배달 중", "On the way"), T("도착", "Delivered")];
  return `<div class="steps">${lab.map((l, k) => `<div class="step ${k < i ? "on" : ""} ${k === i - 1 && s !== "done" ? "now" : ""}">${l}</div>`).join("")}</div>`;
}
function render(){
  const B = $("body");
  if(!D){ B.innerHTML = lastErr ? `<div class="msg"><div class="ico">😥</div><b>${IS_E ? T("심부름을 찾을 수 없어요", "Errand not found") : T("주문을 찾을 수 없어요", "Order not found")}</b><p>${T("링크를 다시 확인해주세요.", "Please check the link again.")}</p></div>` : B.innerHTML; placeRecenter(); return; }
  const no = IS_E ? `<div class="no">🧾</div>` : `<div class="no">🛵</div>`   /* 손님에게 주문번호는 안 보여줌 */, back = `<a class="back" href="./">${T("← 주문 화면으로", "← Back to my order")}</a>`;
  const etitle = IS_E ? `<div class="sub" style="margin:2px 0 8px;font-size:14px;color:var(--ink,#241812)"><b>${esc(D.title || "")}</b>${D.addr ? `<br>📍 ${esc(D.addr)}` : ""}</div>` : "";
  const demo = DEMO ? `<div class="demo">${T("미리보기 화면 — 실제 주문이 아닌 예시 움직임입니다", "Preview — simulated rider, not a real order")}</div>` : "";
  let html;
  if(D.status === "cancelled"){
    html = `<div class="msg"><div class="ico">🙏</div><b>${IS_E ? T("취소된 심부름이에요", "This errand was cancelled") : T("취소된 주문이에요", "This order was cancelled")}</b></div>`;
  } else if(D.order_type === "pickup"){
    html = `<div class="msg"><div class="ico">🏃</div><b>${T("픽업 주문이에요", "This is a pickup order")}</b><p>📍 ${esc(D.store?.addr || "")}</p></div>`;
  } else if(D.status === "done"){
    const t = D.delivered_at ? new Date(D.delivered_at).toLocaleTimeString(LANG === "en" ? "en-US" : "ko-KR", { hour:"numeric", minute:"2-digit" }) : "";
    html = IS_E ? `<div class="eta"><div><div class="big">${T("심부름 완료!", "Errand done!")}</div><div class="sub">${t ? T(`${t}에 끝났어요 🙏`, `Finished at ${t} 🙏`) : "🙏"}</div></div>${no}</div>${etitle}${steps()}`
      : `<div class="eta"><div><div class="big">${T("배달 완료!", "Delivered!")}</div><div class="sub">${t ? T(`${t}에 도착했어요. 맛있게 드세요 🙏`, `Arrived at ${t}. Enjoy your meal 🙏`) : T("맛있게 드세요 🙏", "Enjoy your meal 🙏")}</div></div>${no}</div>${steps()}`;
  } else if(D.status === "delivering"){
    const sec = D.loc ? Math.max(0, Math.round((Date.now() - new Date(D.loc.at).getTime() - clockSkew) / 1000)) : null;
    const dest = DEST(), d = D.loc && dest ? km(D.loc, dest) : null, stale = sec != null && sec > 90;
    const near = d != null && d < 0.15;
    const big = d == null ? (IS_E ? T("이동 중", "On the way") : T("배달 중", "On the way")) : near ? T("거의 도착했어요!", "Almost there!") : T(`약 <em>${etaMin(d)}</em>분 후 도착`, `Arriving in <em>${etaMin(d)}</em> min`);
    const sub = d == null ? (D.loc ? T("기사님 위치를 보고 있어요", "Watching your rider") : T("기사님 위치를 기다리는 중…", "Waiting for the rider's location…"))
      : `${T("남은 거리", "Distance")} ${(d * ROAD).toFixed(1)} km · ${T("예상 시간이에요", "estimate")}`;
    const r = D.rider;
    html = `<div class="eta"><div><div class="big">${big}</div><div class="sub">${sub}</div></div>${no}</div>${etitle}${steps()}
      ${r ? `<div class="rider"><div class="av" style="background:#fff3ec"><img src="${RIDER_IMG}" alt="🛵"></div><div class="info"><b>${esc(r.name)} ${T("기사님", "")}</b>
        <small>${sec == null ? T("위치 정보 없음", "No location yet") : `<span class="live ${stale ? "stale" : ""}"><i></i>${stale ? T(`마지막 위치 ${agoText(sec)}`, `Last seen ${agoText(sec)}`) : T(`실시간 · ${agoText(sec)}`, `Live · ${agoText(sec)}`)}</span>`}</small></div>
        ${r.phone ? `<a class="call" href="tel:${esc(String(r.phone).replace(/[^\d+]/g, ""))}">📞 ${T("전화", "Call")}</a>` : ""}</div>` : ""}`;
  } else {
    html = IS_E ? `<div class="eta"><div><div class="big">${T("곧 출발해요", "Starting soon")}</div><div class="sub">${D.rider ? T(`${esc(D.rider.name)} 기사님이 출발하면 여기서 위치를 볼 수 있어요`, `You can follow ${esc(D.rider.name)} here once they leave`) : T("기사님이 출발하면 여기서 위치를 볼 수 있어요", "You can follow the rider here once they leave")}</div></div>${no}</div>${etitle}${steps()}`
      : `<div class="eta"><div><div class="big">${T("조리 중이에요", "We're cooking")}</div><div class="sub">${T("기사님이 출발하면 여기서 위치를 볼 수 있어요", "You can follow the rider here once it leaves")}</div></div>${no}</div>${steps()}`;
  }
  B.innerHTML = html + demo + (DEMO || IS_E || D.source === "external" ? "" : back);
  placeRecenter();
}

/* ---- 데이터 ---- */
let clockSkew = 0, timer = null;
const sb = !DEMO && CFG.SUPABASE_URL ? supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, { auth:{ persistSession:false } }) : null;
async function load(){
  clearTimeout(timer);
  try{
    const r = DEMO ? demoData() : IS_E ? await sb.rpc("get_errand_tracking", { p_id: ERRAND_ID }) : await sb.rpc("get_tracking", { p_id: ORDER_ID });
    if(r.error) throw r.error;
    if(!r.data){ lastErr = "notfound"; D = null; render(); return; }
    D = r.data; lastErr = null;
    if(D.now) clockSkew = Date.now() - new Date(D.now).getTime();
    render(); drawMap(); guessDest();
  }catch(e){ console.error(e); if(!D){ lastErr = e; render(); } }
  const live = D && D.status === "delivering";
  if(!D || !["done","cancelled"].includes(D.status)) timer = setTimeout(load, document.hidden ? 30000 : live ? 5000 : 15000);
}
document.addEventListener("visibilitychange", () => { if(!document.hidden) load(); });
setInterval(() => { if(D && D.status === "delivering") render(); }, 5000);   // '몇 초 전' 갱신
window.addEventListener("resize", placeRecenter);

/* ---- 미리보기 (링크에 id 가 없을 때): 기사가 가게 → 손님 집으로 움직이는 예시 ---- */
const demoT0 = Date.now();
function demoData(){
  const st = { lat: CFG.STORE_LOCATION?.lat || 14.5695, lng: CFG.STORE_LOCATION?.lng || 120.989 }, de = { lat: st.lat - 0.012, lng: st.lng + 0.009 };
  const path = [st, { lat: st.lat - 0.004, lng: st.lng + 0.001 }, { lat: st.lat - 0.006, lng: st.lng + 0.006 }, { lat: st.lat - 0.010, lng: st.lng + 0.007 }, de];
  const k = Math.min(1, (Date.now() - demoT0) / 90000), seg = Math.min(path.length - 2, Math.floor(k * (path.length - 1))), f = k * (path.length - 1) - seg;
  const at = (a, b, t) => ({ lat: a.lat + (b.lat - a.lat) * t, lng: a.lng + (b.lng - a.lng) * t });
  const loc = at(path[seg], path[seg + 1], f), trailPts = [...path.slice(0, seg + 1), loc].map(p => [p.lat, p.lng]);
  const done = k >= 1;
  return { data: { order_no: 7, status: done ? "done" : "delivering", order_type: "delivery", dest: de, store: { ...st, addr: "Malate, Manila" },
    rider: { name: "Mark", phone: done ? null : "09170000000" }, loc: done ? null : { ...loc, at: new Date().toISOString() }, trail: done ? [] : trailPts,
    delivered_at: done ? new Date().toISOString() : null, now: new Date().toISOString() } };
}
load();
</script>
</body>
</html>
